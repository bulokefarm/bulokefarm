# A second copy of the records, off Supabase. The free plan has no
# backups, and these are records you may need years from now.
name: Weekly backup
on:
  schedule:
    - cron: "0 15 * * 0"      # Sunday 15:00 UTC ≈ 02:00 AEDT Monday
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Dump
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$PGCONN" --no-owner --no-privileges -f buloke-$(date +%F).sql
      - uses: actions/upload-artifact@v4
        with:
          name: buloke-backup
          path: buloke-*.sql
          retention-days: 90
