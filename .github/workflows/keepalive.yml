# Supabase pauses a free project after a week without database activity.
# A farm app goes quiet between musters, so this pokes it on weekdays.
# Delete this workflow if you move to the paid plan.
name: Keep database awake
on:
  schedule:
    - cron: "17 21 * * 1-5"   # 21:17 UTC ≈ 08:17 AEDT next day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Not a secret — this is in the app's HTML. Keeping it visible
      # means a typo here is something you can actually see.
      URL: https://hgnzignikbpdbbyubahu.supabase.co
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query the database
        run: |
          echo "Calling: $URL/rest/v1/heartbeat?select=ok&limit=1"
          body=$(curl -s -w '\n%{http_code}' \
            "$URL/rest/v1/heartbeat?select=ok&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          code=$(echo "$body" | tail -1)
          echo "HTTP $code"
          echo "Response: $(echo "$body" | head -n -1)"
          [ "$code" = "200" ] || exit 1
