<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Records — Buloke Farm</title>
<style>
:root{
  --paper:#F2F2EE;--card:#FFF;--ink:#16150F;--ink2:#5A574E;--rule:#D9D6CC;
  --accent:#12564F;--accent-soft:#E2EDEA;--danger:#8C2F2A;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.sheet{max-width:1100px;margin:0 auto;padding:22px 20px 60px}

.masthead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);
  padding-bottom:12px;margin-bottom:6px}
.masthead h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.masthead .pic{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.5}
.masthead .pic b{font-family:var(--mono);color:var(--ink)}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  padding:14px 0 18px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.controls label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.controls input,.controls select{display:block;margin-top:4px;border:1px solid var(--rule);
  border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:var(--card)}
button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;
  background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}

/* Joining register action bar — same furniture as the report controls,
   but scoped to one section rather than the page. */
.jbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;margin-bottom:10px}
.jbar label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.jbar input,.jbar select{display:block;margin-top:4px;border:1px solid var(--rule);
  border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--paper)}
.jbar .count{margin-left:auto;align-self:center;font-size:13px;color:var(--ink2)}
td.tick,th.tick{width:30px;padding-right:0}
input.jck{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

section{margin-top:30px;page-break-inside:auto}
section > h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 3px;
  padding-bottom:6px;border-bottom:1px solid var(--ink)}
section > p.lede{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px solid var(--ink);padding:7px 8px;vertical-align:bottom;font-weight:700}
td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
tr{page-break-inside:avoid}
td.m,th.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.tags{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.5}
td.num{text-align:right;font-family:var(--mono)}
th.num{text-align:right}
section h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);margin:18px 0 4px;font-weight:700}
.flag{display:inline-block;background:#F7E4E2;color:var(--danger);border-radius:4px;
  padding:1px 6px;font-size:11px;font-weight:700}
.ok{color:var(--accent);font-weight:600}
.none{color:var(--ink2);font-style:italic;padding:14px 8px}
.gap{background:#FCF3E3;border-left:3px solid #8F5A0C;padding:11px 13px;font-size:13px;margin-top:12px}
.sig{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:26px;font-size:12px;color:var(--ink2)}
.sig div{border-top:1px solid var(--ink);padding-top:6px}
tr.ed{cursor:pointer}
tr.ed:hover td{background:var(--accent-soft)}
.srclink{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline dotted}
.edits{display:inline-block;background:#FCF3E3;color:#8F5A0C;border-radius:4px;
  padding:1px 5px;font-size:10.5px;font-weight:700;margin-left:5px}
#veil{position:fixed;inset:0;background:rgba(22,21,15,.45);display:none;z-index:40}
#veil.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);
  border-left:1px solid var(--rule);z-index:50;overflow-y:auto;transform:translateX(100%);
  transition:transform .18s ease-out;padding:20px 20px 40px}
#drawer.on{transform:none}
#drawer h3{margin:0 0 4px;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
#drawer .sub{font-size:12.5px;color:var(--ink2);margin:0 0 16px}
#drawer label{display:block;margin-bottom:11px}
#drawer label span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
#drawer input[type=text],#drawer input[type=date],#drawer input[type=number],
#drawer select,#drawer textarea{width:100%;border:1px solid var(--rule);border-radius:8px;
  padding:9px 11px;font:inherit;font-size:14px;background:var(--card)}
#drawer .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#drawer button{width:100%;margin-top:8px;min-height:44px}
#drawer button.warn{background:var(--card);color:var(--danger);border:1px solid var(--rule)}
.hist{margin-top:20px;border-top:1px solid var(--rule);padding-top:12px}
.hist h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hist li{font-size:12px;color:var(--ink2);margin-bottom:7px;list-style:none;line-height:1.5}
.hist li b{color:var(--ink);font-weight:600}
@media print{#veil,#drawer{display:none !important}}
footer{margin-top:34px;padding-top:10px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between}

@media print{
  body{background:#fff;font-size:11px}
  .sheet{max-width:none;padding:0}
  .controls,.noprint{display:none !important}
  section{margin-top:20px}
  table{font-size:10px}
  thead{display:table-header-group}
  @page{margin:14mm;size:A4 landscape}
}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <img src="/mark.png" alt="" width="28" height="28" style="flex:none"><h1 id="tradingname">Buloke Farm</h1>
    <div class="pic" id="letterhead">&nbsp;</div>
    <button id="navbtn" class="noprint" aria-label="Menu">&#8801;</button>
  </div>

  <div class="controls noprint">
    <label>From<input type="date" id="from"></label>
    <label>To<input type="date" id="to"></label>
    <label>Period<select id="preset">
      <option value="">Custom</option>
      <option value="fy">This financial year</option>
      <option value="fyl">Last financial year</option>
      <option value="12">Last 12 months</option>
      <option value="all" selected>Everything</option>
    </select></label>
    <button id="go">Show records</button>
    <label>Stock<select id="sp">
      <option value="">All stock</option>
      <option value="cattle">Cattle</option>
      <option value="sheep">Sheep</option>
    </select></label>
    <button class="ghost" id="print">Print / save as PDF</button>
    <button class="ghost" id="addfeed">+ Add feed to store</button>
    <button class="ghost" id="addspray">+ Record spraying</button>
  </div>

  <div id="out"></div>
</div>
<div id="veil"></div>
<aside id="drawer"></aside>
<div style="display:none">
</div>

<script type="module">
const SUPABASE_URL  = "https://hgnzignikbpdbbyubahu.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnppZ25pa2JwZGJieXViYWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTgzNTcsImV4cCI6MjEwMTEzNDM1N30.U5vvmmZfSP0SOXsvLaxpjJ6LjWjOvaOYwTZ9VKyfFs0";
let createClient;
try      { ({ createClient } = await import("/vendor/supabase.js")); }
catch(e) { console.warn("vendor/supabase.js failed — falling back to esm.sh", e);
           ({ createClient } = await import("https://esm.sh/@supabase/supabase-js@2")); }

const timedFetch = (url, opts = {}) => {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 15000);
  return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t));
};
const db = createClient(SUPABASE_URL, SUPABASE_ANON, { global: { fetch: timedFetch } });

const $ = s => document.querySelector(s);

// A joining has one dam, so it has one species. A drench run or a
// truckload can carry both, so those views report which species were
// involved and the filter asks "was this species on it" rather than
// pretending each record belongs to one.
const SP = () => $("#sp") ? $("#sp").value : "";
const involves = row => !SP() || (row.species || "cattle").includes(SP());
const isSp = row => !SP() || (row.species || "cattle") === SP();

// Bull to cows, ram to ewes. Same row in the same table, different word.
const SIRE_WORD = { cattle: "bull", sheep: "ram" };

// The letterhead is a fact about the business, not a string in the
// markup. With a second PIC on the same land there is more than one
// right answer, and the primary registration is the one this page
// trades under.
let HOME = { pic: "", trading_name: "Buloke Farm", address: "" };

// Paddocks, for the spray editor. Loaded once — the list changes a
// couple of times a year, not a couple of times a session.
let PADDOCKS = [];
async function loadPaddocks(){
  const { data, error } = await db.from("paddock").select("id,name,area_ha")
    .is("retired_on", null).order("sort_order").order("name");
  if(error) console.error("paddocks:", error.message);
  PADDOCKS = data || [];
}

async function loadHome(){
  const { data } = await db.from("property")
    .select("pic,trading_name,address").eq("is_primary", true).maybeSingle();
  if(data) HOME = { ...HOME, ...data };
  document.getElementById("tradingname").textContent = HOME.trading_name || "Buloke Farm";
  document.getElementById("letterhead").innerHTML =
    `${esc(HOME.address||"")}<br>PIC <b>${esc(HOME.pic||"—")}</b>`;
}
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Local calendar day. toISOString() gives the UTC day, which is still
// yesterday here until 10am AEST — so a date recorded first thing in
// the morning would be written a day early.
const localDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`
  + `-${String(d.getDate()).padStart(2,"0")}`;
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const dash = v => (v===null||v===undefined||v==="") ? '<span class="flag">missing</span>' : esc(v);

// Australian FY runs July to June.
function fyBounds(offset=0){
  const n = new Date(), y = n.getMonth() >= 6 ? n.getFullYear() : n.getFullYear()-1;
  return [`${y-offset}-07-01`, `${y-offset+1}-06-30`];
}
$("#preset").onchange = e => {
  const v = e.target.value;
  if(v==="fy")      [$("#from").value, $("#to").value] = fyBounds(0);
  else if(v==="fyl")[$("#from").value, $("#to").value] = fyBounds(1);
  else if(v==="12"){ const d=new Date(); $("#to").value=localDay(d);
                     d.setFullYear(d.getFullYear()-1); $("#from").value=localDay(d); }
  else if(v==="all"){ $("#from").value=""; $("#to").value=""; }
};
$("#sp").onchange = run;
$("#print").onclick = () => window.print();
$("#addfeed").onclick  = () => openEditor("feed_source", null);
$("#addspray").onclick = () => openEditor("spray_event", null);
$("#go").onclick = run;

async function run(){
  const from = $("#from").value || "1900-01-01";
  const to   = $("#to").value   || "2999-12-31";

  let tq = db.from("v_treatment_report").select("*").gte("treated_on",from).lte("treated_on",to).order("treated_on");
  let fq = db.from("v_feed_event").select("*").gte("fed_on",from).lte("fed_on",to).order("fed_on");
  let cq = db.from("v_consignment").select("*").gte("consigned_on",from).lte("consigned_on",to).order("consigned_on");
  let sq = db.from("v_feed_store").select("*").order("received_on",{ascending:false, nullsFirst:false});
  // Spraying is not species-scoped — pasture is pasture — so the stock
  // filter does not apply to it.
  let spq = db.from("v_spray_report").select("*")
              .gte("applied_on",from).lte("applied_on",to).order("applied_on");
  // What is under withhold RIGHT NOW, regardless of the report period.
  // A spray from before the "from" date can still be binding today.
  let wq  = db.from("v_paddock_withhold").select("*").order("safe_to_graze");
  // Joinings are dated by when the bull went in, or the straw went in.
  let shq = db.from("v_shearing").select("*")
              .gte("shorn_on",from).lte("shorn_on",to).order("shorn_on");
  let jq = db.from("v_joining_result").select("*")
             .gte("joined_on",from).lte("joined_on",to)
             .order("season",{ascending:false}).order("dam_code");

  const [t,f,s,c,j,sh,sp,w] = await Promise.all([tq,fq,sq,cq,jq,shq,spq,wq]);
  const err = t.error||f.error||s.error||c.error;
  if(err){ $("#out").innerHTML = `<p class="gap">${esc(err.message)}</p>`; return; }

  const range = (($("#from").value||$("#to").value)
    ? `${fmt($("#from").value)||"start"} to ${fmt($("#to").value)||"today"}` : "All records held")
    + (SP() ? ` · ${SP()} only` : "");

  $("#out").innerHTML =
    treatmentSection((t.data||[]).filter(involves), range) +
    spraySection(sp.data||[], w.data||[], range, sp.error) +
    feedingSection(f.data||[], range) +
    sourceSection(s.data||[]) +
    consignSection((c.data||[]).filter(involves), range) +
    shedSection(sh.data||[], range, sh.error) +
    joiningSection(j.data||[], range, j.error) +
    `<div class="sig"><div>Producer signature</div><div>Date</div></div>
     <footer><span>${esc(HOME.trading_name||"Buloke Farm")} · PIC ${esc(HOME.pic)}</span>
     <span>Produced ${new Date().toLocaleString("en-AU")}</span></footer>`;
  wireJoinings();
}

function treatmentSection(rows, range){
  let h = `<section><h2>Section 2 — Livestock treatments</h2>
    <p class="lede">${esc(range)} · ${rows.length} treatment${rows.length===1?"":"s"}</p>`;
  if(!rows.length) return h + `<p class="none">No treatments recorded in this period.</p></section>`;

  h += `<table><thead><tr>
    <th class="m">Date</th><th>Mob</th><th>Product</th><th class="m">Batch</th>
    <th class="m">Expiry</th><th>Dose</th><th class="m">WHP</th><th class="m">ESI</th>
    <th class="m">Clear</th><th class="num">Head</th><th>Treated by</th><th>Tags</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    h += `<tr class="ed" data-kind="treatment" data-id="${r.id}">
      <td class="m">${fmt(r.treated_on)}${r.edits?`<span class="edits">${r.edits} edit${r.edits===1?"":"s"}</span>`:""}</td>
      <td>${esc(r.description||"—")}</td>
      <td>${esc(r.product_name)}${r.broken_needle?' <span class="flag">broken needle</span>':""}</td>
      <td class="m">${dash(r.batch_number)}</td>
      <td class="m">${r.product_expiry?fmt(r.product_expiry):'<span class="flag">missing</span>'}</td>
      <td>${dash(r.dose_rate)}</td>
      <td class="m">${r.withholding_days??'<span class="flag">?</span>'}</td>
      <td class="m">${r.esi_days??"—"}</td>
      <td class="m">${r.safe_for_slaughter?fmt(r.safe_for_slaughter):"—"}</td>
      <td class="num">${r.head}</td>
      <td>${dash(r.treated_by_shown)}${r.contact_shown?`<br><span style="color:var(--ink2)">${esc(r.contact_shown)}</span>`:""}</td>
      <td class="tags">${esc(r.tags||"—")}</td></tr>`;
  }
  h += `</tbody></table>`;

  const bad = rows.filter(r => !r.batch_number || !r.treated_by_shown || r.withholding_days==null);
  if(bad.length) h += `<div class="gap"><b>${bad.length} treatment${bad.length===1?" is":"s are"} incomplete.</b>
    LPA requires batch number, withholding period and the name of whoever administered it.
    Anything marked <span class="flag">missing</span> above needs filling before an audit.</div>`;
  const empty = rows.filter(r => r.head===0);
  if(empty.length) h += `<div class="gap">${empty.length} treatment${empty.length===1?"":"s"} have no
    animals attached — these were mobs belonging to another PIC.</div>`;
  return h + `</section>`;
}

// ── Section 3B ──────────────────────────────────────────────────
// One row per product, because a tank mix is several products in one
// pass and each carries its own batch number and withholding period.
// The date cell opens the pass; the row opens the product.
function spraySection(rows, withheld, range, error){
  let h = `<section><h2>Section 3B — Crop, pasture and paddock treatment</h2>
    <p class="lede">${esc(range)} · ${new Set(rows.map(r=>r.event_id)).size} application${
      new Set(rows.map(r=>r.event_id)).size===1?"":"s"}</p>`;
  if(error) return h + `<p class="gap">${esc(error.message)}</p></section>`;

  // Withheld paddocks first: this is the bit that changes what you do
  // today, so it goes above the record rather than under it.
  if(withheld.length){
    // A mix can carry a known withhold AND one nobody wrote down. Both
    // are true, so both get said — the known date is not a clearance
    // while there is an unrecorded product sitting beside it.
    h += `<div class="gap"><b>Do not graze:</b> ` + withheld.map(p => {
      const bits = [];
      if(p.safe_to_graze)    bits.push(`clear ${fmt(p.safe_to_graze)}`);
      if(p.withhold_unknown) bits.push(`<span class="flag">no grazing WHP recorded</span>`);
      return `${esc(p.paddock_name)} (sprayed ${fmt(p.last_sprayed)}) — ${bits.join(", ")}`;
    }).join("; ") + `.</div>`;
  }

  if(!rows.length) return h + `<p class="none">No spraying recorded in this period.
    Use <b>+ Record spraying</b> above.</p></section>`;

  h += `<table><thead><tr>
    <th class="m">Date</th><th>Where</th><th>Crop</th><th class="num">Area ha</th>
    <th>Product</th><th class="m">Rate</th><th class="m">Batch</th>
    <th>Method</th><th class="m">Wind</th>
    <th class="m">Graze WHP</th><th class="m">Graze from</th>
    <th class="m">Cut from</th><th class="m">ESI</th><th>Applied by</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    const wind = r.wind_direction || r.wind_speed_kmh!=null
      ? `${esc(r.wind_direction||"?")}${r.wind_speed_kmh!=null?` ${r.wind_speed_kmh}`:""}`
      : '<span class="flag">missing</span>';
    h += `<tr class="ed" data-kind="spray_product" data-id="${r.product_id||""}">
      <td class="m"><button class="srclink" data-spray="${r.event_id}"
        title="Edit the application">${fmt(r.applied_on)}</button>${
        r.event_edits?`<span class="edits">${r.event_edits} edit${r.event_edits===1?"":"s"}</span>`:""}</td>
      <td>${esc(r.place||'<span class="flag">no paddock</span>')}${r.location_note
        ?`<br><span style="color:var(--ink2)">${esc(r.location_note)}</span>`:""}${
        r.paddocks_on_pass>1?`<br><span style="color:var(--ink2)">one of ${
          r.paddocks_on_pass} paddocks on this pass</span>`:""}</td>
      <td>${esc(r.crop_treated||"—")}</td>
      <td class="num">${r.area_ha ?? '<span class="flag">missing</span>'}</td>
      <td>${r.product_name
        ? esc(r.product_name) + (r.product_edits
            ? `<span class="edits">${r.product_edits} edit${r.product_edits===1?"":"s"}</span>` : "")
        : '<span class="flag">no product recorded</span>'}</td>
      <td class="m">${dash(r.chemical_rate)}</td>
      <td class="m">${dash(r.batch_number)}</td>
      <td>${esc(r.method||"—")}</td>
      <td class="m">${wind}</td>
      <td class="m">${r.graze_withhold_days ?? '<span class="flag">?</span>'}</td>
      <td class="m">${r.safe_to_graze
        ? (r.graze_withheld ? `<span class="flag">${fmt(r.safe_to_graze)}</span>` : fmt(r.safe_to_graze))
        : "—"}</td>
      <td class="m">${r.safe_to_harvest?fmt(r.safe_to_harvest):"—"}</td>
      <td class="m">${r.esi_days ?? "—"}</td>
      <td>${dash(r.applied_by_shown)}${r.contact_shown
        ?`<br><span style="color:var(--ink2)">${esc(r.contact_shown)}</span>`:""}</td></tr>`;
  }
  h += `</tbody></table>`;

  // One line per pass, so the button lands next to the record it adds to.
  const events = [...new Map(rows.map(r => [r.event_id, r])).values()];
  h += `<p class="lede noprint" style="margin-top:8px">Add another product to a pass: ` +
    events.map(e => `<button class="srclink" data-addprod="${e.event_id}">${
      fmt(e.applied_on)} ${esc(e.place||"")}</button>`).join(" · ") + `</p>`;

  const noWind = events.filter(e => !e.wind_direction || e.wind_speed_kmh==null);
  if(noWind.length) h += `<div class="gap"><b>${noWind.length} application${
    noWind.length===1?" has":"s have"} no wind recorded.</b> Wind direction and speed are
    what Section 3B exists to show — they are the evidence the chemical went where it was
    aimed and not onto a neighbour.</div>`;

  const bad = rows.filter(r => r.product_id && (!r.batch_number || r.graze_withhold_days==null));
  if(bad.length) h += `<div class="gap"><b>${bad.length} product line${
    bad.length===1?" is":"s are"} incomplete.</b> The batch number comes off the drum and the
    grazing withholding period off the label. Without the WHP the paddock cannot be cleared by
    date, and stock moving in will be queried every time.</div>`;

  const bare = rows.filter(r => !r.product_id);
  if(bare.length) h += `<div class="gap">${bare.length} application${bare.length===1?"":"s"}
    recorded with no product. Click the date to add what went in the tank.</div>`;
  return h + `</section>`;
}

// ── joining register ────────────────────────────────────────────
// Not an LPA section. A joining is recorded when the bull goes out or
// the straw goes in, at which point there is no result — this is where
// the result goes on, weeks later, one preg-test day at a time.
//
// noprint: it carries checkboxes and an action bar, which would print
// as clutter in a document meant to be handed to a processor.
let JOININGS = [];
const OUTCOMES = {unknown:"Not tested", in_calf:"In calf", empty:"Empty",
                  aborted:"Aborted", lost:"Lost the calf", calved:"Calved"};

function joiningSection(rows, range, error){
  JOININGS = rows;
  let h = `<section class="noprint" id="joinsec"><h2>Joining register</h2>
    <p class="lede">${esc(range)} · ${rows.length} joining${rows.length===1?"":"s"}
      · a breeding record, not part of the LPA declaration</p>`;
  if(error) return h + `<p class="gap"><b>The joining register isn't available yet.</b>
    ${esc(error.message)} — this usually means the joining-method migration hasn't been run.</p></section>`;
  if(!rows.length) return h + `<p class="none">No joinings recorded in this period.</p></section>`;

  const waiting = rows.filter(r => !r.outcome || r.outcome==="unknown").length;
  h += `<div class="jbar">
    <label>Show<select id="jfilter">
      <option value="await"${waiting?" selected":""}>Awaiting result (${waiting})</option>
      <option value="all"${waiting?"":" selected"}>All</option>
      <option value="in_calf">In calf</option>
      <option value="empty">Empty</option>
      <option value="natural">Recorded as bull out</option>
      <option value="ai">Recorded as AI</option>
    </select></label>
    <label>Mark ticked as<select id="jout">
      <option value="">— leave alone —</option>
      ${["in_calf","empty","aborted","lost"].map(o =>
        `<option value="${o}">${OUTCOMES[o]}</option>`).join("")}
    </select></label>
    <label>Tested on<input type="date" id="jdate"></label>
    <label>Method<select id="jmethod">
      <option value="">— leave alone —</option>
      <option value="ai">AI</option>
      <option value="natural">Bull out</option>
    </select></label>
    <button id="japply">Apply to ticked</button>
    <span class="count" id="jcount">none ticked</span>
  </div><div id="joinout"></div>`;
  return h + `</section>`;
}

function joinRows(){
  const f = $("#jfilter")?.value || "await";
  return JOININGS.filter(isSp).filter(r =>
    f==="all"     ? true :
    f==="await"   ? (!r.outcome || r.outcome==="unknown") :
    f==="natural" ? r.method!=="ai" :
    f==="ai"      ? r.method==="ai" : r.outcome===f);
}

function renderJoinings(){
  const rows = joinRows();
  if(!rows.length){
    $("#joinout").innerHTML = `<p class="none">Nothing matches that filter.</p>`;
    return updateCount();
  }
  let h = `<table><thead><tr>
    <th class="tick"><input type="checkbox" class="jck" id="jall" aria-label="Tick all"></th>
    <th>Cow</th><th class="m">Method</th><th>Sire / straw</th><th>Where</th>
    <th class="m">Season</th><th class="m">Joined</th><th class="m">Due</th>
    <th class="num">Conf</th><th class="m">Outcome</th><th class="m">Tested</th><th>Notes</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    const open = !r.outcome || r.outcome==="unknown";
    h += `<tr class="ed" data-kind="joining" data-id="${r.id}">
      <td class="tick nodrawer"><input type="checkbox" class="jck" data-id="${r.id}"></td>
      <td>${esc(r.dam_code||"—")}${r.dam_name?`<br><span style="color:var(--ink2)">${esc(r.dam_name)}</span>`:""}</td>
      <td class="m">${r.method==="ai" ? "AI" : (SIRE_WORD[r.species] || "bull")}</td>
      <td>${esc(r.sire_name||"—")}${r.straw_code?`<br><span style="color:var(--ink2)">${esc(r.straw_code)}</span>`:""}</td>
      <td>${esc(r.paddock_name||(r.method==="ai"?"—":"not recorded"))}</td>
      <td class="m">${esc(r.season||"—")}${r.attempt>1?`<br><span style="color:var(--ink2)">attempt ${r.attempt}</span>`:""}</td>
      <td class="m">${fmt(r.joined_on)}${r.edits?`<span class="edits">${r.edits} edit${r.edits===1?"":"s"}</span>`:""}${r.bull_out?`<br><span style="color:var(--ink2)">out ${fmt(r.bull_out)}</span>`:""}</td>
      <td class="m">${r.due_on?fmt(r.due_on):"—"}${r.gestation_days&&r.gestation_days!==285
        ?`<br><span style="color:var(--ink2)">${r.gestation_days} d</span>`:""}</td>
      <td class="num">${r.confidence!=null?Math.round(r.confidence*100)+"%":"—"}</td>
      <td class="m">${open?'<span class="flag">not tested</span>'
        :`<span class="${r.outcome==="in_calf"?"ok":""}">${esc(OUTCOMES[r.outcome]||r.outcome)}</span>`}</td>
      <td class="m">${r.tested_on?fmt(r.tested_on):"—"}</td>
      <td>${esc(r.notes||"—")}</td></tr>`;
  }
  $("#joinout").innerHTML = h + `</tbody></table>`;
  updateCount();
}

function ticked(){ return [...document.querySelectorAll("#joinout input.jck:checked")]; }
function updateCount(){
  const n = ticked().length, c = $("#jcount");
  if(c) c.textContent = n ? `${n} ticked` : "none ticked";
}

function wireJoinings(){
  if(!$("#joinsec") || !$("#joinout")) return;
  renderJoinings();
  $("#jfilter").onchange = renderJoinings;

  // Tick handling is delegated so it survives re-rendering the table.
  $("#joinout").addEventListener("change", e => {
    if(e.target.id === "jall")
      document.querySelectorAll("#joinout tbody input.jck")
        .forEach(c => c.checked = e.target.checked);
    if(e.target.classList.contains("jck")) updateCount();
  });

  // Preg testing is one day's work over one mob. Setting the same
  // result thirty times individually is the problem this removes.
  $("#japply").onclick = async () => {
    const ids = ticked().map(c => c.dataset.id).filter(Boolean);
    if(!ids.length) return alert("Tick the joinings you're marking first.");
    const patch = {};
    if($("#jout").value)    patch.outcome   = $("#jout").value;
    if($("#jdate").value)   patch.tested_on = $("#jdate").value;
    if($("#jmethod").value) patch.method    = $("#jmethod").value;
    if(!Object.keys(patch).length)
      return alert("Choose an outcome, a test date, a method, or any combination.");

    // A straw belongs to an AI joining and a paddock to a bull out;
    // the database refuses to hold both. Switching method clears the
    // one that no longer applies, so say what's about to be lost
    // rather than letting a constraint error explain it afterwards.
    let losing = "";
    if(patch.method){
      const rows = JOININGS.filter(r => ids.includes(r.id));
      const n = patch.method === "ai"
        ? rows.filter(r => r.paddock_id).length
        : rows.filter(r => r.ai_semen_id).length;
      if(patch.method === "ai") patch.paddock_id  = null;
      else                      patch.ai_semen_id = null;
      if(n) losing = `\n\n${n} of them ${n===1?"has a":"have a"} `
        + `${patch.method==="ai"?"paddock":"straw"} recorded, which will be cleared.`;
    }

    const bits = [
      patch.method    ? (patch.method==="ai" ? "Method: AI" : "Method: bull out") : null,
      patch.outcome   ? OUTCOMES[patch.outcome] : null,
      patch.tested_on ? `tested ${fmt(patch.tested_on)}` : null
    ].filter(Boolean).join(", ");
    if(!confirm(`Apply to ${ids.length} joining${ids.length===1?"":"s"}?\n\n${bits}.${losing}`
      + `\n\nEach change is logged against whoever made it.`)) return;
    const { error } = await db.from("joining").update(patch).in("id", ids);
    if(error) return alert(error.message);
    run();
  };
}

document.addEventListener("click", e => {
  // The tick column is an action in its own right, not a way into the row.
  if(e.target.closest(".nodrawer")) return;
  const src = e.target.closest(".srclink");
  if(src){
    e.stopPropagation();
    if(src.dataset.spray)   return openEditor("spray_event", src.dataset.spray);
    if(src.dataset.addprod) return openEditor("spray_product", null,
                                              { spray_event_id: src.dataset.addprod });
    return openEditor("feed_source", src.dataset.src);
  }
  const tr = e.target.closest("tr.ed");
  if(!tr) return;
  // A pass with nothing in the tank has no product row to open, so the
  // row falls through to adding one.
  if(tr.dataset.kind === "spray_product" && !tr.dataset.id) return;
  openEditor(tr.dataset.kind, tr.dataset.id);
});

// `preset` seeds a new record with values the form does not ask for —
// currently the parent a spray product hangs off.
async function openEditor(kind, id, preset = null){
  const cfg = FIELDS[kind]; if(!cfg) return;
  let row = {};
  if(id){
    const { data, error } = await db.from(cfg.table).select("*").eq("id", id).single();
    if(error) return alert(error.message);
    row = data;
  }
  // The paddocks a pass covers live in their own table, so they are
  // fetched alongside rather than coming back with the row.
  if(cfg.multi && id){
    const { data } = await db.from("spray_paddock")
      .select("paddock_id,area_ha,location_note").eq("spray_event_id", id);
    row.__paddocks = data || [];
  }

  const inp = (f) => {
    const [k,label,type,req] = f;
    const v = row[k];
    // A record with no paddock is invisible to the grazing guard, so
    // the form will not let one be saved. Native validation does it —
    // the empty option has an empty value, which `required` rejects.
    const need  = req ? " required" : "";
    const star  = req ? ' <span style="color:var(--danger)">*</span>' : "";
    if(type==="bool")
      return `<label style="display:flex;align-items:center;gap:9px">
        <input type="checkbox" name="${k}" ${v?"checked":""} style="width:20px;height:20px">
        <span style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${label}</span></label>`;
    if(type.startsWith("pick:"))
      return `<label><span>${label}${star}</span><select name="${k}"${need}>
        <option value="">—</option>
        ${type.slice(5).split("|").map(o =>
          `<option ${v===o?"selected":""}>${o}</option>`).join("")}</select></label>`;
    // One tank crosses several paddocks in an afternoon, so the
    // picker is a list, not a choice. Each row carries the area
    // actually covered — offered from the mapped boundary, editable
    // because spot spraying a fenceline is not the whole paddock.
    if(type==="multi:paddock"){
      if(!PADDOCKS.length) return `<label><span>${label}</span>
        <span style="color:var(--danger)">No paddocks found. Draw them on /map first.</span></label>`;
      return `<label><span>${label}${star}</span></label>
        <div id="pkpick" style="border:1px solid var(--rule);border-radius:9px;
             padding:4px 10px 8px;margin-bottom:11px;max-height:290px;overflow-y:auto">
        ${PADDOCKS.map(p => {
          const on = (row.__paddocks||[]).find(x => x.paddock_id === p.id);
          return `<div style="border-bottom:1px solid var(--rule);padding:6px 0">
            <div style="display:grid;grid-template-columns:auto 1fr 86px;gap:8px;align-items:center">
              <input type="checkbox" class="pk-on" data-id="${p.id}" ${on?"checked":""}
                style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer">
              <span style="font-size:14px">${esc(p.name)}${
                p.area_ha!=null?` <span style="color:var(--ink2)">${p.area_ha} ha</span>`:""}</span>
              <input type="number" class="pk-ha" data-id="${p.id}" step="0.1" min="0"
                placeholder="ha" value="${on?.area_ha ?? ""}"
                style="padding:5px 7px;font-size:13px" ${on?"":"disabled"}>
            </div>
            <input type="text" class="pk-note" data-id="${p.id}" placeholder="Where in it — optional"
              value="${esc(on?.location_note ?? "")}" ${on?"":"hidden"}
              style="margin-top:5px;padding:5px 7px;font-size:13px"></div>`;
        }).join("")}</div>`;
    }
    if(type==="area")
      return `<label><span>${label}${star}</span><textarea name="${k}" rows="2"${need}>${esc(v||"")}</textarea></label>`;
    // Stored 0-1, typed 0-100. Nobody says "point six five confident".
    if(type==="pct")
      return `<label><span>${label}</span><input type="number" name="${k}" min="0" max="100"
        step="5" value="${v==null?"":Math.round(v*100)}"></label>`;
    return `<label><span>${label}${star}</span><input type="${type}" name="${k}" value="${esc(v??"")}"${need}></label>`;
  };

  drawer.innerHTML = `<h3>${id ? cfg.title : "New " + cfg.title.toLowerCase()}</h3>
    <p class="sub">${id ? "Corrections are kept. Every change records who made it and when."
      : (cfg.blurb || "Once saved, this appears in the app's feed list ready to feed out.")}</p>
    <form id="edform">${cfg.fields.map(inp).join("")}
      <button type="submit">${id ? "Save changes" : "Save"}</button>
      ${id && ME?.role==="owner" ? `<button type="button" class="warn" id="del">Delete this record</button>` : ""}
      <button type="button" class="ghost" id="cancel">Cancel</button>
    </form><div class="hist" id="hist"></div>`;

  drawer.classList.add("on"); veil.classList.add("on"); drawer.scrollTop = 0;
  $("#cancel").onclick = closeDrawer;

  // Most passes cover the whole paddock, so offer its area — but only
  // into an empty box. A part-paddock figure someone typed is a
  // measurement and must not be overwritten by a default.
  // Ticking a paddock opens its area and note, and offers the mapped
  // hectares. Unticking clears them, so an area cannot be left behind
  // on a paddock that is no longer part of the pass.
  drawer.querySelectorAll(".pk-on").forEach(cb => {
    cb.onchange = () => {
      const pid  = cb.dataset.id;
      const hIn  = drawer.querySelector(`.pk-ha[data-id="${pid}"]`);
      const nIn  = drawer.querySelector(`.pk-note[data-id="${pid}"]`);
      hIn.disabled = !cb.checked;
      nIn.hidden   = !cb.checked;
      if(cb.checked){
        const p = PADDOCKS.find(x => x.id === pid);
        if(p && p.area_ha != null && hIn.value === "") hIn.value = p.area_ha;
      } else { hIn.value = ""; nIn.value = ""; }
    };
  });

  const chosenPaddocks = () =>
    [...drawer.querySelectorAll(".pk-on")].filter(c => c.checked).map(c => ({
      paddock_id:    c.dataset.id,
      area_ha:       drawer.querySelector(`.pk-ha[data-id="${c.dataset.id}"]`).value === ""
                       ? null : Number(drawer.querySelector(`.pk-ha[data-id="${c.dataset.id}"]`).value),
      location_note: drawer.querySelector(`.pk-note[data-id="${c.dataset.id}"]`).value.trim() || null
    }));

  $("#edform").onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), patch = {};
    for(const [k,,type] of cfg.fields){
      if(type==="multi:paddock") continue;          // its own table
      if(type==="bool")        patch[k] = fd.get(k) === "on";
      else if(type==="pct")    patch[k] = fd.get(k) === "" ? null : Number(fd.get(k))/100;
      else if(type==="number") patch[k] = fd.get(k) === "" ? null : Number(fd.get(k));
      else                     patch[k] = (fd.get(k)||"").trim() || null;
    }
    // Same rule as the bulk bar: the method decides which of the two
    // can be set, so changing it clears the other.
    if(cfg.table === "joining" && patch.method)
      patch[patch.method === "ai" ? "paddock_id" : "ai_semen_id"] = null;

    if(!id && preset) Object.assign(patch, preset);

    if(cfg.multi){
      const picks = chosenPaddocks();
      if(!picks.length) return alert("Tick at least one paddock. "
        + "A spray record with no paddock cannot keep stock off it.");

      // New pass: one RPC, one transaction. The pass and its paddocks
      // land together or not at all, so a half-written record can't be
      // left behind for someone to enter a second time.
      if(!id){
        const { data, error } = await db.rpc("record_spray", {
          p_applied_on:         patch.applied_on,
          p_paddocks:           picks,
          p_products:           [],
          p_crop_treated:       patch.crop_treated,
          p_water_rate_l_ha:    patch.water_rate_l_ha,
          p_method:             patch.method,
          p_wind_direction:     patch.wind_direction,
          p_wind_speed_kmh:     patch.wind_speed_kmh,
          p_applied_by:         patch.applied_by,
          p_applied_by_contact: patch.applied_by_contact,
          p_notes:              patch.notes
        });
        if(error) return alert(error.message);
        run();
        return openEditor(cfg.next, null, { spray_event_id: data });
      }

      // Editing: update the header, then reconcile the paddock list.
      const { error:eh } = await db.from(cfg.table).update(patch).eq("id", id);
      if(eh) return alert(eh.message);
      const keep = picks.map(p => p.paddock_id);
      const { error:ed } = await db.from("spray_paddock").delete()
        .eq("spray_event_id", id).not("paddock_id","in",`(${keep.join(",")})`);
      if(ed) return alert(ed.message);
      const { error:eu } = await db.from("spray_paddock")
        .upsert(picks.map(p => ({ ...p, spray_event_id: id })),
                { onConflict: "spray_event_id,paddock_id" });
      if(eu) return alert(eu.message);
      closeDrawer(); return run();
    }

    // A new pass is worth nothing without a product, so chain straight
    // into one rather than trusting anybody to come back for it.
    if(!id && cfg.next){
      const { data, error } = await db.from(cfg.table).insert(patch).select("id").single();
      if(error) return alert(error.message);
      run();
      return openEditor(cfg.next, null, { spray_event_id: data.id });
    }

    const { error } = id
      ? await db.from(cfg.table).update(patch).eq("id", id)
      : await db.from(cfg.table).insert(patch);
    if(error) return alert(error.message);
    closeDrawer(); run();
  };

  const del = $("#del");
  if(del) del.onclick = async () => {
    if(!confirm(`Delete this ${cfg.title.toLowerCase()} record?\n\nThe deletion is logged, but the record comes off the report.`)) return;
    const { error } = await db.from(cfg.table).delete().eq("id", id);
    if(error) return alert(error.message.includes("violates foreign key")
      ? "Something still references this record. Remove that first."
      : error.message);
    closeDrawer(); run();
  };

  if(!id){ $("#hist").innerHTML = ""; return; }
  const { data:hist } = await db.from("v_record_history").select("*")
    .eq("table_name", cfg.table).eq("row_id", id).order("changed_at",{ascending:false}).limit(12);
  $("#hist").innerHTML = hist?.length
    ? `<h4>Change history</h4><ul style="margin:0;padding:0">${hist.map(x =>
        `<li><b>${esc(x.changed_by)}</b> · ${new Date(x.changed_at).toLocaleString("en-AU")}<br>${esc(x.summary||"—")}</li>`).join("")}</ul>`
    : `<h4>Change history</h4><ul style="margin:0;padding:0"><li>Never edited.</li></ul>`;
}

window.__signOut = () => db.auth.signOut();

(async () => {
  const { data:{ session } } = await db.auth.getSession();
  if(!session){
    const email = prompt("Email"), pw = email && prompt("Password");
    if(!pw){ $("#out").innerHTML = '<p class="none">Sign in required.</p>'; return; }
    const { error } = await db.auth.signInWithPassword({email, password:pw});
    if(error){ alert(error.message); location.reload(); return; }
  }
  const { data:{ user } } = await db.auth.getUser();
  if(user){ const { data } = await db.from("farm_user").select("role").eq("id",user.id).maybeSingle(); ME = data; }
  await Promise.all([loadHome(), loadPaddocks()]);
  run();
})();
</script>
</body>
</html>
