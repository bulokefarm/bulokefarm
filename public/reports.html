<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Records — Buloke Farm</title>
<style>
:root{
  --paper:#F2F2EE;--card:#FFF;--ink:#16150F;--ink2:#5A574E;--rule:#D9D6CC;
  --accent:#12564F;--accent-soft:#E2EDEA;--danger:#8C2F2A;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.sheet{max-width:1100px;margin:0 auto;padding:22px 20px 60px}

.masthead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);
  padding-bottom:12px;margin-bottom:6px}
.masthead h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.masthead .pic{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.5}
.masthead .pic b{font-family:var(--mono);color:var(--ink)}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  padding:14px 0 18px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.controls label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.controls input,.controls select{display:block;margin-top:4px;border:1px solid var(--rule);
  border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:var(--card)}
button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;
  background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}

section{margin-top:30px;page-break-inside:auto}
section > h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 3px;
  padding-bottom:6px;border-bottom:1px solid var(--ink)}
section > p.lede{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px solid var(--ink);padding:7px 8px;vertical-align:bottom;font-weight:700}
td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
tr{page-break-inside:avoid}
td.m,th.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.tags{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.5}
td.num{text-align:right;font-family:var(--mono)}
.flag{display:inline-block;background:#F7E4E2;color:var(--danger);border-radius:4px;
  padding:1px 6px;font-size:11px;font-weight:700}
.ok{color:var(--accent);font-weight:600}
.none{color:var(--ink2);font-style:italic;padding:14px 8px}
.gap{background:#FCF3E3;border-left:3px solid #8F5A0C;padding:11px 13px;font-size:13px;margin-top:12px}
.sig{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:26px;font-size:12px;color:var(--ink2)}
.sig div{border-top:1px solid var(--ink);padding-top:6px}
tr.ed{cursor:pointer}
tr.ed:hover td{background:var(--accent-soft)}
.srclink{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline dotted}
.edits{display:inline-block;background:#FCF3E3;color:#8F5A0C;border-radius:4px;
  padding:1px 5px;font-size:10.5px;font-weight:700;margin-left:5px}
#veil{position:fixed;inset:0;background:rgba(22,21,15,.45);display:none;z-index:40}
#veil.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);
  border-left:1px solid var(--rule);z-index:50;overflow-y:auto;transform:translateX(100%);
  transition:transform .18s ease-out;padding:20px 20px 40px}
#drawer.on{transform:none}
#drawer h3{margin:0 0 4px;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
#drawer .sub{font-size:12.5px;color:var(--ink2);margin:0 0 16px}
#drawer label{display:block;margin-bottom:11px}
#drawer label span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
#drawer input[type=text],#drawer input[type=date],#drawer input[type=number],
#drawer select,#drawer textarea{width:100%;border:1px solid var(--rule);border-radius:8px;
  padding:9px 11px;font:inherit;font-size:14px;background:var(--card)}
#drawer .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#drawer button{width:100%;margin-top:8px;min-height:44px}
#drawer button.warn{background:var(--card);color:var(--danger);border:1px solid var(--rule)}
.hist{margin-top:20px;border-top:1px solid var(--rule);padding-top:12px}
.hist h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hist li{font-size:12px;color:var(--ink2);margin-bottom:7px;list-style:none;line-height:1.5}
.hist li b{color:var(--ink);font-weight:600}
@media print{#veil,#drawer{display:none !important}}
footer{margin-top:34px;padding-top:10px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between}

@media print{
  body{background:#fff;font-size:11px}
  .sheet{max-width:none;padding:0}
  .controls,.noprint{display:none !important}
  section{margin-top:20px}
  table{font-size:10px}
  thead{display:table-header-group}
  @page{margin:14mm;size:A4 landscape}
}
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <img src="/mark.png" alt="" width="28" height="28" style="flex:none"><h1>Buloke Farm</h1>
    <div class="pic">267 North Canal Rd, Trafalgar VIC 3824<br>PIC <b>3BWWY089</b></div>
  </div>

  <div class="controls noprint">
    <label>From<input type="date" id="from"></label>
    <label>To<input type="date" id="to"></label>
    <label>Period<select id="preset">
      <option value="">Custom</option>
      <option value="fy">This financial year</option>
      <option value="fyl">Last financial year</option>
      <option value="12">Last 12 months</option>
      <option value="all" selected>Everything</option>
    </select></label>
    <button id="go">Show records</button>
    <button class="ghost" id="print">Print / save as PDF</button>
    <button class="ghost" id="addfeed">+ Add feed to store</button>
  </div>

  <div id="out"></div>
</div>
<div id="veil"></div>
<aside id="drawer"></aside>
<div style="display:none">
</div>

<script type="module">
const SUPABASE_URL  = "https://hgnzignikbpdbbyubahu.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnppZ25pa2JwZGJieXViYWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTgzNTcsImV4cCI6MjEwMTEzNDM1N30.U5vvmmZfSP0SOXsvLaxpjJ6LjWjOvaOYwTZ9VKyfFs0";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const dash = v => (v===null||v===undefined||v==="") ? '<span class="flag">missing</span>' : esc(v);

// Australian FY runs July to June.
function fyBounds(offset=0){
  const n = new Date(), y = n.getMonth() >= 6 ? n.getFullYear() : n.getFullYear()-1;
  return [`${y-offset}-07-01`, `${y-offset+1}-06-30`];
}
$("#preset").onchange = e => {
  const v = e.target.value;
  if(v==="fy")      [$("#from").value, $("#to").value] = fyBounds(0);
  else if(v==="fyl")[$("#from").value, $("#to").value] = fyBounds(1);
  else if(v==="12"){ const d=new Date(); $("#to").value=d.toISOString().slice(0,10);
                     d.setFullYear(d.getFullYear()-1); $("#from").value=d.toISOString().slice(0,10); }
  else if(v==="all"){ $("#from").value=""; $("#to").value=""; }
};
$("#print").onclick = () => window.print();
$("#addfeed").onclick = () => openEditor("feed_source", null);
$("#go").onclick = run;

async function run(){
  const from = $("#from").value || "1900-01-01";
  const to   = $("#to").value   || "2999-12-31";

  let tq = db.from("v_treatment_report").select("*").gte("treated_on",from).lte("treated_on",to).order("treated_on");
  let fq = db.from("v_feed_event").select("*").gte("fed_on",from).lte("fed_on",to).order("fed_on");
  let cq = db.from("v_consignment").select("*").gte("consigned_on",from).lte("consigned_on",to).order("consigned_on");
  let sq = db.from("v_feed_store").select("*").order("received_on",{ascending:false, nullsFirst:false});

  const [t,f,s,c] = await Promise.all([tq,fq,sq,cq]);
  const err = t.error||f.error||s.error||c.error;
  if(err){ $("#out").innerHTML = `<p class="gap">${esc(err.message)}</p>`; return; }

  const range = ($("#from").value||$("#to").value)
    ? `${fmt($("#from").value)||"start"} to ${fmt($("#to").value)||"today"}` : "All records held";

  $("#out").innerHTML =
    treatmentSection(t.data||[], range) +
    feedingSection(f.data||[], range) +
    sourceSection(s.data||[]) +
    consignSection(c.data||[], range) +
    `<div class="sig"><div>Producer signature</div><div>Date</div></div>
     <footer><span>Buloke Farm · PIC 3BWWY089</span>
     <span>Produced ${new Date().toLocaleString("en-AU")}</span></footer>`;
}

function treatmentSection(rows, range){
  let h = `<section><h2>Section 2 — Livestock treatments</h2>
    <p class="lede">${esc(range)} · ${rows.length} treatment${rows.length===1?"":"s"}</p>`;
  if(!rows.length) return h + `<p class="none">No treatments recorded in this period.</p></section>`;

  h += `<table><thead><tr>
    <th class="m">Date</th><th>Mob</th><th>Product</th><th class="m">Batch</th>
    <th class="m">Expiry</th><th>Dose</th><th class="m">WHP</th><th class="m">ESI</th>
    <th class="m">Clear</th><th class="num">Head</th><th>Treated by</th><th>Tags</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    h += `<tr class="ed" data-kind="treatment" data-id="${r.id}">
      <td class="m">${fmt(r.treated_on)}${r.edits?`<span class="edits">${r.edits} edit${r.edits===1?"":"s"}</span>`:""}</td>
      <td>${esc(r.description||"—")}</td>
      <td>${esc(r.product_name)}${r.broken_needle?' <span class="flag">broken needle</span>':""}</td>
      <td class="m">${dash(r.batch_number)}</td>
      <td class="m">${r.product_expiry?fmt(r.product_expiry):'<span class="flag">missing</span>'}</td>
      <td>${dash(r.dose_rate)}</td>
      <td class="m">${r.withholding_days??'<span class="flag">?</span>'}</td>
      <td class="m">${r.esi_days??"—"}</td>
      <td class="m">${r.safe_for_slaughter?fmt(r.safe_for_slaughter):"—"}</td>
      <td class="num">${r.head}</td>
      <td>${dash(r.treated_by_shown)}${r.contact_shown?`<br><span style="color:var(--ink2)">${esc(r.contact_shown)}</span>`:""}</td>
      <td class="tags">${esc(r.tags||"—")}</td></tr>`;
  }
  h += `</tbody></table>`;

  const bad = rows.filter(r => !r.batch_number || !r.treated_by_shown || r.withholding_days==null);
  if(bad.length) h += `<div class="gap"><b>${bad.length} treatment${bad.length===1?" is":"s are"} incomplete.</b>
    LPA requires batch number, withholding period and the name of whoever administered it.
    Anything marked <span class="flag">missing</span> above needs filling before an audit.</div>`;
  const empty = rows.filter(r => r.head===0);
  if(empty.length) h += `<div class="gap">${empty.length} treatment${empty.length===1?"":"s"} have no
    animals attached — these were mobs belonging to another PIC.</div>`;
  return h + `</section>`;
}

function feedingSection(rows, range){
  let h = `<section><h2>Section 3C — Livestock feeding</h2>
    <p class="lede">${esc(range)} · ${rows.length} feeding event${rows.length===1?"":"s"}</p>`;
  if(!rows.length) return h + `<p class="none">No feeding recorded in this period.</p></section>`;

  h += `<table><thead><tr>
    <th class="m">Date</th><th class="m">To</th><th>Feedstuff</th><th class="m">Batch / source</th>
    <th>Where</th><th>Amount</th><th>Method</th><th class="num">Head</th>
    <th class="m">RAM free</th><th>Recorded by</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    h += `<tr class="ed" data-kind="feed_event" data-id="${r.id}">
      <td class="m">${fmt(r.fed_on)}${r.edits?`<span class="edits">${r.edits} edit${r.edits===1?"":"s"}</span>`:""}</td>
      <td class="m">${r.ended_on?fmt(r.ended_on):"—"}</td>
      <td>${esc(r.feedstuff)}</td>
      <td class="m">${esc(r.batch_ref||"—")}</td>
      <td>${r.paddock_name?esc(r.paddock_name):'<span style="color:var(--ink2)">named animals</span>'}</td>
      <td>${esc(r.amount||"—")}</td>
      <td>${esc(r.method||"—")}</td>
      <td class="num">${r.head}</td>
      <td class="m">${r.feed_source_id
        ? `<button class="srclink" data-src="${r.feed_source_id}" title="Edit the feed source">${
            r.ram_free===true?'<span class="ok">yes</span>'
            : r.ram_free===false?'<span class="flag">no</span>'
            : r.home_grown?'<span class="ok">home grown</span>':'<span class="flag">unknown</span>'}</button>`
        : '<span class="flag">no source</span>'}</td>
      <td>${esc(r.fed_by||"—")}</td></tr>`;
  }
  h += `</tbody></table>`;
  const unk = rows.filter(r => r.ram_free===null && !r.home_grown);
  if(unk.length) h += `<div class="gap"><b>${unk.length} event${unk.length===1?"":"s"} with no RAM declaration.</b>
    Restricted animal material status is what a processor asks about. Record it against the feed source.</div>`;
  return h + `</section>`;
}

function consignSection(rows, range){
  let h = `<section><h2>Sections 5A / 5B — Livestock movements</h2>
    <p class="lede">${esc(range)} · ${rows.length} consignment${rows.length===1?"":"s"}</p>`;
  if(!rows.length) return h + `<p class="none">No stock moved on or off in this period.</p></section>`;
  h += `<table><thead><tr>
    <th class="m">Date</th><th class="m">In/out</th><th class="m">NVD</th><th class="m">Waybill</th>
    <th>Destination</th><th class="m">PIC</th><th>Buyer / agent</th><th>Carrier</th>
    <th class="num">Head</th><th class="m">NLIS</th><th>Tags</th>
  </tr></thead><tbody>`;
  for(const r2 of rows){
    h += `<tr class="ed" data-kind="consignment" data-id="${r2.id}">
      <td class="m">${fmt(r2.consigned_on)}${r2.edits?`<span class="edits">${r2.edits} edit${r2.edits===1?"":"s"}</span>`:""}</td>
      <td class="m">${r2.direction==="out"?"out":"in"}</td>
      <td class="m">${r2.nvd_serial?esc(r2.nvd_serial):'<span class="flag">missing</span>'}${
        r2.nvd_kind?`<br><span style="color:var(--ink2)">${esc(r2.nvd_kind==="envd"?"eNVD":"book")}</span>`:""}</td>
      <td class="m">${esc(r2.waybill_no||"—")}</td>
      <td>${esc(r2.destination||"—")}</td>
      <td class="m">${esc(r2.destination_pic||"—")}</td>
      <td>${esc(r2.counterparty||"—")}</td>
      <td>${esc(r2.carrier||"—")}${r2.vehicle_rego?`<br><span style="color:var(--ink2)">${esc(r2.vehicle_rego)}</span>`:""}</td>
      <td class="num">${r2.head}</td>
      <td class="m">${r2.nlis_upload_id?'<span class="ok">sent</span>':'<span class="flag">not sent</span>'}</td>
      <td class="tags">${esc(r2.tags||"—")}</td></tr>`;
  }
  h += `</tbody></table>`;
  const nonlis = rows.filter(x => x.direction==="out" && !x.nlis_upload_id);
  if(nonlis.length) h += `<div class="gap"><b>${nonlis.length} consignment${nonlis.length===1?" has":"s have"}
    no NLIS transfer recorded.</b> Transfers are due within 48 hours of stock moving.
    Click the row to add the upload ID once it's done.</div>`;
  return h + `</section>`;
}

function sourceSection(rows){
  let h = `<section><h2>Section 3D — Introduced stock feed</h2>
    <p class="lede">Feed in store — bought in or home grown — and what came with it</p>`;
  if(!rows.length) return h + `<p class="none">Nothing in the feed store yet.
    Use <b>+ Add feed to store</b> above.</p></section>`;
  h += `<table><thead><tr>
    <th class="m">Received</th><th>Feedstuff</th><th class="m">Type</th><th class="m">Batch</th>
    <th class="num">In</th><th class="num">Used</th><th class="num">Left</th>
    <th>Origin</th><th class="m">CVD ref</th><th class="m">Residue cert</th>
    <th class="m">RAM free</th><th>Stored</th><th class="m">Exhausted</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    h += `<tr class="ed" data-kind="feed_source" data-id="${r.id}">
      <td class="m">${r.received_on?fmt(r.received_on):"—"}</td>
      <td>${esc(r.feedstuff)}</td>
      <td class="m">${esc(r.feed_type||"—")}</td>
      <td class="m">${esc(r.batch_ref||"—")}</td>
      <td class="num">${r.quantity??"—"} ${esc(r.unit||"")}</td>
      <td class="num">${r.used||0}</td>
      <td class="num">${r.remaining!=null
        ? (r.remaining<=0?'<span class="flag">out</span>':r.remaining) : "—"}</td>
      <td>${r.home_grown?'<span class="ok">Home grown</span>':dash(r.origin)}</td>
      <td class="m">${r.home_grown?"n/a":(r.cvd_ref?esc(r.cvd_ref):'<span class="flag">missing</span>')}</td>
      <td class="m">${r.residue_cert===true?'<span class="ok">yes</span>':r.residue_cert===false?"no":"—"}</td>
      <td class="m">${r.ram_free===true?'<span class="ok">yes</span>':r.ram_free===false?'<span class="flag">no</span>':"—"}</td>
      <td>${esc(r.storage||"—")}</td>
      <td class="m">${r.exhausted_on?fmt(r.exhausted_on):"in use"}</td></tr>`;
  }
  return h + `</tbody></table></section>`;
}

let ME = null;
const veil = $("#veil"), drawer = $("#drawer");
veil.onclick = closeDrawer;
function closeDrawer(){ drawer.classList.remove("on"); veil.classList.remove("on"); }

document.addEventListener("click", e => {
  const src = e.target.closest(".srclink");
  if(src){ e.stopPropagation(); return openEditor("feed_source", src.dataset.src); }
  const tr = e.target.closest("tr.ed");
  if(tr) openEditor(tr.dataset.kind, tr.dataset.id);
});

async function openEditor(kind, id){
  const cfg = FIELDS[kind]; if(!cfg) return;
  let row = {};
  if(id){
    const { data, error } = await db.from(cfg.table).select("*").eq("id", id).single();
    if(error) return alert(error.message);
    row = data;
  }

  const inp = (f) => {
    const [k,label,type] = f;
    const v = row[k];
    if(type==="bool")
      return `<label style="display:flex;align-items:center;gap:9px">
        <input type="checkbox" name="${k}" ${v?"checked":""} style="width:20px;height:20px">
        <span style="margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${label}</span></label>`;
    if(type.startsWith("pick:"))
      return `<label><span>${label}</span><select name="${k}">
        <option value="">—</option>
        ${type.slice(5).split("|").map(o =>
          `<option ${v===o?"selected":""}>${o}</option>`).join("")}</select></label>`;
    if(type==="area")
      return `<label><span>${label}</span><textarea name="${k}" rows="2">${esc(v||"")}</textarea></label>`;
    return `<label><span>${label}</span><input type="${type}" name="${k}" value="${esc(v??"")}"></label>`;
  };

  drawer.innerHTML = `<h3>${id ? cfg.title : "New " + cfg.title.toLowerCase()}</h3>
    <p class="sub">${id ? "Corrections are kept. Every change records who made it and when."
      : "Once saved, this appears in the app's feed list ready to feed out."}</p>
    <form id="edform">${cfg.fields.map(inp).join("")}
      <button type="submit">${id ? "Save changes" : "Add to store"}</button>
      ${id && ME?.role==="owner" ? `<button type="button" class="warn" id="del">Delete this record</button>` : ""}
      <button type="button" class="ghost" id="cancel">Cancel</button>
    </form><div class="hist" id="hist"></div>`;

  drawer.classList.add("on"); veil.classList.add("on"); drawer.scrollTop = 0;
  $("#cancel").onclick = closeDrawer;

  $("#edform").onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), patch = {};
    for(const [k,,type] of cfg.fields){
      if(type==="bool")        patch[k] = fd.get(k) === "on";
      else if(type==="number") patch[k] = fd.get(k) === "" ? null : Number(fd.get(k));
      else                     patch[k] = (fd.get(k)||"").trim() || null;
    }
    const { error } = id
      ? await db.from(cfg.table).update(patch).eq("id", id)
      : await db.from(cfg.table).insert(patch);
    if(error) return alert(error.message);
    closeDrawer(); run();
  };

  const del = $("#del");
  if(del) del.onclick = async () => {
    if(!confirm(`Delete this ${cfg.title.toLowerCase()} record?\n\nThe deletion is logged, but the record comes off the report.`)) return;
    const { error } = await db.from(cfg.table).delete().eq("id", id);
    if(error) return alert(error.message.includes("violates foreign key")
      ? "Something still references this record. Remove that first."
      : error.message);
    closeDrawer(); run();
  };

  if(!id){ $("#hist").innerHTML = ""; return; }
  const { data:hist } = await db.from("v_record_history").select("*")
    .eq("table_name", cfg.table).eq("row_id", id).order("changed_at",{ascending:false}).limit(12);
  $("#hist").innerHTML = hist?.length
    ? `<h4>Change history</h4><ul style="margin:0;padding:0">${hist.map(x =>
        `<li><b>${esc(x.changed_by)}</b> · ${new Date(x.changed_at).toLocaleString("en-AU")}<br>${esc(x.summary||"—")}</li>`).join("")}</ul>`
    : `<h4>Change history</h4><ul style="margin:0;padding:0"><li>Never edited.</li></ul>`;
}

(async () => {
  const { data:{ session } } = await db.auth.getSession();
  if(!session){
    const email = prompt("Email"), pw = email && prompt("Password");
    if(!pw){ $("#out").innerHTML = '<p class="none">Sign in required.</p>'; return; }
    const { error } = await db.auth.signInWithPassword({email, password:pw});
    if(error){ alert(error.message); location.reload(); return; }
  }
  const { data:{ user } } = await db.auth.getUser();
  if(user){ const { data } = await db.from("farm_user").select("role").eq("id",user.id).maybeSingle(); ME = data; }
  run();
})();
</script>
</body>
</html>
