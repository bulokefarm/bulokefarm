<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Sales — Buloke Farm</title>
<style>
:root{
  --paper:#F2F2EE;--card:#FFF;--ink:#16150F;--ink2:#5A574E;--rule:#D9D6CC;
  --accent:#12564F;--accent-soft:#E2EDEA;--danger:#8C2F2A;--warn:#8F5A0C;--warn-soft:#FCF3E3;
  --inv:#4F8FBA;--inv-soft:#DCE8F0;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
.sheet{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.masthead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.masthead h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;flex:1}
.masthead .pic{font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.5}

.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:12px 0 0;border-bottom:1px solid var(--rule)}
.tabs button{background:none;color:var(--ink2);border:0;border-bottom:3px solid transparent;border-radius:0;
  padding:8px 12px;font-weight:700;font-size:13.5px}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 0 12px}
.controls label,.grid label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.controls .grow{flex:1;min-width:180px}
input,select,textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--rule);border-radius:8px;
  padding:8px 10px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400}
input[type=checkbox],input[type=radio]{display:inline-block;width:auto;margin:0 4px 0 0;vertical-align:-2px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{border:0;border-radius:8px;padding:9px 15px;font:inherit;font-weight:700;font-size:14px;
  background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
button.danger{background:var(--card);color:var(--danger);border:1px solid var(--rule)}
button.small{padding:5px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:9px 15px;font-weight:700;font-size:14px;
  background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:99px;padding:6px 13px;
  font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{font-weight:400;opacity:.75}

.strip{display:flex;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:11px 15px;margin:0 0 14px;font-size:13px}
.strip div b{display:block;font-family:var(--mono);font-size:16px}
.strip div span{color:var(--ink2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:22px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 4px}
p.lede{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding:7px 9px;font-weight:700;white-space:nowrap}
td{border-bottom:1px solid var(--rule);padding:8px 9px;vertical-align:top}
td.m,th.m{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.num,th.num{text-align:right}
td.num{font-family:var(--mono);white-space:nowrap}
td small{color:var(--ink2)}
tr.open-row{cursor:pointer}
tr.open-row:hover{background:var(--accent-soft)}
tr.off td{color:var(--ink2);text-decoration:line-through}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.tag{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--paper);color:var(--ink2);white-space:nowrap}
.tag.new{background:#F7E4E2;color:var(--danger)} .tag.confirmed{background:var(--accent-soft);color:var(--accent)}
.tag.packed{background:var(--inv-soft);color:#2C5F86} .tag.complete{background:#E6E6E0;color:var(--ink2)}
.tag.open{background:var(--accent-soft);color:var(--accent)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.flag{color:var(--danger);font-weight:700}
.none{color:var(--ink2);font-style:italic;padding:14px 8px}
.gap{background:var(--warn-soft);border-left:3px solid var(--warn);padding:11px 13px;font-size:13px;margin:12px 0}
.loading{padding:16px;color:var(--ink2);font-style:italic}

dialog.dlg{border:0;border-radius:14px;padding:0;width:min(760px,96vw);max-height:94vh;color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.dlg.wide{width:min(1120px,98vw)}
dialog.dlg::backdrop{background:rgba(22,21,15,.45)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card);z-index:2}
.dhead h2{margin:0;border:0;padding:0;flex:1;font-size:14px}
.dbody{padding:6px 18px 16px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--rule);position:sticky;bottom:0;background:var(--card)}
.dfoot .left{margin-right:auto;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;margin-top:8px}
.grid .wide{grid-column:1/-1}
.grid h3.wide{margin:10px 0 0}
.grid label.chk{align-self:end;padding:8px 0;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:600;color:var(--ink)}
.lines input,.lines select{padding:6px 7px;font-size:13px;margin:0}
.lines td{padding:5px 4px;vertical-align:middle}
.lines input.n{text-align:right;font-family:var(--mono)}
.hits{position:relative}
.hits ul{position:absolute;z-index:5;left:0;right:0;top:2px;margin:0;padding:0;list-style:none;background:var(--card);
  border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:260px;overflow:auto}
.hits li{padding:8px 10px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:13.5px}
.hits li:hover{background:var(--accent-soft)}
.hits li small{color:var(--ink2);display:block}
.custcard{background:var(--paper);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:6px;line-height:1.5}
.totals{margin-left:auto;width:min(320px,100%);font-size:13.5px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals div.big{font-weight:700;font-size:15px;border-top:1px solid var(--ink);margin-top:4px;padding-top:6px}
.totals span:last-child{font-family:var(--mono)}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.login{max-width:340px;margin:60px auto;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:24px}
.login label{display:block;margin-bottom:12px;font-size:12px;font-weight:700;color:var(--ink2)}
.login button{width:100%}

/* The invoice. Laid out to match what customers already receive. */
.inv{background:#fff;max-width:820px;margin:16px auto;padding:44px 46px;border:1px solid var(--rule);font-size:13.5px;line-height:1.45;page:inv}
.inv .top{display:flex;gap:20px;align-items:flex-start}
.inv .from{flex:1}.inv .from b{font-size:14px}
.inv .title{flex:1;color:var(--inv);font-size:22px;padding-top:2px}
.inv .logo{width:170px;height:auto}
.inv hr{border:0;border-top:2px solid var(--inv);margin:22px 0 0}
.inv .who{display:flex;gap:0;align-items:stretch}
.inv .who > div{padding:6px 0}
.inv .who .addr{flex:1;white-space:pre-line}
.inv .lab{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}
.inv .boxes{display:flex;margin-left:auto}
.inv .boxes div{background:var(--inv-soft);color:var(--inv);text-align:center;padding:26px 22px;min-width:118px}
.inv .boxes div.pay{background:var(--inv);color:#fff}
.inv .boxes b{display:block;font-weight:600}
.inv .ship{display:flex;gap:20px;margin:26px 0 18px}.inv .ship div{flex:1}
.inv table{font-size:13.5px}
.inv th{color:var(--ink);border-top:1px solid var(--rule);font-size:10.5px}
.inv td{font-family:var(--sans)}
.inv td.num{font-family:var(--sans)}
.inv .below{display:flex;gap:20px;margin-top:10px}
.inv .payd{flex:1;white-space:pre-wrap}
.inv .sums{width:320px}
.inv .sums div{display:flex;justify-content:space-between;padding:1px 0}
.inv .sums div span:first-child{color:var(--inv);text-transform:uppercase}
.inv .sums .due{border-top:1px solid var(--rule);border-bottom:1px solid var(--ink2);margin-top:14px;padding:8px 0 10px;align-items:baseline}
.inv .sums .due span:last-child{color:var(--inv);font-size:20px}
.inv .thanks{text-align:right;color:var(--inv);margin:10px 0 0}
.inv .bas{margin-top:26px}.inv .bas h4{font-weight:400;font-size:14px;margin:0 0 6px;text-transform:uppercase}
.inv .void{color:var(--danger);font-weight:700;font-size:20px;border:3px solid var(--danger);display:inline-block;padding:2px 12px;transform:rotate(-6deg)}

footer{margin-top:34px;padding-top:10px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between}

@page{margin:12mm;size:A4 landscape}
@page inv{margin:10mm;size:A4 portrait}
@media print{
  body{background:#fff;font-size:11px}
  .sheet{max-width:none;padding:0}
  .controls,.noprint,.tabs,dialog{display:none !important}
  table{font-size:10px}
  thead{display:table-header-group}
  body.printing-inv .masthead,body.printing-inv footer{display:none}
  .inv{border:0;margin:0;padding:0;max-width:none}
}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <img src="/mark.png" alt="" width="28" height="28" style="flex:none"><h1 id="tradingname">Buloke Farm</h1>
    <div class="pic" id="letterhead">Sales</div>
    <button id="navbtn" class="noprint" aria-label="Menu">&#8801;</button>
  </div>
  <nav class="tabs noprint" id="tabs" hidden></nav>
  <div id="out"><p class="loading">Loading…</p></div>
</div>

<script type="module">
// Local testing only: on localhost, a JSON {url,key} in localStorage
// "bf.api" points the page at a local Supabase stack instead.
const LOCAL = (() => { try {
  return ["localhost","127.0.0.1"].includes(location.hostname) && JSON.parse(localStorage.getItem("bf.api") || "null");
} catch(e){ return null; } })();
const SUPABASE_URL  = LOCAL?.url || "https://hgnzignikbpdbbyubahu.supabase.co";
const SUPABASE_ANON = LOCAL?.key || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnppZ25pa2JwZGJieXViYWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTgzNTcsImV4cCI6MjEwMTEzNDM1N30.U5vvmmZfSP0SOXsvLaxpjJ6LjWjOvaOYwTZ9VKyfFs0";

let createClient;
try      { ({ createClient } = await import("/vendor/supabase.js")); }
catch(e) { console.warn("vendor/supabase.js failed — falling back to esm.sh", e);
           ({ createClient } = await import("https://esm.sh/@supabase/supabase-js@2")); }

const timedFetch = (url, opts = {}) => {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 20000);
  return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t));
};
const db = createClient(SUPABASE_URL, SUPABASE_ANON, { global: { fetch: timedFetch } });

// ── small things ────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-AU", {day:"2-digit", month:"short", year:"2-digit"}) : "—";
const fmtDay = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-AU", {weekday:"short", day:"numeric", month:"short", year:"numeric"}) : "—";
const fmtNum = d => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
const money = c => (c < 0 ? "-" : "") + "$" + (Math.abs(c || 0) / 100).toLocaleString("en-AU", {minimumFractionDigits:2, maximumFractionDigits:2});
const plain = c => ((c || 0) / 100).toLocaleString("en-AU", {minimumFractionDigits:2, maximumFractionDigits:2});
const cents = v => { const n = parseFloat(String(v ?? "").replace(/[$,\s]/g, "")); return isFinite(n) ? Math.round(n * 100) : 0; };
const kg = v => v == null || v === "" ? "" : String(+(+v).toFixed(2));
// Never toISOString() for a calendar date: before 10am it is yesterday (README §3).
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const pad4 = n => n < 10000 ? String(n).padStart(4, "0") : String(n);
const fail = e => { console.error(e); alert(e?.message || String(e)); };
const safe = fn => async (...a) => { try { return await fn(...a); } catch(e){ fail(e); } };
async function q(query){ const { data, error } = await query; if(error) throw error; return data; }

const FUL = { pickup_butcher: "Pick-up — butcher", pickup_farm: "Pick-up — from us", delivery: "Delivery" };
const STATUS = ["new", "confirmed", "packed", "complete", "cancelled"];
const HSTATUS = [["planned", "Planned — dates to be confirmed"], ["open", "Open — taking orders"], ["closed", "Closed — fully booked"], ["done", "Done"]];
const DEFAULTS = { deposit_cents:0, delivery_fee_cents:0, price_cents:0, sort:0, cartons:1, sheet_multiple:1,
  invoice_terms_days:14, first_invoice_no:1, retail_ratio:0.66, country:"Australia", order_prefix:"BF" };

// What is asked of the butcher for the rest of a beef carcass once the
// packs are cut. The starting point for a new beef harvest; edit per harvest.
const BEEF_REMAINING = { columns: ["Cut", "Choices", "Butchering selection", "Size"], rows: [
  ["Eye Fillet", "Steak or Roast", "125gm steaks", "All Remaining"], ["Scotch Fillet", "Steak or Roast", "300gm steaks", "All Remaining"],
  ["Porterhouse", "Steak or Roast", "300gm steaks", "All Remaining"], ["T-Bone", "Steak", "Not to be Done", ""],
  ["Rump Steak", "Gourmet Steak, Diced, Traditional Steak", "300gm steaks (Gourmet)", "All Remaining"],
  ["Osso Bucco", "Osso or Gravy Beef", "Pieces of osso bucco", "All Remaining"],
  ["Silverside", "Roast, Diced, Stir Fry", "500gm beef diced", "All Remaining"], ["Topside", "Roast, Diced, Stir Fry", "500gm beef diced", "All Remaining"],
  ["Oyster Blade Steak", "Steak", "200gm steaks", "All Remaining"], ["Bolar Blade", "Steak, Roast, Diced", "1kg roasts", "All Remaining"],
  ["Round Steak", "Roast, Diced, Stir Fry, BBQ Steak", "Schnitzels (600g)", "All Remaining"],
  ["Brisket", "Rolled Whole or Minced", "1kg Rolled Whole Roasts", "All Remaining"], ["Chuck", "Stew, Diced, Minced", "500gm beef diced", "All Remaining"],
  ["Mince", "Mince, hamburger mince", "500gm beef mince packs", "All Remaining"], ["Flank", "Whole or Minced", "Mince (fine)", ""],
  ["Beef Marrow Bones", "Cut", "Marrow bones (cut into pieces please) 500gm", "All Remaining"],
  ["Other Bones", "Cut", "All other bones you can keep", ""], ["Ox tail, All Offal", "Options", "If available please keep aside", ""]], notes: [] };

// ── state ───────────────────────────────────────────────────────
let ME = null, CAN_WRITE = false, OWNER = false;
const S = { tab: "orders", harvest: null, status: "all", q: "", cq: "", invoiceId: null,
            harvests: [], products: [], options: [], orders: [], customers: [], invoices: [], biz: null,
            subs: null, mstatus: "subscribed", mq: "", mail: [] };
const LOADERS = {
  harvests:  () => q(db.from("v_harvest").select("*").order("harvest_on", { ascending: false })),
  products:  () => q(db.from("product").select("*").order("sort").order("name")),
  options:   () => q(db.from("product_option").select("*").order("sort")),
  orders:    () => q(db.from("v_order").select("*").order("order_no", { ascending: false }).limit(3000)),
  customers: () => q(db.from("v_customer").select("*").order("name").limit(5000)),
  invoices:  () => q(db.from("v_invoice").select("*").order("invoice_no", { ascending: false }).limit(3000)),
  biz:       () => q(db.from("farm_business").select("*").maybeSingle()),
  subs:      () => q(db.from("v_subscriber").select("*").order("email").limit(20000)),
  mail:      () => q(db.from("v_mail").select("id,kind,order_id,invoice_id,to_email,to_name,subject,status,error,created_at,sent_at,order_ref,invoice_no")
                       .order("created_at", { ascending: false }).limit(300))
};
async function reload(...keys){ await Promise.all(keys.map(async k => { S[k] = await LOADERS[k](); })); }
const harvestOf = id => S.harvests.find(h => h.id === id);
const productOf = optId => { const o = S.options.find(x => x.id === optId); return o && S.products.find(p => p.id === o.product_id); };

// Postcode -> the carrier's zone and days. Fetched as needed, kept.
const ZONES = new Map();
async function zones(pcs){
  const need = [...new Set(pcs.filter(p => p && !ZONES.has(p)))];
  if(!need.length) return;
  const rows = await q(db.from("v_delivery_postcode").select("postcode,zone,region,mon,tue,wed,thu,fri,sat").in("postcode", need));
  need.forEach(p => ZONES.set(p, null)); rows.forEach(r => ZONES.set(r.postcode, r));
}
const DAYK = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const zoneDays = z => z ? DAYK.slice(1).filter(d => z[d]).map(d => d[0].toUpperCase() + d.slice(1)).join(", ") : "";
const runsOn = (z, iso) => !z || !iso || !!z[DAYK[new Date(iso + "T00:00:00").getDay()]];

// ── email ───────────────────────────────────────────────────────
// The database writes an email (migration 76: a row in `mail`, in words
// made from the order or the invoice as it stands). It does not send it.
// The send-mail function does, and holds the mailbox's password so that
// no page ever does. So sending from here is three steps: ask for the
// email (an RPC, which answers with its id), wake the sender, and read
// what became of it.
const MAILKIND = { order: "Order confirmation", order_notice: "Notice to us", invoice: "Invoice", test: "Test" };
const fmtWhen = t => t ? new Date(t).toLocaleString("en-AU", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
async function wakeSender(){
  try { await db.functions.invoke("send-mail", { body: {} }); } catch(e){ console.warn("send-mail", e); }
}
async function sendQueued(id){
  let m;
  for(let i = 0; i < 10; i++){
    if(i % 4 === 0) await wakeSender();
    m = await q(db.from("v_mail").select("id,status,error,to_email").eq("id", id).single());
    if(m.status === "sent" || m.status === "failed") break;
    await new Promise(r => setTimeout(r, 1500));
  }
  await reload("mail");
  return m;
}
const mailResult = m => m.status === "sent" ? `Sent to ${m.to_email}.`
  : m.status === "failed" ? `Not sent. ${m.error || ""}`
  : "Not sent yet — it is still in the queue. Look under Settings → Email in a minute.";
// What has been emailed about an order or an invoice, one line each.
const mailLines = rows => rows.length ? `<p class="lede noprint" style="margin:10px 0">${rows.map(m =>
  `${esc(MAILKIND[m.kind] || m.kind)} ${m.status === "sent" ? "emailed" : m.status === "failed" ? `<span class="flag">not sent</span>` : "queued"} to ${esc(m.to_email)} · ${
    fmtWhen(m.sent_at || m.created_at)}${m.status === "failed" ? " — " + esc(m.error || "") : ""}`).join("<br>")}</p>` : "";

// ── forms from a spec: [key, label, type, extra] ────────────────
function formHtml(spec, obj){
  return spec.map(([k, label, type = "text", x]) => {
    const v = obj?.[k];
    if(type === "head")  return `<h3 class="wide">${esc(label)}</h3>`;
    if(type === "area")  return `<label class="wide">${esc(label)}<textarea name="${k}" rows="${x || 3}">${esc(v ?? "")}</textarea></label>`;
    if(type === "check") return `<label class="chk"><input type="checkbox" name="${k}" ${v ? "checked" : ""}>${esc(label)}</label>`;
    if(type === "sel")   return `<label>${esc(label)}<select name="${k}">${x.map(([val, text]) =>
      `<option value="${esc(val)}" ${String(v ?? "") === String(val) ? "selected" : ""}>${esc(text)}</option>`).join("")}</select></label>`;
    const val  = type === "money" ? (v == null ? "" : (v / 100).toFixed(2)) : (v ?? "");
    const attr = type === "date" ? 'type="date"' : type === "int" ? 'type="number" step="1"'
               : type === "num" ? 'type="number" step="any"' : type === "money" ? 'inputmode="decimal"' : "";
    return `<label>${esc(label)}<input name="${k}" value="${esc(val)}" ${attr} ${x || ""}></label>`;
  }).join("");
}
function formRead(spec, form){
  const out = {};
  for(const [k, , type = "text"] of spec){
    const el = form.elements[k];
    if(type === "head" || !el) continue;
    const raw = String(el.value ?? "").trim();
    if(type === "check") out[k] = el.checked;
    else if(raw === "") out[k] = k in DEFAULTS ? DEFAULTS[k] : null;
    else if(type === "money") out[k] = cents(raw);
    else if(type === "int" || type === "num") out[k] = Number(raw);
    else out[k] = raw;
  }
  return out;
}
function dialog(html, wide){
  const d = document.createElement("dialog");
  d.className = "dlg" + (wide ? " wide" : "");
  d.innerHTML = html;
  document.body.appendChild(d);
  // Closing takes the element away there and then. Waiting for the
  // "close" event left closed dialogs in the page where it never came.
  const nativeClose = d.close.bind(d);
  d.close = () => { if(d.open) nativeClose(); d.remove(); };
  d.addEventListener("cancel", e => { e.preventDefault(); d.close(); });   // Escape
  d.showModal();
  return d;
}

// Used for a product's standard sheet, a size's own sheet, one order
// line that differs, and a harvest's "what is left over".
function editSheet(sheet, title, onSave, canClear){
  const sh = JSON.parse(JSON.stringify(sheet || { columns: ["Cut", "Butchering selection"], rows: [["", ""]], notes: [] }));
  sh.notes = sh.notes || [];
  const d = dialog(`<div class="dhead"><h2>${esc(title)}</h2></div><div class="dbody" id="shb"></div>
    <div class="dfoot"><div class="left">${canClear ? `<button class="danger" data-act="clear">Use the standard sheet</button>` : ""}</div>
      <button class="ghost" data-act="close">Cancel</button><button data-act="ok">Use this sheet</button></div>`, true);
  const paint = () => {
    d.querySelector("#shb").innerHTML = `
      <label style="display:block;margin-top:10px;font-size:11px;font-weight:700;color:var(--ink2)">COLUMNS, SEPARATED BY |
        <input id="shcols" value="${esc(sh.columns.join(" | "))}"></label>
      <table class="lines" style="margin-top:10px"><thead><tr>${sh.columns.map(c => `<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody>
      ${sh.rows.map((r, i) => `<tr>${sh.columns.map((c, j) => `<td><input data-r="${i}" data-c="${j}" value="${esc(r[j] ?? "")}"></td>`).join("")}
        <td><button class="ghost small" data-act="delrow" data-i="${i}" title="Remove row">×</button></td></tr>`).join("")}</tbody></table>
      <p><button class="ghost small" data-act="addrow">+ Row</button></p>
      <h3>Notes printed under the sheet</h3>
      <table class="lines"><tbody>${sh.notes.map((n, i) => `<tr><td style="width:26%"><input data-n="${i}" data-c="0" value="${esc(n[0] ?? "")}" placeholder="Heading"></td>
        <td><input data-n="${i}" data-c="1" value="${esc(n[1] ?? "")}" placeholder="Note"></td>
        <td style="width:36px"><button class="ghost small" data-act="delnote" data-i="${i}">×</button></td></tr>`).join("")}</tbody></table>
      <p><button class="ghost small" data-act="addnote">+ Note</button></p>`;
  };
  paint();
  d.addEventListener("input", e => {
    const t = e.target;
    if(t.dataset.r !== undefined) sh.rows[+t.dataset.r][+t.dataset.c] = t.value;
    if(t.dataset.n !== undefined) sh.notes[+t.dataset.n][+t.dataset.c] = t.value;
  });
  d.addEventListener("change", e => {
    if(e.target.id === "shcols"){
      sh.columns = e.target.value.split("|").map(s => s.trim()).filter(Boolean);
      sh.rows = sh.rows.map(r => sh.columns.map((c, j) => r[j] ?? "")); paint();
    }
  });
  d.addEventListener("click", e => {
    const a = e.target.closest("[data-act]")?.dataset; if(!a) return;
    if(a.act === "addrow")  { sh.rows.push(sh.columns.map(() => "")); paint(); }
    if(a.act === "delrow")  { sh.rows.splice(+a.i, 1); paint(); }
    if(a.act === "addnote") { sh.notes.push(["", ""]); paint(); }
    if(a.act === "delnote") { sh.notes.splice(+a.i, 1); paint(); }
    if(a.act === "close")   d.close();
    if(a.act === "clear")   { onSave(null); d.close(); }
    if(a.act === "ok")      { sh.rows = sh.rows.filter(r => r.some(c => String(c).trim() !== ""));
                              sh.notes = sh.notes.filter(n => n.some(c => String(c).trim() !== "")); onSave(sh); d.close(); }
  });
}

async function zoneHint(pc){

  if(!/^\d{4}$/.test(pc || "")){ el.textContent = "Enter a postcode to see the carrier's zone and days."; return; }

      (runsOn(z, ED.o.deliver_on) ? "" : ` <span class="flag">${fmtDay(ED.o.deliver_on)} is not one of those days.</span>`);
}

function orderSums(){
  const { o, lines, pays } = ED;
  const goods = lines.reduce((a, l) => a + (l.qty || 0) * (l.unit_cents || 0) - (l.discount_cents || 0), 0);
  const fee = o.fulfilment === "delivery" ? (o.delivery_fee_cents || 0) : 0;
  const gst = lines.reduce((a, l) => a + Math.round(((l.qty || 0) * (l.unit_cents || 0) - (l.discount_cents || 0)) * (+l.gst_rate || 0) / 100), 0) + Math.round(fee * 0.10);
  const paid = pays.reduce((a, p) => a + p.amount_cents, 0);
  const dep = Math.min(goods, lines.reduce((a, l) => a + (l.qty || 0) * (productOf(l.product_option_id)?.deposit_cents || 0), 0));
  return { goods, fee, gst, total: goods + fee + gst, paid, due: goods + fee + gst - paid, dep,
           kg: lines.reduce((a, l) => a + (l.qty || 0) * (+l.size_kg || 0), 0), cartons: lines.reduce((a, l) => a + (l.qty || 0) * (l.cartons || 0), 0) };
}

// Customers pasted in from a spreadsheet or a shop export. The heading
// row says which column is which; the headings of the old sales
// workbook and of a Squarespace export are both understood. Nobody
// already on file (by email) is touched, and nothing is saved until
// the count has been read.
const IMPORT_HEADS = {
  name: ["customer name", "name", "full name", "billing name", "shipping name"], first: ["first name", "billing first name"], last: ["last name", "billing last name"],
  company: ["company", "business"], email: ["email", "email address", "customer email"], phone: ["phone", "phone number", "billing phone"], mobile: ["mobile"],
  street: ["street", "address", "address 1", "shipping address1", "shipping address 1", "billing address1", "billing address 1"],
  suburb: ["place name", "suburb", "city", "shipping city", "billing city"], state: ["state", "province", "shipping province", "billing province"],
  postcode: ["postcode", "post code", "zip", "postal code", "shipping zip", "billing zip"], country: ["country", "shipping country"], abn: ["abn"] };
function parseTable(text){
  const sep = text.includes("\t") ? "\t" : ",", rows = [];
  let row = [], cell = "", quoted = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(quoted){ if(ch === '"' && text[i + 1] === '"'){ cell += '"'; i++; } else if(ch === '"') quoted = false; else cell += ch; }
    else if(ch === '"' && cell === "") quoted = true;
    else if(ch === sep){ row.push(cell); cell = ""; }
    else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function readCustomers(text){
  const rows = parseTable(text); if(rows.length < 2) return { found: [], skipped: 0, why: "Paste the heading row and at least one customer." };
  const heads = rows[0].map(h => h.trim().toLowerCase()), col = {};
  for(const [k, names] of Object.entries(IMPORT_HEADS)){ const i = heads.findIndex(h => names.includes(h)); if(i >= 0) col[k] = i; }
  if(col.name === undefined && col.first === undefined) return { found: [], skipped: 0, why: "No column headed Name or Customer Name was found in the first row." };
  const have = new Set(S.customers.map(c => (c.email || "").toLowerCase()).filter(Boolean)), found = []; let skipped = 0;
  for(const r of rows.slice(1)){
    const get = k => col[k] === undefined ? "" : String(r[col[k]] ?? "").trim();
    const name = (get("name") || [get("first"), get("last")].filter(Boolean).join(" ")).replace(/\s+-\s+\d+$/, "");   // "Liam Cremin - 2" was a second pack, not a second person
    const email = get("email").toLowerCase(), mobile = get("mobile"), phone = get("phone");
    if(!name || name === "0" || (email && have.has(email)) || (!email && found.some(f => f.name === name))){ skipped++; continue; }
    if(email) have.add(email);
    found.push({ name, company: get("company") || null, email: email || null, phone: mobile || phone || null, alt_phone: mobile && phone ? phone : null,
      street: get("street") || null, suburb: get("suburb") || null, state: get("state") || null, postcode: get("postcode") || null,
      country: get("country") || "Australia", abn: get("abn") || null, source: "import" });
  }
  return { found, skipped };
}
function importCustomers(){
  let found = [];
  const d = dialog(`<div class="dhead"><h2>Import customers</h2></div><div class="dbody">
    <p class="lede" style="margin-top:12px">Copy the rows out of a spreadsheet — heading row included — and paste them here. Columns are matched by their heading:
      Customer Name (or First Name and Last Name), Company, Email, Phone, Mobile, Street, Place Name or Suburb, State, Postcode. A CSV export works too.
      Anyone whose email is already on file is left alone.</p>
    <textarea id="imp" rows="10" style="font-family:var(--mono);font-size:12px;white-space:pre" placeholder="Customer Name	Email	Mobile	Street	Place Name	State	Postcode"></textarea>
    <p id="impmsg" style="font-size:13.5px;min-height:1.3em"></p></div>
    <div class="dfoot"><button class="ghost" data-act="close">Cancel</button><button data-act="go" disabled>Import</button></div>`, true);
  d.querySelector("#imp").addEventListener("input", e => {
    const r = readCustomers(e.target.value); found = r.found;
    d.querySelector("#impmsg").innerHTML = r.why ? `<span class="flag">${esc(r.why)}</span>`
      : `<b>${found.length}</b> new customer${found.length === 1 ? "" : "s"} to add${r.skipped ? `, ${r.skipped} row${r.skipped === 1 ? "" : "s"} skipped (blank, repeated, or already on file)` : ""}.` +
        (found.length ? ` First: ${esc(found[0].name)}${found[0].email ? " · " + esc(found[0].email) : ""}${found[0].suburb ? " · " + esc(found[0].suburb) : ""}.` : "");
    d.querySelector("[data-act=go]").disabled = !found.length;
  });

// A Mailchimp audience export, or any CSV with an email column. Which
// list a Mailchimp file is — subscribed, unsubscribed, cleaned — is
// read from its columns; the database decides what happens to someone
// already on the list (import_subscribers: the later change wins).
const mcWhen = v => { v = String(v || "").trim(); let m;
  if((m = v.match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d):(\d\d)(?::(\d\d))?)?/))) return `${m[1]}-${m[2]}-${m[3]} ${m[4] || "00"}:${m[5] || "00"}:${m[6] || "00"}`;
  if((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?: (\d{1,2}):(\d\d)(?::(\d\d))?)?/))) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")} ${(m[4] || "0").padStart(2, "0")}:${m[5] || "00"}:${m[6] || "00"}`;
  return ""; };
function readAudience(text){
  const rows = parseTable(text); if(rows.length < 2) return { why: "That file has no rows." };
  const heads = rows[0].map(h => h.trim()), at = name => heads.findIndex(h => h.toLowerCase() === name.toLowerCase());
  const ie = heads.findIndex(h => /^e-?mail( address)?$/i.test(h)); if(ie < 0) return { why: "No column headed Email or Email Address was found." };
  const status = at("UNSUB_TIME") >= 0 ? "unsubscribed" : at("CLEAN_TIME") >= 0 ? "bounced" : "subscribed";
  const reasons = { NORMAL: "", NOSIGNUP: "said they never signed up", SPAM: "marked it as spam", OTHER: "" };
  const out = rows.slice(1).map(r => { const g = name => { const i = at(name); return i < 0 ? "" : String(r[i] ?? "").trim(); };
    const why = (g("UNSUB_REASON") in reasons ? reasons[g("UNSUB_REASON")] : g("UNSUB_REASON").toLowerCase()) || g("UNSUB_REASON_OTHER");
    return { email: String(r[ie] ?? "").trim(), first_name: g("First Name"), last_name: g("Last Name"), state: g("State"),
      opted_in_on: mcWhen(g("CONFIRM_TIME")) || mcWhen(g("OPTIN_TIME")),
      changed_on: status === "unsubscribed" ? mcWhen(g("UNSUB_TIME")) : status === "bounced" ? mcWhen(g("CLEAN_TIME")) : (mcWhen(g("LAST_CHANGED")) || mcWhen(g("CONFIRM_TIME"))),
      note: status === "unsubscribed" ? [g("UNSUB_CAMPAIGN_TITLE") ? `Unsubscribed from “${g("UNSUB_CAMPAIGN_TITLE")}”` : "", why].filter(Boolean).join("; ")
          : status === "bounced" ? (g("CLEAN_CAMPAIGN_TITLE") ? `Bounced on “${g("CLEAN_CAMPAIGN_TITLE")}”` : "") : "",
      source: at("LEID") >= 0 ? "Mailchimp" + (g("SOURCE") ? ": " + g("SOURCE") : "") : "import" }; }).filter(x => x.email);
  return { status, rows: out, mailchimp: at("LEID") >= 0 };
}
function importSubscribers(){
  let got = null;

  }));

// A real .xlsx with nothing but the browser: a zip of six small XML
// files, stored uncompressed. Strings are shared strings and dates are
// real date cells, because that is what the carrier's own template has.
const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for(const [name, text] of files){
    const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data), n = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true); lh.setUint16(26, nm.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    parts.push(new Uint8Array(lh.buffer), nm, data); central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + n;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, central.reduce((a, b) => a + b.length, 0), true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xlsx(sheetName, rows){
  const x = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const colName = i => { let s = ""; i++; while(i){ s = String.fromCharCode(65 + (i - 1) % 26) + s; i = Math.floor((i - 1) / 26); } return s; };
  const strs = [], idx = new Map();
  const sid = v => { if(!idx.has(v)){ idx.set(v, strs.length); strs.push(v); } return idx.get(v); };
  const cell = (v, r, c) => { const ref = colName(c) + r;

    if(typeof v === "object"){ if(!v.d) return ""; const [y, m, dd] = v.d.split("-").map(Number);

    ["_rels/.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `${head}<workbook ${ns} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `${head}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`],
    ["xl/styles.xml", `${head}<styleSheet ${ns}><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`],
    ["xl/sharedStrings.xml", `${head}<sst ${ns} count="${strs.length}" uniqueCount="${strs.length}">${strs.map(s => `<si><t xml:space="preserve">${x(s)}</t></si>`).join("")}</sst>`],

  ["from_harvest", "Cut from a harvest (goes on butcher sheets)", "check"], ["local_only", "Pick-up or local only", "check"], ["active", "On sale", "check"]];
function editProduct(id){
  const p = id ? { ...S.products.find(x => x.id === id) } : { kind: "other", active: true, from_harvest: true, deposit_cents: 0, gst_rate: 0, sort: 100 };
  let sheet = p.cut_sheet || null;
  let opts = id ? S.options.filter(o => o.product_id === id).map(o => ({ ...o })) : [{ name: "", price_cents: 0, cartons: 1, sheet_multiple: 1, active: true }];
  const d = dialog(`<form method="dialog"><div class="dhead"><h2>${id ? esc(p.name) : "New product"}</h2></div><div class="dbody"><div class="grid">${formHtml(PROD_SPEC, p)}
      <label class="wide">Asked on the order form — one question per line, as “Question: standard choice | other choice”. Choices only; customers never type a request
        <textarea name="questions_text" rows="2" placeholder="Soup bones: Yes please | None">${esc((p.questions || []).map(k => `${k.label}: ${k.choices.join(" | ")}`).join("\n"))}</textarea></label></div>
    <p style="margin:10px 0 0"><button type="button" class="ghost small" data-act="sheet">Standard cut sheet…</button> <span id="shs" style="font-size:12.5px;color:var(--ink2)"></span></p>
    <h3>Sizes</h3><div style="overflow-x:auto"><table class="lines" id="po"></table></div><p style="margin:8px 0"><button type="button" class="ghost small" data-act="add">+ Size</button></p></div>
    <div class="dfoot"><button type="button" class="ghost" data-act="close">Cancel</button>${CAN_WRITE ? `<button type="button" data-act="save">Save</button>` : ""}</div></form>`, true);
  const shs = () => d.querySelector("#shs").textContent = sheet ? `${sheet.rows.length} lines` : "none";
  const paint = () => d.querySelector("#po").innerHTML = `<thead><tr><th style="min-width:190px">Reads as</th><th>Shop word</th><th>SKU</th><th>Kg</th><th>Price</th><th>Cartons</th>
      <th title="A 24 kg pack is the 12 kg sheet twice">Sheet ×</th><th>On sale</th><th>Own sheet</th><th></th></tr></thead><tbody>` +
    opts.map((o, i) => `<tr><td><input data-i="${i}" data-f="name" value="${esc(o.name || "")}"></td><td><input data-i="${i}" data-f="label" value="${esc(o.label || "")}" style="width:110px"></td>
      <td><input data-i="${i}" data-f="sku" value="${esc(o.sku || "")}" style="width:100px"></td>
      <td><input class="n" data-i="${i}" data-f="size_kg" type="number" step="any" value="${esc(o.size_kg ?? "")}" style="width:70px"></td>
      <td><input class="n" data-i="${i}" data-f="price_cents" value="${((o.price_cents || 0) / 100).toFixed(2)}" style="width:90px"></td>
      <td><input class="n" data-i="${i}" data-f="cartons" type="number" min="0" step="1" value="${esc(o.cartons ?? 1)}" style="width:60px"></td>
      <td><input class="n" data-i="${i}" data-f="sheet_multiple" type="number" step="any" value="${esc(o.sheet_multiple ?? 1)}" style="width:60px"></td>
      <td><input type="checkbox" data-i="${i}" data-f="active" ${o.active ? "checked" : ""}></td>
      <td><button type="button" class="ghost small" data-act="osheet" data-i="${i}">${o.cut_sheet ? "Own sheet" : "Standard"}</button></td>
      <td>${o.id ? "" : `<button type="button" class="ghost small" data-act="del" data-i="${i}">×</button>`}</td></tr>`).join("") + `</tbody>`;
  paint(); shs();
  d.addEventListener("input", e => { const t = e.target; if(t.dataset.i === undefined) return; const o = opts[+t.dataset.i], f = t.dataset.f;
    o[f] = t.type === "checkbox" ? t.checked : f === "price_cents" ? cents(t.value) : ["size_kg", "cartons", "sheet_multiple"].includes(f) ? (t.value === "" ? null : Number(t.value)) : (t.value || null); });
  d.addEventListener("click", safe(async e => {
    const a = e.target.closest("[data-act]")?.dataset; if(!a) return;
    if(a.act === "close") d.close();
    if(a.act === "add"){ opts.push({ name: "", price_cents: 0, cartons: 1, sheet_multiple: 1, active: true }); paint(); }
    if(a.act === "del"){ opts.splice(+a.i, 1); paint(); }
    if(a.act === "sheet") editSheet(sheet, "Standard cut sheet — " + (p.name || "product"), sh => { sheet = sh; shs(); }, true);
    if(a.act === "osheet"){ const o = opts[+a.i]; editSheet(o.cut_sheet || sheet, "Cut sheet — " + (o.name || "this size"), sh => { o.cut_sheet = sh; paint(); }, true); }
    if(a.act === "save"){
      const v = formRead(PROD_SPEC, d.querySelector("form")); v.gst_rate = Number(v.gst_rate || 0); v.cut_sheet = sheet;
      // [] and not null when there are none: null means "never set" to migration 74's one-time fill.
      v.questions = d.querySelector("[name=questions_text]").value.split("\n").map(line => { const at = line.indexOf(":"); if(at < 1) return null;
        const choices = line.slice(at + 1).split("|").map(c => c.trim()).filter(Boolean); return choices.length > 1 ? { label: line.slice(0, at).trim(), choices } : null; }).filter(Boolean);
      if(!v.name || !/^[a-z0-9-]{2,60}$/.test(v.slug || "")){ alert("A product needs a name and a web address of lower-case letters, digits and hyphens."); return; }
      const pid = id || (await q(db.from("product").insert(v).select("id")))[0].id;
      if(id) await q(db.from("product").update(v).eq("id", id));
      for(const [i, o] of opts.entries()){
        if(!String(o.name || "").trim()) continue;
        const row = { name: o.name, label: o.label || null, sku: o.sku || null, size_kg: o.size_kg ?? null, price_cents: o.price_cents || 0, cartons: o.cartons ?? 1,
                      sheet_multiple: o.sheet_multiple ?? 1, active: !!o.active, cut_sheet: o.cut_sheet || null, sort: (i + 1) * 10 };
        if(o.id) await q(db.from("product_option").update(row).eq("id", o.id)); else await q(db.from("product_option").insert({ ...row, product_id: pid }));
      }
      await reload("products", "options"); d.close(); render();
    }
  }));
}
function viewProducts(){
  $("#out").innerHTML = `<div class="controls noprint"><p class="lede grow" style="margin:0">What the website offers. A size taken off sale stays on the orders that already have it.</p>
      ${CAN_WRITE ? `<button data-act="newproduct">+ New product</button>` : ""}</div>` +
    S.products.map(p => `<h2>${esc(p.name)} ${p.active ? "" : `<span class="tag">off sale</span>`}</h2>
      <table><thead><tr><th>Size</th><th>SKU</th><th class="num">Kg</th><th class="num">Price</th><th class="num">Per kg</th><th class="num">Cartons</th><th>Cut sheet</th><th></th></tr></thead><tbody>` +
      S.options.filter(o => o.product_id === p.id).map(o => `<tr class="open-row ${o.active ? "" : "off"}" data-act="product" data-id="${p.id}"><td>${esc(o.name)}${o.label ? ` <small>${esc(o.label)}</small>` : ""}</td>
        <td class="m">${esc(o.sku || "")}</td><td class="num">${kg(o.size_kg)}</td><td class="num">${money(o.price_cents)}</td>
        <td class="num">${o.size_kg ? money(Math.round(o.price_cents / o.size_kg)) : "—"}</td><td class="num">${o.cartons}</td>
        <td>${o.cut_sheet ? "its own" : p.cut_sheet ? `standard${+o.sheet_multiple !== 1 ? " × " + kg(o.sheet_multiple) : ""}` : "—"}</td><td></td></tr>`).join("") +
      `</tbody></table><p class="lede" style="margin-top:6px">${p.deposit_cents ? "Deposit " + money(p.deposit_cents) + " per pack · " : ""}${+p.gst_rate ? "GST 10%" : "GST free"}${p.local_only ? " · local only" : ""}${
        (p.questions || []).map(k => ` · asks ${esc(k.label)} (${esc(k.choices.join(" / "))})`).join("")}
        ${CAN_WRITE ? ` · <a href="#" data-act="product" data-id="${p.id}">Edit</a>` : ""}</p>`).join("");
}

// ── settings ────────────────────────────────────────────────────
const BIZ_SPEC = [["abn", "ABN"], ["phone", "Phone"], ["email", "Email"], ["website", "Website"], ["invoice_terms_days", "Invoice due after, days", "int"],
  ["order_prefix", "Order prefix"], ["first_invoice_no", "Invoice numbers start at", "int"],
  ["payment_details", "Payment details — printed on every invoice, exactly as typed", "area", 5]];
function viewSettings(){
  $("#out").innerHTML = `<h2>The invoice letterhead</h2><p class="lede">The name and address come from the farm; the rest is here. Only an owner can change it.</p>
    <form id="bizf"><div class="grid" style="max-width:820px">${formHtml(BIZ_SPEC, S.biz || { invoice_terms_days: 14, order_prefix: "BF", first_invoice_no: 1 })}</div>
    <p>${OWNER ? `<button type="button" data-act="savebiz">Save</button>` : ""} <span id="bizmsg" style="font-size:13px;color:var(--accent)"></span></p></form>
    <h2>The butcher's login</h2><p class="lede" style="max-width:820px">The butcher signs in at <b>/butcher</b> and sees only the harvests whose sheets you have released: the summary, the customer list and each cut sheet. No prices, no payments, nothing about the herd.
      Create their login under Supabase → Authentication → Users → Add user, then on the phone app go to Record → Manage → Who can see this farm and add their email with the role Butcher.</p>
    <h2>Email</h2><p class="lede" style="max-width:820px">Order confirmations and invoices are sent from the Email address above${S.biz?.email ? ` (<b>${esc(S.biz.email)}</b>)` : ""}, and a copy of each lands in that mailbox's Sent folder.
      The mailbox's password is not kept here or anywhere in these pages: it is a secret on the sending function, set in Supabase → Edge Functions → Secrets.
      Send a test first; when it arrives, turn on the website confirmations.</p>
    <p>${OWNER ? `<button type="button" class="ghost" data-act="mailtest">Send a test email</button>` : ""} <span id="mailtestmsg" style="font-size:13px"></span></p>
    <p><label style="display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600"><input type="checkbox" id="mailweb" ${S.biz?.email_web_orders ? "checked" : ""} ${OWNER ? "" : "disabled"}>
      When an order arrives from the website, email the customer a confirmation and email us a notice</label></p>
    <h3>What has been emailed</h3>` +
    (S.mail.length ? `<table><thead><tr><th>When</th><th>What</th><th>To</th><th>About</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody>` +
      S.mail.map(m => `<tr class="open-row" data-act="mailview" data-id="${m.id}"><td class="m">${fmtWhen(m.created_at)}</td><td>${esc(MAILKIND[m.kind] || m.kind)}</td>
        <td>${esc(m.to_email)}</td><td class="m">${esc(m.invoice_no ? "Invoice " + m.invoice_no : m.order_ref || "")}</td><td>${esc(m.subject)}</td>
        <td>${m.status === "sent" ? "Sent" : m.status === "failed" ? `<span class="flag">Not sent</span> — ${esc(m.error || "")}` : "Queued"}</td>
        <td>${m.status === "failed" && CAN_WRITE ? `<button type="button" class="ghost small" data-act="mailretry" data-id="${m.id}">Try again</button>` : ""}</td></tr>`).join("") + `</tbody></table>`
     : `<p class="none">Nothing has been emailed yet.</p>`);
}

// ── clicks on the page ──────────────────────────────────────────
$("#out").addEventListener("click", safe(async e => {
  const hc = e.target.closest("[data-h]");
  if(hc){ S.harvest = hc.dataset.h; render(); return; }
  const sc = e.target.closest("[data-s]");
  if(sc){ S.status = sc.dataset.s; render(); return; }
  const mc = e.target.closest("[data-m]");
  if(mc){ S.mstatus = mc.dataset.m; render(); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset;
  if(el.tagName === "A") e.preventDefault();
  if(a.act === "print") window.print();
  if(a.act === "neworder") editOrder(null);
  if(a.act === "order") editOrder(a.id);
  if(a.act === "newcust") editCustomer(null);
  if(a.act === "importcust") importCustomers();
  if(a.act === "newsub") editSubscriber(null);
  if(a.act === "sub") editSubscriber(a.id);
  if(a.act === "importsub") importSubscribers();
  if(a.act === "copysubs" || a.act === "csvsubs"){
    const yes = mailingShown().filter(r => r.status === "subscribed");
    if(a.act === "copysubs"){ await navigator.clipboard.writeText(yes.map(r => r.email).join(", ")); el.textContent = "Copied"; }
    else { const cell = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      download(new Blob([[["Email Address", "First Name", "Last Name", "State"], ...yes.map(r => [r.email, r.first_name || "", r.last_name || "", r.state || ""])]
        .map(r => r.map(cell).join(",")).join("\r\n")], { type: "text/csv" }), `Mailing list - subscribed - ${today()}.csv`); }
  }
  if(a.act === "cust") editCustomer(a.id);
  if(a.act === "newharvest") editHarvest(null);
  if(a.act === "harvest") editHarvest(a.id);
  if(a.act === "inv") openInvoice(a.id);
  if(a.act === "backinv") go("invoices");
  if(a.act === "editinv") editInvoice();
  if(a.act === "mailinv") mailInvoice();
  if(a.act === "mailtest"){
    const out = $("#mailtestmsg"); el.disabled = true; out.textContent = "Sending…";
    try { const m = await sendQueued(await q(db.rpc("mail_test"))); viewSettings(); $("#mailtestmsg").textContent = m.status === "sent" ? `Sent to ${m.to_email} — check the inbox.` : mailResult(m); }
    catch(err){ el.disabled = false; out.textContent = ""; throw err; }
    return;
  }
  if(a.act === "mailretry"){
    el.disabled = true; el.textContent = "Sending…";
    await q(db.rpc("mail_retry", { p_id: a.id })); const m = await sendQueued(a.id); viewSettings();
    if(m.status !== "sent") alert(mailResult(m));
    return;
  }
  if(a.act === "mailview"){
    const m = await q(db.from("v_mail").select("to_email,to_name,subject,body_text,status,error,created_at,sent_at").eq("id", a.id).single());
    const d = dialog(`<div class="dhead"><h2>${esc(m.subject)}</h2></div><div class="dbody">
        <p class="lede">To ${esc(m.to_name ? m.to_name + " — " : "")}${esc(m.to_email)} · ${m.status === "sent" ? "sent " + fmtWhen(m.sent_at) : m.status === "failed" ? "not sent: " + esc(m.error || "") : "queued " + fmtWhen(m.created_at)}</p>
        <pre style="white-space:pre-wrap;font:inherit;font-size:13.5px;margin:0">${esc(m.body_text)}</pre></div>
      <div class="dfoot"><button type="button" data-act="close">Close</button></div>`);
    d.addEventListener("click", e => { if(e.target.closest("[data-act=close]")) d.close(); });
    return;
  }
  if(a.act === "sentinv"){ await q(db.from("invoice").update({ sent_on: today() }).eq("id", INV.inv.id)); await reload("invoices"); openInvoice(INV.inv.id); }
  if(a.act === "voidinv"){ if(!confirm(`Void invoice ${INV.inv.invoice_no}? The number is kept and never reused.`)) return;
    await q(db.from("invoice").update({ void: true }).eq("id", INV.inv.id)); await reload("invoices", "orders"); openInvoice(INV.inv.id); }
  if(a.act === "newproduct") editProduct(null);
  if(a.act === "product") editProduct(a.id);
  if(a.act === "savebiz"){
    const v = formRead(BIZ_SPEC, $("#bizf"));
    await q(db.from("farm_business").upsert({ ...v, farm_id: ME.farm_id }));
    await reload("biz"); $("#bizmsg").textContent = "Saved.";
  }
  if(a.act === "xlsx" || a.act === "csv"){
    const rows = manifestRows(), h = harvestOf(S.harvest), stamp = today().replace(/-/g, "");
    if(a.act === "xlsx") download(xlsx("Template", [MANIFEST, ...rows]), `Booking Manifest - ${ME.farm_name}_${stamp}.xlsx`);
    else download(new Blob([[MANIFEST, ...rows].map(r => r.map(v => { const s = v && typeof v === "object" ? (v.d || "") : String(v ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n")], { type: "text/csv" }), `Booking Manifest - ${ME.farm_name}_${stamp}.csv`);
  }
}));
// Typing in the delivery table saves that one field.
$("#out").addEventListener("change", safe(async e => {
  const t = e.target;
  if(t.id === "mailweb"){
    if(t.checked && !S.mail.some(m => m.kind === "test" && m.status === "sent") &&
       !confirm("No test email has got through yet, so these may not be sent. Turn it on anyway?")){ t.checked = false; return; }
    await q(db.from("farm_business").upsert({ farm_id: ME.farm_id, email_web_orders: t.checked }));
    await reload("biz"); return;
  }
  if(t.dataset.id && t.dataset.f){
    const v = t.value.trim() || null;
    await q(db.from("customer_order").update({ [t.dataset.f]: v }).eq("id", t.dataset.id));
    await reload("orders");
    if(t.dataset.f === "deliver_on") viewDelivery();
  }
}));
$("#out").addEventListener("input", safe(async e => {
  if(e.target.id !== "pcq") return;
  const pc = e.target.value.trim(), out = $("#pcr");
  if(!/^\d{4}$/.test(pc)){ out.textContent = ""; return; }
  await zones([pc]); const z = ZONES.get(pc);
  out.innerHTML = z ? `<b>${esc(z.zone)}</b> · ${esc(zoneDays(z))}` : `<span class="flag">Not on the schedule</span>`;
}));

// ── farm, sign-in, start ────────────────────────────────────────
async function loadFarms(){
  const { data } = await db.from("v_my_farms").select("*");
  window.__setFarms?.(data || [], async id => {
    const { data: { user } } = await db.auth.getUser();
    const { error } = await db.from("farm_user").update({ current_farm_id: id }).eq("id", user.id);
    if(error){ alert(error.message); return; }
    location.reload();
  });
}
window.__signOut = () => db.auth.signOut();

function signIn(){
  return new Promise(resolve => {
    $("#out").innerHTML = `<form class="login" id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="pw" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lerr"></p><button>Sign in</button></form>`;
    $("#login").onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const { error } = await db.auth.signInWithPassword({ email: f.get("email"), password: f.get("pw") });
      if(error){ $("#lerr").textContent = error.message; return; }
      resolve();
    };
  });
}

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if(!session) await signIn();
  $("#out").innerHTML = `<p class="loading">Loading…</p>`;
  const { data } = await db.from("v_me").select("id,role,active,farm_id,farm_name,farm_address,logo_url").maybeSingle();
  ME = data;
  if(!ME){ $("#out").innerHTML = `<p class="gap">This login is not on a farm yet. Ask an owner to add you.</p>`; return; }
  if(ME.role === "butcher"){ location.replace("/butcher"); return; }
  CAN_WRITE = ["owner", "manager"].includes(ME.role); OWNER = ME.role === "owner";
  document.title = document.title.replace("Buloke Farm", ME.farm_name);
  $("#tradingname").textContent = ME.farm_name;
  $("#letterhead").textContent = "Sales · " + (ME.farm_address || "");
  if(ME.logo_url) document.querySelector(".masthead img").src = ME.logo_url;
  window.__setFarm?.({ name: ME.farm_name, logo_url: ME.logo_url }); loadFarms();
  try {
    await reload("harvests", "products", "options", "orders", "customers", "invoices", "biz");
  } catch(e){
    $("#out").innerHTML = `<p class="gap"><b>Not available yet.</b> ${esc(e.message)} — the sales migrations (69–72) haven't been run.</p>`;
    return;
  }
  // The email log is newer than the rest (76) and nothing else waits on it.
  // Anything still queued — a website order whose browser closed before it
  // could wake the sender — is sent now that somebody is here.
  try { await reload("mail"); } catch(e){ console.warn("mail", e); S.mail = []; }
  if(S.mail.some(m => m.status === "queued")) wakeSender().then(() => reload("mail")).catch(() => {});
  // Start on the harvest that is taking orders, or the latest; but if the
  // website has sent orders nobody has looked at, start with those.
  S.harvest = S.orders.some(o => o.status === "new") ? "all" : (S.harvests.find(h => h.status === "open") || S.harvests[0] || { id: "all" }).id;
  if(S.orders.some(o => o.status === "new")) S.status = "new";
  const [tab, arg] = location.hash.slice(1).split("/");
  if(tab === "invoice" && arg) { await safe(openInvoice)(arg); return; }
  if(TABS.some(t => t[0] === tab)) S.tab = tab;
  render();
  // The link in a "new website order" email: /sales#order/<id>.
  if(tab === "order" && arg) await safe(editOrder)(arg);
})();
</script>
