function recJoining(){
  const wrap  = el(`<div></div>`);
  const chips = el(`<div class="chips" style="padding:12px 0 2px"></div>`);
  const slot  = el(`<div></div>`);
  const build = { natural: joinNatural, ai: joinAI };
  // Which kind of joining lives in S, not here. Anything that calls
  // render — the species bar, the straw filters — rebuilds this whole
  // function, and a local variable would drop you back on Bull out
  // halfway through recording an AI.
  S.joinMode = build[S.joinMode] ? S.joinMode : "natural";
  const show = () => {
    chips.querySelectorAll(".chip")
      .forEach(b => b.setAttribute("aria-pressed", b.dataset.m === S.joinMode));
    slot.replaceChildren(build[S.joinMode]());
  };
  for(const [m,label] of [["natural", `${w("sire")} out`],["ai","AI"]]){
    const b = el(`<button type="button" class="chip" data-m="${m}">${esc(label)}</button>`);
    b.onclick = () => { S.joinMode = m; show(); };
    chips.appendChild(b);
  }
  wrap.append(chips, slot); show();
  return wrap;
}

// ─── AI: one cow, one straw ─────────────────────────────────────
function joinAI(){
  const cows = S.animals.filter(a => a.sex==="female" && isActive(a) && inSpecies(a));
  if(!cows.length) return el(`<div class="empty"><b>No ${wl("dam")}s on record</b></div>`);
  // An AI is a straw out of a tank. If it is not in the register it
  // cannot be used, so the register is the only way in — and putting
  // one in here is putting it in the register.
  //
  // Lots with none left are not offered: you cannot thaw a straw that
  // is not there, and leaving them in the list only lengthens it.
  const inStock = (S.refs.semen || []).filter(x => Number(x.straws_left) > 0);
  // Same filters and the same state as the tank store, so narrowing
  // down at the flask carries straight into recording the job.
  const straws  = cryoFilter(inStock);

  const inner = el(`<div>
    <label><span>${w("dam")}</span><select name="dam" required>
      <option value="">Which ${wl("dam")}…</option>
      ${cows.map(a=>`<option value="${a.id}"${S.sel===a.id?" selected":""}>${
        esc(codeOf(a))}${a.name?" · "+esc(a.name):""}</option>`).join("")}
    </select></label>
    <label><span>Straw</span><select name="semen" required>
      <option value="">Which straw…${straws.length < inStock.length
        ? ` (${straws.length} of ${inStock.length})` : ""}</option>
      ${straws.map(s=>`<option value="${s.id}">${esc(s.sire_label||s.sire_name)}${
        s.tank?` — tank ${esc(s.tank)} loc ${esc(s.location||"?")}`:""} · ${
        s.straws_left} left${s.shelf_label?` · ${esc(s.shelf_label)}`:""}</option>`).join("")}
      <option value="__new">＋ Register a new straw…</option>
    </select></label>
    <div class="newstraw" hidden>
      <div class="note">This adds it to the register, so it will be in the tank list next time.</div>
      <label><span>Name on the straw</span><input type="text" name="nname" placeholder="${w("sire")} name"></label>
      <div class="two">
        <label><span>Tank</span><select name="ntank">
          <option value="1">Tank 1</option><option value="2">Tank 2</option></select></label>
        <label><span>Location</span><select name="nloc">
          ${[1,2,3,4,5,6].map(i=>`<option value="${i}">${i}</option>`).join("")}</select></label>
      </div>
      <div class="two">
        <label><span>Straw code</span><input type="text" name="ncode"></label>
        <label><span>Breed</span><input type="text" name="nbreed"></label>
      </div>
      <label><span>Supplier</span><input type="text" name="nsupplier"></label>
      <div class="two">
        <label><span>Collected</span><input type="date" name="ncollected"></label>
        <label><span>Straws in</span><input type="number" name="nstraws" min="0" inputmode="numeric"></label>
      </div>
    </div>
    <div class="two">
      <label><span>Inseminated on</span><input type="date" name="on" value="${today()}" required></label>
      <label><span>Confidence %</span><input type="number" name="conf" min="0" max="100"
        step="5" inputmode="numeric" placeholder="—"></label>
    </div>
    <p class="hint">How well the job went — heat signs, timing, how the straw handled.
      Leave it blank if you'd rather not guess; blank and zero aren't the same thing.</p>
    <div class="two">
      <label><span>Gestation days</span><input type="number" name="gest" value="${GEST_BY_SPECIES[S.species] || GEST_DEFAULT}"
        min="250" max="310" inputmode="numeric"></label>
      <label><span>Due</span><input type="date" name="due"></label>
    </div>
    <p class="hint" id="gesthint"></p>
    ${joinCommon()}
    <label><span>Notes</span><input type="text" name="notes" placeholder="Optional"></label>
    <div class="note">The result goes on later, in the joining register — a joining recorded
      today has no outcome yet, and a default one would read like a finding.</div>
  </div>`);

  const q = s => inner.querySelector(s);
  const dam = q('[name=dam]'), sem = q('[name=semen]'), nb = q('.newstraw'),
        on = q('[name=on]'), gest = q('[name=gest]'), due = q('[name=due]'),
        hint = q('#gesthint');

  sem.onchange = () => nb.hidden = sem.value !== "__new";

  // Gestation is the cow's, not the joining's. Hers is the starting
  // point; changing it here is her being corrected, not an exception.
  const loadGest = () => {
    const a = cows.find(c => c.id===dam.value);
    gest.value = gestFor(a);
    hint.textContent = !a ? ""
      : a.gestation_days ? `${codeOf(a)} runs ${a.gestation_days} days.`
      : `No gestation on file for ${codeOf(a)} — using ${gestFor(a)} for ${speciesOf(a)}. Change it and it's remembered.`;
    calc();
  };
  const calc = () => {
    if(!on.value || due.dataset.touched) return;
    due.value = addDays(on.value, Number(gest.value)||gestFor(cows.find(c=>c.id===dam.value)));
  };
  dam.onchange = loadGest; on.onchange = calc; gest.onchange = calc;
  due.oninput = () => due.dataset.touched = "1";
  loadGest();

  const shell = formShell(`AI — one ${wl("dam")}`, inner, async (f) => {
    if(!f.get("dam")) throw new Error(`Choose the ${wl("dam")}.`);
    let semenId = f.get("semen") || null, sireId = null;
    if(!semenId) throw new Error("Choose the straw from the register.");

    if(semenId === "__new"){
      const name = (f.get("nname")||"").trim();
      if(!name) throw new Error(`Name the ${wl("sire")} the straw is from.`);
      const { data, error } = await db.from("ai_semen").insert({
        sire_name: name, tank: f.get("ntank"), location: Number(f.get("nloc")),
        breed:(f.get("nbreed")||"").trim()||null, straw_code:(f.get("ncode")||"").trim()||null,
        supplier:(f.get("nsupplier")||"").trim()||null, tank:(f.get("ntank")||"").trim()||null,
        collected_on: f.get("ncollected")||null,
        straws_in: f.get("nstraws") ? Number(f.get("nstraws")) : null,
        created_by: S.me?.id || null
      }).select("id,sire_id").single();
      if(error) throw error;
      semenId = data.id; sireId = data.sire_id;
      // A new lot has to arrive before it can be drawn on, or the
      // ledger goes straight to minus one.
      const n = Number(f.get("nstraws")) || 1;
      await db.from("cryo_txn").insert({ ai_semen_id: semenId, kind:"received",
        qty: n, on_date: f.get("ncollected") || f.get("on") || today(),
        notes: "Registered while recording an AI" });
    } else {
      sireId = inStock.find(s => s.id===semenId)?.sire_id || null;
    }

    // sire_id is filled from the straw as well as ai_semen_id, so the
    // due list, family tree and animal timeline keep naming the bull
    // without any of them needing to know AI exists.
    const g = Number(f.get("gest")) || GEST_DEFAULT;
    const conf = f.get("conf");
    const { error } = await db.from("joining").upsert({
      dam_id:f.get("dam"), sire_id:sireId, method:"ai", ai_semen_id:semenId,
      season:(f.get("season")||"").trim(), cycle:f.get("cycle"),
      attempt:Number(f.get("attempt")||1),
      joined_on:f.get("on")||null, gestation_days:g, due_on:f.get("due")||null,
      confidence: conf === "" || conf == null ? null : Number(conf)/100,
      outcome:"unknown",
      notes:(f.get("notes")||"").trim()||null
    }, {onConflict:"dam_id,season,attempt"});
    if(error) throw error;

    const cow = cows.find(c => c.id===f.get("dam"));
    if(g !== gestFor(cow))
      await db.from("animal").update({gestation_days:g}).eq("id", cow.id);

    // The straw left the tank. Without this the joining records which
    // straw was used and the count never moves.
    const { error:e3 } = await db.from("cryo_txn").insert({
      ai_semen_id: semenId, kind: "used", qty: -1, on_date: f.get("on") || today(),
      female_id: cow.id, female_ref: cow.stock_code,
      confidence: conf === "" || conf == null ? null : Number(conf)/100,
      notes: (f.get("notes")||"").trim() || null
    });
    if(e3) throw new Error(`AI saved, but the straw wasn't taken off the count: ${e3.message}`);
    await loadRefs();

    const left = inStock.find(x => x.id===semenId);
    return `AI recorded for ${cow ? codeOf(cow) : ""}${
      left ? ` — ${Math.max(0, Number(left.straws_left) - 1)} straws left` : ""}.`;
  });
  if(inStock.length > 6)
    shell.insertBefore(cryoFilterBar(inStock, () => render(), true), shell.querySelector("form"));
  return shell;
}

// ─── bull out: one bull, one mob ────────────────────────────────
function joinNatural(){
  const sires = workingSires();
  if(!sires.length) return el(`<div class="empty"><b>No ${wl("sire")}s on the place</b>
    A ${wl("sire")} has to be alive here and classed as a ${wl("sire")} before he can go out
    with a mob. Set his class on his own screen.</div>`);
  if(!S.paddocks.length)
    return el(`<div class="empty"><b>No paddocks yet</b>
      A ${wl("sire")} goes out to a mob, so there needs to be a paddock to put him in.</div>`);

  const inner = el(`<div>
    <label><span>${w("sire")}</span><select name="sire" required>
      <option value="">Which ${wl("sire")}…</option>
      ${sires.map(a=>`<option value="${a.id}">${esc(codeOf(a))}${
        a.name?" · "+esc(a.name):""}${a.paddock_name?" — "+esc(a.paddock_name):""}</option>`).join("")}
    </select></label>
    <label><span>Out with</span><select name="paddock" required>
      <option value="">Choose a paddock…</option>
      ${S.paddocks.map(p=>`<option value="${p.id}"${S.selPk===p.id?" selected":""}>${
        esc(p.name)} — ${headIn(p.id)} head</option>`).join("")}
    </select></label>
    <div class="two">
      <label><span>${w("sire")} in</span><input type="date" name="on" value="${today()}" required></label>
      <label><span>${w("sire")} out</span><input type="date" name="out"></label>
    </div>
    ${joinCommon()}
    <label><span>Notes</span><input type="text" name="notes" placeholder="Applies to the whole mob"></label>
  </div>`);

  // The confirm list goes above the season block, right under the paddock.
  const listWrap = el(`<div></div>`);
  inner.querySelector('.two').after(listWrap);

  const q = s => inner.querySelector(s);
  const pk = q('[name=paddock]'), onDate = q('[name=on]');

  const fill = () => {
    listWrap.replaceChildren();
    const p = S.paddocks.find(x => x.id===pk.value);
    if(!p) return;
    const here    = S.animals.filter(a => isActive(a) && inSpecies(a) && a.paddock_id===p.id);
    const females = here.filter(a => a.sex==="female");
    const others  = here.filter(a => a.sex!=="female");

    listWrap.appendChild(el(`<h3 class="sec" style="padding-left:0">Who he's running with</h3>`));
    if(!females.length){
      listWrap.appendChild(el(`<div class="empty"><b>No females in ${esc(p.name)}</b>
        Either the ${wl("sire")} is in the wrong paddock or the stock haven't been moved yet.</div>`));
      return;
    }

    // Breeders are ticked; heifers and younger are not. Joining a
    // weaner by accident is the expensive mistake, so it takes a
    // deliberate tap rather than an untick you might not notice.
    const list = el(`<div class="mob"></div>`);
    for(const a of females){
      const on  = a.class==="breeder";
      const g   = gestFor(a);
      const row = el(`<label data-id="${a.id}" data-g="${g}">
        <input type="checkbox"${on?" checked":""}>
        ${tagHTML(codeOf(a), "sm", speciesOf(a))}
        <span class="sub">${esc(a.class||"unclassed")} · ${age(a.age_years)}</span>
        <input type="number" class="gd" value="${g}" min="250" max="310"
          inputmode="numeric" aria-label="Gestation days">
      </label>`);
      list.appendChild(row);
    }
    listWrap.appendChild(list);

    const chips = el(`<div class="chips" style="padding:8px 0 0"></div>`);
    const setAll = fn => list.querySelectorAll("label").forEach((l,i) =>
      l.querySelector("input[type=checkbox]").checked = fn(females[i]));
    for(const [label, fn] of [["All females", () => true],
                              ["Breeders only", a => a.class==="breeder"],
                              ["None", () => false]]){
      const b = el(`<button type="button" class="chip">${esc(label)}</button>`);
      b.onclick = () => setAll(fn);
      chips.appendChild(b);
    }
    listWrap.appendChild(chips);

    // Everything else standing in that paddock. Half the value of this
    // screen is noticing here that the steers never got shifted.
    if(others.length)
      listWrap.appendChild(el(`<div class="note">Also in ${esc(p.name)}:
        ${others.map(a => `${esc(codeOf(a))} (${esc(a.class||a.sex||"?")})`).join(", ")}.
        Not joined — check they're meant to be there.</div>`));
    listWrap.appendChild(el(`<p class="hint">Due dates are the earliest possible: ${wl("sire")} in
      plus each ${wl("dam")}'s own gestation. Change a number and it's remembered against her.
      Test results go on one at a time later, in the joining register.</p>`));
  };
  pk.onchange = fill; fill();

  return formShell(`${w("sire")} out to a mob`, inner, async (f) => {
    if(!f.get("sire"))    throw new Error(`Choose the ${wl("sire")}.`);
    if(!f.get("paddock")) throw new Error("Choose the paddock he went out to.");
    const picked = [...listWrap.querySelectorAll(".mob label")]
      .filter(l => l.querySelector("input[type=checkbox]").checked);
    if(!picked.length) throw new Error("Confirm which females he was joined to.");

    const season = (f.get("season")||"").trim(), onD = f.get("on")||null;
    const rows = picked.map(l => {
      const g = Number(l.querySelector(".gd").value) || GEST_DEFAULT;
      return {
        dam_id:l.dataset.id, sire_id:f.get("sire"), method:"natural",
        paddock_id:f.get("paddock"), season, cycle:f.get("cycle"),
        attempt:Number(f.get("attempt")||1),
        joined_on:onD, bull_out:f.get("out")||null,
        gestation_days:g, due_on: onD ? addDays(onD, g) : null,
        outcome:"unknown",
        notes:(f.get("notes")||"").trim()||null
      };
    });
    const { error } = await db.from("joining")
      .upsert(rows, {onConflict:"dam_id,season,attempt"});
    if(error) throw error;

    // A corrected gestation is about the cow, so it follows her.
    const moved = picked.filter(l =>
      (Number(l.querySelector(".gd").value)||GEST_DEFAULT) !== Number(l.dataset.g));
    await Promise.all(moved.map(l => db.from("animal")
      .update({gestation_days: Number(l.querySelector(".gd").value)}).eq("id", l.dataset.id)));

    const name = S.paddocks.find(p => p.id===f.get("paddock"))?.name || "the paddock";
    return `${rows.length} joined in ${name}${moved.length
      ? `, ${moved.length} gestation length${moved.length>1?"s":""} updated` : ""}.`;
  });
}

// ─── shed work ──────────────────────────────────────────────────
// Shearing, crutching, the summer clip and marking are one shape: a
// date, a mob, and a few facts about the job. Modelled like a
// treatment rather than given four screens.
const SHED_KIND = [
  ["shearing", "Shearing",  "Full clip off"],
  ["crutching","Crutching", "Around the britch"],
  ["clip",     "Summer clip","A short clip in the heat"],
  ["marking",  "Marking",   "Tails, rings, ear marks"]
];

function recShearing(){
  const inner = el(`<div>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Job</span><select name="kind">
      ${SHED_KIND.map(([k,t,sub]) => `<option value="${k}">${t} — ${sub}</option>`).join("")}
    </select></label>
    <label><span>Description</span><input type="text" name="desc"
      placeholder="Autumn shearing, lamb marking…"></label>
    <label><span>Contractor</span><input type="text" name="contractor" placeholder="Optional"></label>
    <div class="two">
      <label><span>Bales</span><input type="number" name="bales" step="0.5" min="0" inputmode="decimal"></label>
      <label><span>Micron</span><input type="number" name="micron" step="0.1" min="1" inputmode="decimal"></label>
    </div>
    <p class="hint" id="woolhint">Bales and micron only make sense for a clip — leave them
      blank for marking or crutching.</p>
    <label><span>Notes</span><input type="text" name="notes" placeholder="Optional"></label>
    <label><span>Which sheep</span></label></div>`);

  const pick = animalPicker(true, []);
  inner.appendChild(pick);
  const count = el(`<p class="hint">No sheep selected.</p>`);
  pick.addEventListener("pick", e => count.textContent =
    !e.detail ? "No sheep selected." : e.detail===1 ? "1 head selected." : `${e.detail} head selected.`);

  const chips = el(`<div class="chips" style="padding:8px 0 0"></div>`);
  const setAll = fn => pick.querySelectorAll(".pick").forEach((b,i) => {
    const want = fn(pick.list[i]);
    if(want !== pick.chosen.has(pick.list[i].id)) b.click();
  });
  for(const [label, fn] of [["Everything", () => true],
                            ["Ewes only", a => a.class==="breeder"],
                            ["Lambs only", a => a.class==="lamb"],
                            ["None", () => false]]){
    const b = el(`<button type="button" class="chip">${esc(label)}</button>`);
    b.onclick = () => setAll(fn);
    chips.appendChild(b);
  }
  inner.appendChild(chips);
  inner.appendChild(count);

  // Wool figures belong to a clip. Dimmed rather than removed, so it is
  // obvious they exist and why they are not offered.
  const kind = inner.querySelector('[name=kind]');
  const wool = [inner.querySelector('[name=bales]'), inner.querySelector('[name=micron]')];
  const tune = () => {
    const clip = kind.value === "shearing" || kind.value === "clip";
    wool.forEach(i => { i.disabled = !clip; i.parentElement.style.opacity = clip ? 1 : .45;
                        if(!clip) i.value = ""; });
    inner.querySelector("#woolhint").hidden = clip;
  };
  kind.onchange = tune; tune();

  return formShell("Record shed work", inner, async (f) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose the sheep the job was done on.");
    const { data, error } = await db.from("shearing").insert({
      shorn_on: f.get("on"), kind: f.get("kind"),
      description: (f.get("desc")||"").trim() || null,
      contractor: (f.get("contractor")||"").trim() || null,
      bales:  f.get("bales")  ? Number(f.get("bales"))  : null,
      micron: f.get("micron") ? Number(f.get("micron")) : null,
      notes: (f.get("notes")||"").trim() || null
    }).select("id").single();
    if(error) throw error;

    const { error:e2 } = await db.from("shearing_animal")
      .insert(ids.map(id => ({ shearing_id: data.id, animal_id: id })));
    if(e2) throw new Error(`The job saved but the sheep didn't attach: ${e2.message}`);

    const label = SHED_KIND.find(k => k[0]===f.get("kind"))?.[1] || "Shed work";
    return `${label} recorded for ${ids.length} head.`;
  });
}

// ─── the flasks ─────────────────────────────────────────────────
// Browsing the store is a job done standing at the tank in the cold
// with a phone: the question is always "which goblet, what colour" —
// so the shelf label leads and the pedigree comes second.
const CRYO_KIND = [
  ["used",      "Used",      "Thawed and put in"],
  ["received",  "Received",  "New straws in"],
  ["discarded", "Discarded", "Thrown out"],
  ["sent_out",  "Sent out",  "To an agent or another property"],
  ["returned",  "Returned",  "Come back from an agent"],
  ["stocktake", "Stocktake", "Correcting the count after a look"]
];

// Location, then marker, straw and size — the order you actually
// narrow it down at the tank. Options are drawn from the lots in front
// of you, so a filter never offers something that would empty the list.
function cryoFilter(lots){
  S.cryoF ||= {tank:"", loc:"", mark:"", straw:"", size:""};
  const F = S.cryoF;
  return lots.filter(l =>
    (!F.tank  || l.tank === F.tank) &&
    (!F.loc   || String(l.location) === F.loc) &&
    (!F.mark  || (l.mark_colour||"") === F.mark) &&
    (!F.straw || (l.straw_desc||"")  === F.straw) &&
    (!F.size  || (l.straw_size||"")  === F.size));
}

// withTank is for screens that have no tank control of their own. The
// store puts its tank chips at the top where they belong; the movement
// form has nowhere else to put them, and location 1 means two different
// canisters without one.
function cryoFilterBar(lots, onChange, withTank){
  S.cryoF ||= {tank:"", loc:"", mark:"", straw:"", size:""};
  const F = S.cryoF;
  const box = el(`<div></div>`);

  if(withTank){
    const tanks = [...new Set(lots.map(l => l.tank).filter(Boolean))].sort();
    if(tanks.length > 1){
      const row = el(`<div class="chips" style="padding:8px 14px 0"></div>`);
      for(const [v, t] of [["", "All tanks"], ...tanks.map(x => [x, "Tank " + x])]){
        const b = el(`<button type="button" class="chip" aria-pressed="${F.tank===v}">${esc(t)}</button>`);
        b.onclick = () => { F.tank = v; F.loc = ""; onChange(); };
        row.appendChild(b);
      }
      box.appendChild(row);
    }
  }

  const inTank = F.tank ? lots.filter(l => l.tank === F.tank) : lots;
  const locs = [...new Set(inTank.map(l => l.location).filter(x => x != null))]
    .map(Number).sort((a,b) => a-b);
  const chips = el(`<div class="chips" style="padding:8px 14px 0"></div>`);
  for(const [v, t] of [["", "All"], ...locs.map(x => [String(x), "Loc " + x])]){
    const b = el(`<button type="button" class="chip" aria-pressed="${F.loc===v}">${t}</button>`);
    b.onclick = () => { F.loc = v; onChange(); };
    chips.appendChild(b);
  }
  box.appendChild(chips);

  const row = el(`<div class="filt"></div>`);
  for(const [k, field, blank] of [["mark","mark_colour","Any mark"],
                                  ["straw","straw_desc","Any straw"],
                                  ["size","straw_size","Any size"]]){
    // Options come from what survives the other filters, so the
    // choices always lead somewhere.
    const pool = inTank.filter(l =>
      (!F.loc || String(l.location) === F.loc) &&
      (k==="mark"  || !F.mark  || (l.mark_colour||"") === F.mark) &&
      (k==="straw" || !F.straw || (l.straw_desc||"")  === F.straw) &&
      (k==="size"  || !F.size  || (l.straw_size||"")  === F.size));
    const opts = [...new Set(pool.map(l => l[field]).filter(Boolean))].sort();
    if(opts.length < 2 && !F[k]) continue;
    const sel = el(`<select><option value="">${blank}</option>${
      opts.map(o => `<option value="${esc(o)}"${F[k]===o?" selected":""}>${esc(o)}</option>`).join("")
    }</select>`);
    sel.onchange = () => { F[k] = sel.value; onChange(); };
    row.appendChild(sel);
  }
  if(row.children.length) box.appendChild(row);

  if(F.tank || F.loc || F.mark || F.straw || F.size){
    const clr = el(`<div class="chips" style="padding:6px 14px 0">
      <button type="button" class="chip">Clear filters</button></div>`);
    clr.querySelector("button").onclick = () => {
      S.cryoF = {tank:"", loc:"", mark:"", straw:"", size:""}; onChange();
    };
    box.appendChild(clr);
  }
  return box;
}

// A marker written as a colour is shown as that colour. Anything the
// sheet doesn't name a colour for gets a hatched swatch rather than a
// guess — 'No Mrk' is a real answer and should look different from an
// unrecorded one.
const MARK_HEX = {
  green:"#2E7D32", yellow:"#F2C230", blue:"#1F63C4", red:"#C0392B",
  orange:"#E07B22", pink:"#E48AAE", purple:"#6B4BA8", peach:"#F2B58C",
  white:"#FFFFFF", black:"#1A1A1A", grey:"#8E8E8E", gray:"#8E8E8E", clear:"#EDEDED"
};
function markSwatch(mark){
  const t = (mark || "").toLowerCase();
  if(!mark || /no\s*m[kr]/.test(t)) return `<span class="sw nomk" title="${
    esc(mark || "not recorded")}"></span>`;
  const hit = Object.keys(MARK_HEX).find(c => t.includes(c));
  return hit
    ? `<span class="sw" style="background:${MARK_HEX[hit]}" title="${esc(mark)}"></span>`
    : `<span class="sw nomk" title="${esc(mark)}"></span>`;
}

// Six canisters, drawn as six canisters. Mini and maxi are different
// sizes of straw, so the name is set at different sizes — you can read
// the shape of a tank without reading a single word.
function cryoSummary(lots, tank){
  const units = Math.round(lots.reduce((n, l) => n + l.left, 0));
  const cans = [1,2,3,4,5,6].map(loc => {
    const here = lots.filter(l => Number(l.location) === loc)
                     .sort((a,b) => b.left - a.left);
    const sum = Math.round(here.reduce((n,l) => n + l.left, 0));
    return `<div class="can"><h4><span>Loc ${loc}</span><span>${
      here.length ? sum : "—"}</span></h4>${
      here.length
        ? `<ul>${here.map(l => `<li>${markSwatch(l.mark_colour)}
            <span class="nm sz-${esc(l.straw_size || "mid")}" title="${
              esc([l.label, l.mark_colour, l.straw_desc, l.straw_size]
                  .filter(Boolean).join(" · "))}">${esc(l.label || "—")}</span>
            <span class="ct">${l.left % 1 ? l.left.toFixed(1) : l.left}</span></li>`).join("")}</ul>`
        : `<div class="none">Empty</div>`}</div>`;
  }).join("");
  return el(`<details class="sum" style="padding-bottom:8px">
    <summary>Tank ${esc(tank)} contents — ${lots.length} lots, ${units} units</summary>
    <div class="cans">${cans}</div>
    <p class="hint" style="padding:2px 14px 8px">Swatch is the cane marker.
      Small text is a mini straw, large is a maxi. Hatched means no marker recorded.</p>
  </details>`);
}

function cryoLots(){
  return [
    ...(S.refs.semen  || []).map(x => ({...x, kind:"semen",
        label:x.sire_label || x.sire_name, left:Number(x.straws_left||0)})),
    ...(S.refs.embryo || []).map(x => ({...x, kind:"embryo",
        label:x.pairing, left:Number(x.units_left||0)}))
  ];
}

function viewCryo(){
  const wrap = el(`<div></div>`);
  const lots = cryoLots();
  if(!lots.length) return el(`<div class="empty"><b>Nothing in the flasks</b></div>`);

  // Empty string means both. Tank 1 then tank 2, the order they are
  // written on the register.
  const tanks = [...new Set(lots.map(l => l.tank).filter(Boolean))].sort();
  S.cryoF ||= {tank:"", loc:"", mark:"", straw:"", size:""};
  if(S.cryoF.tank && !tanks.includes(S.cryoF.tank)) S.cryoF.tank = "";

  const chips = el(`<div class="chips" style="padding-top:10px"></div>`);
  for(const [v, t] of [["", "All"], ...tanks.map(x => [x, "Tank " + x])]){
    const b = el(`<button class="chip" aria-pressed="${S.cryoF.tank===v}">${esc(t)}</button>`);
    // Changing tank clears the rest: a marker in one tank may not exist
    // in the other, and a filter that empties the screen looks broken.
    b.onclick = () => { S.cryoF = {tank:v, loc:"", mark:"", straw:"", size:""}; render(); };
    chips.appendChild(b);
  }
  wrap.appendChild(chips);

  const show = S.cryoF.tank ? [S.cryoF.tank] : tanks;
  for(const t of show) wrap.appendChild(cryoSummary(lots.filter(l => l.tank === t), t));

  const pool  = lots.filter(l => show.includes(l.tank));
  wrap.appendChild(cryoFilterBar(pool, () => render()));
  const shown = cryoFilter(pool);
  wrap.appendChild(el(`<p class="hint" style="padding:6px 14px 0">${shown.length} of ${
    pool.length} lots · ${Math.round(shown.reduce((n,l)=>n+l.left,0))} units</p>`));
  if(!shown.length)
    wrap.appendChild(el(`<div class="empty">Nothing matches those filters.</div>`));

  const locs = S.cryoF.loc ? [Number(S.cryoF.loc)] : [1,2,3,4,5,6];
  for(const t of show){
    const inTank = pool.filter(l => l.tank === t);
    for(const loc of locs){
      const here = shown.filter(l => l.tank === t && Number(l.location) === loc);
      // The tank is only named in the heading when both are on screen;
      // with one selected it would be repeated six times for nothing.
      const head = show.length > 1 ? `Tank ${esc(t)} · Location ${loc}` : `Location ${loc}`;
      wrap.appendChild(el(`<h3 class="sec">${head}${here.length
        ? ` — ${Math.round(here.reduce((n,l)=>n+l.left,0))} units` : ""}</h3>`));
      if(!here.length){
        // With a filter on, an empty location means "nothing matching
        // here", not "nothing here" — say which of the two it is.
        const anyHere = inTank.some(l => Number(l.location) === loc);
        wrap.appendChild(el(`<p class="hint" style="padding:0 14px 6px">${
          anyHere ? "Nothing matching." : "Empty."}</p>`));
        continue;
      }
      const ul = el(`<ul class="rows"></ul>`);
      for(const l of here.sort((a,b) => b.left - a.left)){
        // A count of zero is worth showing: the lot is still on the
        // register and knowing it is empty saves a look.
        const li = el(`<li><button class="row">
          ${markSwatch(l.mark_colour)}
          <span class="meta">
          <span class="nm sz-${esc(l.straw_size || "mid")}">${esc(l.label || "—")}</span>
          <span class="sub">${esc(l.shelf_label || l.marking || (l.kind==="embryo"?"embryo":"—"))}</span>
          </span><span class="rt" style="${l.left ? "" : "opacity:.4"}">
          <b>${l.left % 1 ? l.left.toFixed(1) : l.left}</b></span></button></li>`);
        li.querySelector("button").onclick = () => { S.cryoLot = l; S.view = "rec:cryolot"; render(); };
        ul.appendChild(li);
      }
      wrap.appendChild(ul);
    }
  }
  const back = el(`<div class="pad"><button class="btn ghost">Back</button></div>`);
  back.querySelector("button").onclick = () => { S.view = "record"; render(); };
  wrap.appendChild(back);
  return wrap;
}

async function viewCryoLot(){
  const l = S.cryoLot;
  if(!l){ S.view = "rec:cryo"; return el(`<div></div>`); }
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<div class="pad"><h3 class="sec" style="padding-left:0;
    display:flex;align-items:center;gap:8px">${markSwatch(l.mark_colour)}<span
    class="sz-${esc(l.straw_size || "mid")}" style="letter-spacing:0;text-transform:none">${
    esc(l.label || "—")}</span></h3>
    <p class="hint">Tank ${esc(l.tank||"—")} · location ${esc(l.location||"—")}${
      l.shelf_label ? " · " + esc(l.shelf_label) : ""}</p>
    <p class="hint"><b style="font-size:20px;color:var(--ink)">${
      l.left % 1 ? l.left.toFixed(1) : l.left}</b> ${l.kind==="embryo"?"units":"straws"} on hand${
      l.straws_in||l.units_in ? ` · ${l.straws_in||l.units_in} delivered` : ""}</p>
    ${l.notes ? `<p class="hint">${esc(l.notes)}</p>` : ""}</div>`));

  const col = l.kind === "embryo" ? "embryo_id" : "ai_semen_id";
  const { data, error } = await db.from("cryo_txn")
    .select("on_date,kind,qty,female_ref,outcome,counterparty,notes,confidence")
    .eq(col, l.id).order("on_date", {ascending:false});
  if(error) wrap.appendChild(el(`<div class="msg err">${esc(error.message)}</div>`));
  else if(!data.length) wrap.appendChild(el(`<div class="empty">No movements recorded.</div>`));
  else {
    wrap.appendChild(el(`<h3 class="sec">Movements</h3>`));
    const ul = el(`<ul class="rows"></ul>`);
    for(const r of data){
      const q = Number(r.qty);
      const who = r.female_ref || r.counterparty || "";
      const sub = [CRYO_KIND.find(k=>k[0]===r.kind)?.[1] || r.kind, who,
                   r.outcome, r.confidence!=null ? Math.round(r.confidence*100)+"%" : null,
                   r.notes].filter(Boolean).join(" · ");
      ul.appendChild(el(`<li><span class="row" style="cursor:default"><span class="meta">
        <span class="nm">${fmt(r.on_date)}</span>
        <span class="sub">${esc(sub.slice(0,90))}</span></span>
        <span class="rt" style="color:${q<0?"var(--danger)":"var(--accent)"}">
        ${q>0?"+":""}${q % 1 ? q.toFixed(1) : q}</span></span></li>`));
    }
    wrap.appendChild(ul);
  }
  const b = el(`<div class="pad"><button class="btn">Record a movement</button>
    <button class="btn ghost">Back to the tank</button></div>`);
  b.querySelector(".btn").onclick = () => { S.view = "rec:cryomove"; render(); };
  b.querySelector(".ghost").onclick = () => { S.cryoLot = null; S.view = "rec:cryo"; render(); };
  wrap.appendChild(b);
  return wrap;
}

function recCryoMove(){
  const all = cryoLots();
  if(!all.length) return el(`<div class="empty"><b>Nothing in the flasks</b></div>`);
  const sel = S.cryoLot?.id;
  // Fifty lots in one dropdown is a scroll. Narrow it the same way as
  // the store, with the same state, so switching between the two keeps
  // your place.
  const lots = cryoFilter(all);

  const inner = el(`<div>
    <label><span>Lot</span><select name="lot" required>
      <option value="">Which straws…</option>
      ${lots.map(l => `<option value="${l.kind}:${l.id}"${sel===l.id?" selected":""}>${
        esc(l.label||"—")}${l.tank?` — tank ${esc(l.tank)} loc ${esc(l.location||"?")}`:""} · ${
        l.left % 1 ? l.left.toFixed(1) : l.left} left</option>`).join("")}
    </select></label>
    <label><span>What happened</span><select name="kind">
      ${CRYO_KIND.map(([k,t,sub]) => `<option value="${k}">${t} — ${sub}</option>`).join("")}
    </select></label>
    <div class="two">
      <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
      <label><span>How many</span><input type="number" name="qty" step="0.1" min="0.1"
        value="1" inputmode="decimal" required></label>
    </div>
    <p class="hint" id="ck">Half straws happen — a short one or a plug. Put in what actually went.</p>
    <label><span>Cow</span><input type="text" name="female"
      placeholder="Her tag, as you'd write it"></label>
    <label><span>Went to</span><input type="text" name="party"
      placeholder="Nu-Genes, Agri-gene…"></label>
    <div class="two">
      <label><span>Result</span><select name="outcome">
        <option value="">Not known yet</option>
        <option value="held">Held</option>
        <option value="empty">Empty</option>
      </select></label>
      <label><span>Confidence %</span><input type="number" name="conf" min="0" max="100"
        step="5" inputmode="numeric" placeholder="—"></label>
    </div>
    <label><span>Notes</span><input type="text" name="notes" placeholder="Optional"></label>
  </div>`);

  // The fields that matter depend on what happened. A discard has no
  // cow; a delivery has no result.
  const kind = inner.querySelector('[name=kind]');
  const show = (name, on) => {
    const f = inner.querySelector(`[name=${name}]`);
    f.parentElement.hidden = !on;
    if(!on) f.value = "";
  };
  const tune = () => {
    const k = kind.value;
    show("female", k === "used");
    show("party", k === "sent_out" || k === "returned");
    show("outcome", k === "used");
    show("conf", k === "used");
    inner.querySelector("#ck").textContent = k === "stocktake"
      ? "A stocktake sets the count to what you actually counted."
      : "Half straws happen — a short one or a plug. Put in what actually went.";
    inner.querySelector('[name=qty]').min = k === "stocktake" ? "0" : "0.1";
  };
  kind.onchange = tune; tune();

  const shell = formShell("Record a movement", inner, async (f) => {
    const [kindOf, id] = (f.get("lot") || "").split(":");
    if(!id) throw new Error("Choose the lot.");
    const lot = all.find(l => l.id === id);
    const k = f.get("kind");
    let qty = Number(f.get("qty"));
    if(!qty) throw new Error("How many?");

    // The ledger stores the sign; the form only ever asks for a count.
    if(k === "stocktake") qty = Number(qty) - lot.left;
    else if(["used","discarded","sent_out"].includes(k)) qty = -qty;
    if(k === "stocktake" && !qty)
      throw new Error(`The count already reads ${lot.left}. Nothing to correct.`);

    const ref = (f.get("female")||"").trim() || null;
    const conf = f.get("conf");
    const { error } = await db.from("cryo_txn").insert({
      [kindOf === "embryo" ? "embryo_id" : "ai_semen_id"]: id,
      kind: k, qty, on_date: f.get("on"),
      female_ref: ref, outcome: f.get("outcome") || null,
      counterparty: (f.get("party")||"").trim() || null,
      confidence: conf === "" || conf == null ? null : Number(conf)/100,
      notes: (f.get("notes")||"").trim() || null
    });
    if(error) throw error;
    await loadRefs();
    return `${CRYO_KIND.find(c=>c[0]===k)[1]} recorded for ${lot.label}.`;
  });
  shell.insertBefore(cryoFilterBar(all, () => render(), true), shell.querySelector("form"));
  return shell;
}

function recCalving(){
  const young = wl("young");
  // Sheep are run as mobs: what gets seen is a lamb in a paddock, not
  // a ewe with a lamb. Offer the paddock as the thing to record
  // against whenever there are sheep, and start there for a sheep
  // scope. Cattle keep the cow.
  const byPaddock = hasSpecies("sheep") && S.species !== "cattle";
  let mode = S.species === "sheep" ? "paddock" : "dam";
  const inner = el(`<div></div>`);

  // ── the dam known ──
  const damBox = el(`<div>
    <label><span>Date ${wl("birthed")}</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Outcome</span><select name="outcome">
      <option value="live">Live ${young}</option><option value="stillborn">Stillborn</option>
      <option value="died">Died soon after</option></select></label>
    <label><span>Sex</span><select name="sex">
      <option value="unknown">Not checked yet</option>
      <option value="female">Female</option><option value="male">Male</option></select></label>
    <label style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <input type="checkbox" name="assisted" style="width:22px;height:22px;min-height:0;flex:none">
      <span style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--ink)">Assisted</span>
    </label>
    <label><span>Notes</span><textarea name="notes" placeholder="unassisted, quick"></textarea></label>
    <div class="note">The ${young} goes into the herd straight away, under this year's letter
      with no number, in the same paddock as its ${wl("dam")}. Open it from the herd to give
      it a tag and a name.</div>
    <label><span>${w("dam")}</span></label></div>`);
  const pick = animalPicker(false, S.sel?[S.sel]:[]);
  damBox.appendChild(pick);

  // ── seen in a paddock ──
  const pkBox = el(`<div>
    <label><span>Date seen</span><input type="date" name="pk_on" value="${today()}" required></label>
    ${S.species==="all" ? `<label><span>Species</span><select name="pk_species">
      <option value="sheep">Sheep</option><option value="cattle">Cattle</option></select></label>` : ""}
    <label><span>Paddock</span><select name="pk_paddock" required>
      <option value="">Choose a paddock…</option>
      ${S.paddocks.map(p => `<option value="${p.id}"${S.selPk===p.id?" selected":""}>${
        esc(p.name)} — ${headIn(p.id)} head</option>`).join("")}
    </select></label>
    <label><span>${w("sire")}</span><select name="pk_sire"><option value="">Not known</option></select></label>
    <div class="two">
      <label><span>How many</span><input type="number" name="pk_count" value="1" min="1" max="50" inputmode="numeric" required></label>
      <label><span>Sex</span><select name="pk_sex"><option value="unknown">Not checked yet</option>
        <option value="female">Female</option><option value="male">Male</option></select></label>
    </div>
    <label><span>Outcome</span><select name="pk_outcome"><option value="live">Alive</option>
      <option value="died">Found dead, or died soon after</option></select></label>
    <label><span>Notes</span><textarea name="pk_notes" placeholder="Twins at the trough"></textarea></label>
    <div class="note">Recorded against the paddock and the ${wl("sire")}, since the ${wl("dam")}
      isn't known. Each ${young} goes into the herd under this year's letter with no number, in
      this paddock. The numbers go on at marking: Record → Manage → Tag the drop.</div>
  </div>`);

  // The ram that was out with this mob is the likely sire: the natural
  // joinings name a paddock, so the ones due around this date in this
  // paddock come first, then rams standing in it now, then the rest.
  let joinings = [];
  const sireSel = pkBox.querySelector("[name=pk_sire]");
  const pkSel   = pkBox.querySelector("[name=pk_paddock]");
  const spOf    = () => S.species === "all" ? (pkBox.querySelector("[name=pk_species]")?.value || "sheep") : S.species;
  const fillSires = () => {
    const sp = spOf(), pkId = pkSel.value, on = pkBox.querySelector("[name=pk_on]").value;
    const near = d => on && d && Math.abs((new Date(d) - new Date(on))/864e5) <= 60;
    const joined = new Set(joinings.filter(j => j.paddock_id === pkId && near(j.due_on)).map(j => j.sire_id));
    const males = S.animals.filter(a => speciesOf(a) === sp && a.sex === "male" && (isActive(a) || joined.has(a.id)));
    const here  = new Set(males.filter(a => a.paddock_id === pkId).map(a => a.id));
    const A = males.filter(a => joined.has(a.id));
    const B = males.filter(a => !joined.has(a.id) && here.has(a.id));
    const C = males.filter(a => !joined.has(a.id) && !here.has(a.id));
    const grp = (label, list) => list.length ? `<optgroup label="${label}">${list.map(a =>
      `<option value="${a.id}">${esc(codeOf(a))}${a.name ? " · " + esc(a.name) : ""}</option>`).join("")}</optgroup>` : "";
    sireSel.innerHTML = `<option value="">Not known</option>` + grp("Out with this mob", A)
      + grp("In the paddock now", B) + grp(`Other ${wl("sire", sp)}s`, C);
    sireSel.value = (A[0] || B[0])?.id || "";
  };
  pkSel.onchange = fillSires;
  pkBox.querySelector("[name=pk_on]").onchange = fillSires;
  const spSel = pkBox.querySelector("[name=pk_species]");
  if(spSel) spSel.onchange = fillSires;
  db.from("joining").select("sire_id,paddock_id,due_on").eq("method","natural")
    .not("paddock_id","is",null).then(({data}) => { joinings = data || []; fillSires(); });
  fillSires();

  // A hidden required field still blocks the submit, so the box that
  // isn't in use is disabled, which also keeps it out of the FormData.
  let seg = null;
  const setMode = m => {
    mode = m;
    for(const [box, on] of [[damBox, m==="dam"], [pkBox, m==="paddock"]]){
      box.hidden = !on;
      box.querySelectorAll("input,select,textarea,button").forEach(x => x.disabled = !on);
    }
    if(seg) seg.querySelectorAll("button").forEach((b,i) => b.setAttribute("aria-pressed", (i===1) === (m==="paddock")));
  };
  if(byPaddock){
    seg = el(`<div class="seg">
      <button type="button">${w("dam")} known</button>
      <button type="button">Seen in a paddock</button></div>`);
    seg.querySelectorAll("button").forEach((b,i) => b.onclick = () => setMode(i ? "paddock" : "dam"));
    inner.appendChild(seg);
  }
  inner.appendChild(damBox);
  inner.appendChild(pkBox);
  setMode(byPaddock ? mode : "dam");

  return formShell(`Record a ${wl("birth")}`, inner, async (f) => {
    if(mode === "paddock"){
      const pkId = f.get("pk_paddock");
      if(!pkId) throw new Error("Choose the paddock.");
      const { data:ids, error } = await db.rpc("record_drop", {
        p_paddock_id: pkId, p_on: f.get("pk_on"), p_species: spOf(),
        p_count: Number(f.get("pk_count")||1), p_sire_id: f.get("pk_sire")||null,
        p_sex: f.get("pk_sex")||"unknown", p_outcome: f.get("pk_outcome"),
        p_notes: f.get("pk_notes")||null
      });
      if(error) throw error;
      const pkName = S.paddocks.find(p => p.id === pkId)?.name || "the paddock";
      if((ids||[]).length === 1){
        S.sel = ids[0];
        return `Saved. The ${wl("young", spOf())} is in the herd, in ${pkName}.`;
      }
      S.sel = null;
      return `Saved. ${ids.length} ${wl("young", spOf())}s are in the herd under ${pkName}. Numbers go on at marking: Manage → Tag the drop.`;
    }
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error(`Choose the ${wl("dam")} that ${wl("birthed")}.`);
    // One call, one transaction: the calving, the calf, its status and
    // its paddock all land or none do. See record_calving() in
    // migration 43.
    const { data:calfId, error } = await db.rpc("record_calving", {
      p_dam_id: ids[0], p_calved_on: f.get("on"), p_outcome: f.get("outcome"),
      p_assisted: f.get("assisted")==="on", p_notes: f.get("notes")||null,
      p_sex: f.get("sex")||"unknown"
    });
    if(error) throw error;
    if(calfId){
      // Land on the calf's card, where the tag, name and sex get set.
      S.sel = calfId;
      return `${w("birth")} saved. The ${young} is in the herd — give it a tag when you have one.`;
    }
    return `${w("birth")} saved.`;
  });
}

function recSell(){
  const alive = S.animals.filter(isActive);
  const inner = el(`<div>
    <label><span>Date leaving</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Going to</span><select name="kind" required>
      <option value="saleyard">Saleyard</option><option value="abattoir">Abattoir — direct</option>
      <option value="property">Another property</option><option value="agent">Agent</option>
      <option value="other">Other</option></select></label>
    <label><span>Where</span><input type="text" name="dest" placeholder="Pakenham saleyards" required></label>
    <label><span>Destination PIC</span><input type="text" name="destpic" placeholder="If known" autocapitalize="characters"></label>
    <label><span>Buyer or agent</span><input type="text" name="party" placeholder="Optional"></label>

    <h3 class="sec" style="padding-left:0">Paperwork</h3>
    <label><span>NVD from</span><select name="nvdkind">
      <option value="book">Manual book</option><option value="envd">eNVD — online</option>
    </select></label>
    <label><span>NVD serial</span><input type="text" name="nvd" placeholder="Serial or eNVD number" autocapitalize="characters"></label>
    <label><span>Waybill number</span><input type="text" name="waybill" placeholder="If separate"></label>
    <div class="two">
      <label><span>Carrier</span><input type="text" name="carrier"></label>
      <label><span>Truck rego</span><input type="text" name="rego" autocapitalize="characters"></label>
    </div>

    <h3 class="sec" style="padding-left:0">Which animals</h3>
  </div>`);

  const pick = animalPicker(true, S.sel && alive.some(a=>a.id===S.sel) ? [S.sel] : []);
  const setAll = (ids,on) => {
    pick.querySelectorAll(".pick").forEach((b,i) => {
      const a = pick.list[i]; if(!ids.includes(a.id)) return;
      on ? pick.chosen.add(a.id) : pick.chosen.delete(a.id);
      b.setAttribute("aria-pressed", on);
    });
    pick.dispatchEvent(new CustomEvent("pick",{detail:pick.chosen.size}));
  };
  const quick = el(`<div class="chips" style="padding:8px 0 2px"></div>`);
  const groups = [["Harvest", () => S.animals.filter(a=>isActive(a)&&a.class==="harvest").map(a=>a.id)],
                  ["Yearlings", () => S.animals.filter(a=>isActive(a)&&a.class==="yearling").map(a=>a.id)],
                  ["None", () => []]];
  for(const p of S.paddocks.filter(p=>headIn(p.id)))
    groups.splice(2,0,[`All in ${p.name}`, () => S.animals.filter(a=>a.paddock_id===p.id).map(a=>a.id)]);
  for(const [label,fn] of groups){
    const b = el(`<button type="button" class="chip">${esc(label)}</button>`);
    b.onclick = () => { setAll(S.animals.map(a=>a.id), false); if(label!=="None") setAll(fn(), true); };
    quick.appendChild(b);
  }
  inner.appendChild(quick);
  inner.appendChild(pick);

  const status = el(`<p class="hint">No animals selected.</p>`);
  inner.appendChild(status);
  const warn = el(`<div class="msg err" hidden></div>`);
  inner.appendChild(warn);

  // The NVD asks whether anything is inside a withholding period.
  // The treatment records already know, so check as they pick.
  let clearance = [];
  db.from("v_animal_clearance").select("*").then(({data}) => { clearance = data||[]; check(); });
  function check(){
    const ids = [...pick.chosen];
    status.textContent = ids.length===1 ? "1 head selected." : `${ids.length} head selected.`;
    const on = inner.querySelector('[name=on]').value || today();
    const bad = clearance.filter(c => ids.includes(c.animal_id) && c.clear_domestic && c.clear_domestic > on);
    const esi = clearance.filter(c => ids.includes(c.animal_id) && c.clear_export && c.clear_export > on);
    if(bad.length){
      warn.hidden = false;
      warn.innerHTML = `<b>Inside a withholding period:</b> ${
        bad.map(b=>esc(codeOf(b))+" until "+fmt(b.clear_domestic)).join(", ")}.
        These can't go for slaughter yet.`;
    } else if(esi.length){
      warn.hidden = false;
      warn.className = "msg";
      warn.style.background = "#FCF3E3"; warn.style.color = "#8F5A0C";
      warn.innerHTML = `<b>Inside the export slaughter interval:</b> ${
        esi.map(b=>esc(codeOf(b))+" until "+fmt(b.clear_export)).join(", ")}.
        Fine domestically, not for export.`;
    } else { warn.hidden = true; }
  }
  pick.addEventListener("pick", check);
  inner.querySelector('[name=on]').addEventListener("change", check);

  inner.appendChild(el(`<div class="note">The NVD declarations are pre-filled from your records
    on the next screen — check them before you sign.</div>`));

  return formShell("Consign stock", inner, async (f) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose the animals going.");
    if(!f.get("dest")) throw new Error("Say where they're going.");

    const { data:c, error } = await db.from("consignment").insert({
      direction:"out", consigned_on:f.get("on"),
      destination_kind:f.get("kind"), destination:f.get("dest").trim(),
      destination_pic:(f.get("destpic")||"").trim().toUpperCase()||null,
      counterparty:(f.get("party")||"").trim()||null,
      nvd_kind:f.get("nvdkind"),
      nvd_serial:(f.get("nvd")||"").trim().toUpperCase()||null,
      waybill_no:(f.get("waybill")||"").trim()||null,
      carrier:(f.get("carrier")||"").trim()||null,
      vehicle_rego:(f.get("rego")||"").trim().toUpperCase()||null,
      q_ram_fed:false, q_hgp_treated:false,
      q_within_whp: clearance.some(c2 => ids.includes(c2.animal_id)
                      && c2.clear_domestic && c2.clear_domestic > f.get("on")),
      declared_by: S.me?.display_name || null, declared_on: f.get("on")
    }).select("id").single();
    if(error) throw new Error(error.code==="23505"
      ? "That NVD serial has already been used on another consignment." : error.message);

    const { error:e2 } = await db.rpc("consign_animals", {
      p_consignment: c.id, p_animal_ids: ids, p_override_whp: false });
    if(e2){
      await db.from("consignment").delete().eq("id", c.id);
      throw new Error(e2.message.replace("Still inside a withholding period:",
        "Can't consign — still inside a withholding period:"));
    }
    return `${ids.length} head consigned to ${f.get("dest")}.`;
  });
}

function recStore(){

  wrap.appendChild(back);
  return wrap;
}

function recStockAdj(){
  const f = S.feeds.find(x => x.id===S.selFeed)
           || S.feedsDone.find(x => x.id===S.selFeed);
  if(!f) return el(`<div class="empty">Feed not found.</div>`);

  const inner = el(`<div>
    <div class="note"><b>${esc(f.feedstuff)}</b><br>
      Came in: ${f.quantity??"—"} ${esc(f.unit||"")} · fed out: ${f.used||0} ·
      adjusted: ${f.adjusted||0}<br>
      <b>On hand: ${f.remaining??"—"} ${esc(f.unit||"")}</b></div>
    <label><span>What happened</span><select name="reason">
      <option>Recount</option><option>Weather damage</option><option>Spoiled</option>
      <option>More delivered</option><option>Sold or given away</option><option>Other</option>
    </select></label>
    <label><span>Counted / changed to</span>
      <input type="number" name="actual" step="0.1" min="0" inputmode="decimal"
             placeholder="${f.remaining??""}"></label>
    <p class="hint">Put in what's actually there now. The difference is recorded as the adjustment,
      so the original load quantity stays untouched.</p>
    <label><span>Note</span><input type="text" name="notes" placeholder="Optional"></label>
    <button type="button" class="btn ghost" id="rundry">The feeder ran dry — take them off</button>
    ${f.exhausted_on ? `<p class="hint">Store marked empty ${fmt(f.exhausted_on)}.</p>`
      : `<button type="button" class="btn ghost" id="usedup">Store is empty — nothing left to feed out</button>`}
    <p class="hint">Two different days. The store empties when the last of it leaves the silo;
      the mob comes off when the feeder is actually bare. Only the second one stops the
      days-on-feed count, and only you can see it.</p>
  </div>`);

  const usedupBtn = inner.querySelector("#usedup");
  if(usedupBtn) usedupBtn.onclick = async () => {
    if(!confirm(`Mark ${f.feedstuff} as finished? It comes off the feed-out list.\n\n`
      + `Anything still on it stays on feed until you say the feeder ran dry.`)) return;
    await db.from("feed_source").update({exhausted_on: today()}).eq("id", f.id);
    await loadPaddocks(); S.view="rec:store"; render();
  };

  inner.querySelector("#rundry").onclick = async () => {
    const on = prompt("What day did the feeder run out?", today());
    if(!on) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(on)){ alert("Use the form 2026-08-18."); return; }
    const { data, error } = await db.rpc("feed_run_end", {p_source:f.id, p_on:on});
    if(error){ alert(error.message); return; }
    await Promise.all([loadPaddocks(), loadHerd()]);
    S.view="rec:store"; render();
    alert(`${data} feeding run${data===1?"":"s"} closed on ${on}. Days on feed stop there.`);
  };

  return formShell("Adjust stock", inner, async (fd) => {
    const actual = fd.get("actual");
    if(actual==="") throw new Error("Put in the count.");
    if(f.remaining==null) throw new Error("This feed has no starting quantity to adjust against.");
    const delta = Math.round((Number(actual) - Number(f.remaining)) * 100) / 100;
    if(!delta) throw new Error("That's the same as the current figure — nothing to record.");
    const { error } = await db.from("feed_adjustment").insert({
      feed_source_id: f.id, qty_delta: delta,
      reason: fd.get("reason"), notes: (fd.get("notes")||"").trim()||null
    });
    if(error) throw error;
    S.view = "rec:store";
    return `${delta>0?"+":""}${delta} ${f.unit||""} recorded.`;
  });
}

// ── spraying ────────────────────────────────────────────────────
// LPA 3B. Recorded against a paddock, never against animals — the
// withholding period here governs grazing, and the paddock is what
// `move_animals` checks before it lets stock in.
//
// The first product is part of this form rather than a second screen:
// a pass with nothing in the tank is not a record, and the batch
// number is only legible while you are standing next to the drum.
function sprayProductBlock(first){
  return el(`<div class="sprayprod" style="border:1px solid var(--rule);border-radius:11px;
      padding:2px 12px 12px;margin-top:8px">
    <label><span>Product</span><input type="text" name="p_name"
      placeholder="Nufarm MCPA Amine 750" ${first?"required":""}></label>
    <div class="two">

      <label><span>Batch number</span><input type="text" name="p_batch" placeholder="Off the drum"></label>
    </div>
    <div class="two">
      <label><span>Graze WHP, days</span><input type="number" name="p_graze" min="0"
        inputmode="numeric" placeholder="7"></label>
      <label><span>Cut WHP, days</span><input type="number" name="p_cut" min="0"
        inputmode="numeric" placeholder="Optional"></label>
    </div>
    <label><span>ESI, days</span><input type="number" name="p_esi" min="0"
      inputmode="numeric" placeholder="Only if the label carries one"></label>
    ${first ? `<p class="hint">The grazing withholding period is what keeps stock out of the

function recSpray(){
  if(!S.paddocks.length)
    return el(`<div class="empty"><b>No paddocks yet</b>
      Spraying is recorded against a paddock, so draw your fence lines first.</div>`);

  // One tank crosses several paddocks in an afternoon, so this is a
  // list rather than a choice. Ticking one opens the area it covered,
  // offered from the mapped boundary and editable — spot spraying a
  // fenceline is not the whole paddock.
  const inner = el(`<div>
    <label><span>Paddocks</span></label>
    <div id="pks" style="border:1px solid var(--rule);border-radius:11px;padding:2px 12px 8px">
      ${S.paddocks.map(p => `<div style="border-bottom:1px solid var(--rule);padding:8px 0">
        <label class="chk" style="margin:0">
          <input type="checkbox" class="pk-on" data-id="${p.id}" ${S.selPk===p.id?"checked":""}>
          <span>${esc(p.name)}${p.area_ha!=null?` · ${p.area_ha} ha`:""}</span></label>
        <div class="pk-more" ${S.selPk===p.id?"":"hidden"} style="margin-top:6px">
          <div class="two">
            <label style="margin:0"><span>Area ha</span>
              <input type="number" class="pk-ha" data-id="${p.id}" step="0.1" min="0"
                inputmode="decimal" value="${S.selPk===p.id ? (p.area_ha ?? "") : ""}"></label>
            <label style="margin:0"><span>Where in it</span>
              <input type="text" class="pk-note" data-id="${p.id}" placeholder="Optional"></label>
          </div>
        </div>
      </div>`).join("")}
    </div>
    <label style="margin-top:12px"><span>Date</span>
      <input type="date" name="on" value="${today()}" required></label>
    <label><span>Crop or pasture</span><input type="text" name="crop" placeholder="Pasture"></label>
    <div class="two">
      <label><span>Method</span><select name="method">
        <option>Boom spray</option><option>Spot spray</option><option>Knapsack</option>
        <option>Weed wiper</option><option>Aerial</option></select></label>
      <label><span>Spray volume, L/ha</span><input type="number" name="water" step="1" min="0"
        inputmode="decimal" placeholder="100"></label>
    </div>
    <div class="two">
      <label><span>Wind from</span><select name="wdir">
        <option value="">—</option><option>N</option><option>NE</option><option>E</option>
        <option>SE</option><option>S</option><option>SW</option><option>W</option>
        <option>NW</option><option>still</option></select></label>
      <label><span>Wind, km/h</span><input type="number" name="wkmh" step="1" min="0"
        inputmode="decimal"></label>
    </div>
    <p class="hint">Wind direction and speed are the whole point of Section 3B — they are what
      shows the chemical went where it was aimed. Worth thirty seconds now.</p>
    <label><span>Applied by</span><input type="text" name="by"
      placeholder="Leave blank if it was you"></label>
    <h3 class="sec" style="margin-top:18px">In the tank</h3>
    <div id="prods"></div>
    <label><span>Notes</span><input type="text" name="notes" placeholder="Optional"></label>
  </div>`);

  const prods = inner.querySelector("#prods");
  prods.appendChild(sprayProductBlock(true));
  const more = el(`<button type="button" class="btn ghost">+ Another product in the tank</button>`);
  more.onclick = () => prods.appendChild(sprayProductBlock(false));
  prods.after(more);

  // Most passes cover the whole paddock, so offer its area — into an
  // empty box only. A part-paddock figure you measured is not a default
  // to be overwritten. Unticking clears it, so an area cannot be left
  // behind on a paddock that is no longer part of the pass.
  inner.querySelectorAll(".pk-on").forEach(cb => {
    cb.onchange = () => {
      const id  = cb.dataset.id;
      const box = cb.closest("div").querySelector(".pk-more");
      const ha  = inner.querySelector(`.pk-ha[data-id="${id}"]`);
      const nt  = inner.querySelector(`.pk-note[data-id="${id}"]`);
      box.hidden = !cb.checked;
      if(cb.checked){
        const p = S.paddocks.find(x => x.id === id);
        if(p && p.area_ha != null && ha.value === "") ha.value = p.area_ha;
      } else { ha.value = ""; nt.value = ""; }
    };
  });

  const chosenPaddocks = () =>
    [...inner.querySelectorAll(".pk-on")].filter(c => c.checked).map(c => {
      const ha = inner.querySelector(`.pk-ha[data-id="${c.dataset.id}"]`).value;
      return { paddock_id: c.dataset.id,
               area_ha: ha === "" ? null : Number(ha),
               location_note: inner.querySelector(`.pk-note[data-id="${c.dataset.id}"]`).value.trim() || null };
    });

  return formShell("Record spraying", inner, async (f) => {
    const picks = chosenPaddocks();
    if(!picks.length) throw new Error("Tick at least one paddock.");

    // FormData repeats the product field names once per block, so read
    // them as parallel lists rather than single values.
    const names = f.getAll("p_name").map(s => s.trim());
    if(!names.some(Boolean)) throw new Error("Say what went in the tank.");
    const rates = f.getAll("p_rate"), batches = f.getAll("p_batch");
    const graze = f.getAll("p_graze"), cuts = f.getAll("p_cut"), esis = f.getAll("p_esi");
    const prods = names.map((nm,i) => !nm ? null : ({
      product_name:          nm,
      chemical_rate:         (rates[i]||"").trim()   || null,
      batch_number:          (batches[i]||"").trim() || null,
      graze_withhold_days:   graze[i] ? Number(graze[i]) : null,
      harvest_withhold_days: cuts[i]  ? Number(cuts[i])  : null,
      esi_days:              esis[i]  ? Number(esis[i])  : null
    })).filter(Boolean);

    // Pass, paddocks and products in one transaction. Written as three
    // separate calls it could half-save, and being told it failed after
    // the pass was already on file gets the same spray entered twice.
    const { error } = await db.rpc("record_spray", {
      p_applied_on:      f.get("on"),
      p_paddocks:        picks,
      p_products:        prods,
      p_crop_treated:    (f.get("crop")||"").trim() || null,
      p_water_rate_l_ha: f.get("water") ? Number(f.get("water")) : null,
      p_method:          f.get("method") || null,
      p_wind_direction:  f.get("wdir") || null,
      p_wind_speed_kmh:  f.get("wkmh") ? Number(f.get("wkmh")) : null,
      p_applied_by:      (f.get("by")||"").trim() || null,
      p_notes:           (f.get("notes")||"").trim() || null
    });
    if(error) throw error;

    // Tell them what they can't do now, not just that it worked.
    const where = picks.length === 1
      ? (S.paddocks.find(p => p.id === picks[0].paddock_id)?.name || "the paddock")
      : `${picks.length} paddocks`;
    const days = prods.map(r => r.graze_withhold_days).filter(d => d != null);
    if(prods.some(r => r.graze_withhold_days == null))
      return `Recorded over ${where}. No grazing withholding period on file, `
        + `so ${picks.length===1?"it stays":"they stay"} flagged until you add one.`;
    const clear = new Date(f.get("on") + "T00:00:00");
    clear.setDate(clear.getDate() + Math.max(...days));
    return `Recorded over ${where}. Keep stock out until `
      + clear.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}) + ".";
  });
}

function recFeed(){
  if(!S.paddocks.length)
    return el(`<div class="empty"><b>No paddocks yet</b>
      Feeding is recorded against a paddock, so draw your fence lines first.</div>`);

  const inner = el(`<div>
    <label><span>Paddock</span><select name="paddock" required>
      <option value="">Which paddock…</option>
      ${S.paddocks.map(p => `<option value="${p.id}"${S.selPk===p.id?" selected":""}>${
        esc(p.name)} — ${headIn(p.id)} head</option>`).join("")}
    </select></label>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Feed</span><select name="source">

        f.batch_ref?` · ${esc(f.batch_ref)}`:""}${
        f.remaining!=null?` · ${f.remaining} ${esc(f.unit||"")} left`:""}</option>`).join("")}
      <option value="__new">+ Add feed to the store…</option>
