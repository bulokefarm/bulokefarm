<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E3436">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buloke">
<title>Buloke Farm</title>
<style>
:root{
  --paper:#F2F2EE; --card:#FFF; --ink:#16150F; --ink2:#5A574E;
  --rule:#D9D6CC; --accent:#12564F; --accent-soft:#E2EDEA;
  --warn:#8F5A0C; --danger:#8C2F2A;
  --tap:48px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:var(--card);border-bottom:1px solid var(--rule);
}
header img.mark{width:27px;height:27px;flex:none;display:block;border-radius:6px}
header h1{
  margin:0;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
header .who{margin-left:auto;font-size:12px;color:var(--ink2);text-align:right}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
nav{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  border:0;background:none;padding:11px 4px 13px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);cursor:pointer;
  border-top:3px solid transparent;margin-top:-1px;
}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
nav button b{display:block;font-size:19px;font-weight:600;letter-spacing:0;margin-bottom:1px}

/* ---------- ear tag: the signature ---------- */
.tag{
  display:inline-grid;grid-template-columns:auto auto;align-items:stretch;
  border-radius:7px;overflow:hidden;font-family:var(--mono);
  line-height:1;flex:none;position:relative;
}
.tag i{
  display:grid;place-items:center;font-style:normal;font-weight:700;
  color:#fff;padding:0 .5em;
}
.tag b{
  display:grid;place-items:center;font-weight:600;background:#fff;
  color:var(--ink);padding:0 .55em;border:1px solid var(--rule);border-left:0;
  border-radius:0 7px 7px 0;
}
.tag::before{ /* the punch hole — it's an ear tag */
  content:"";position:absolute;top:3px;left:50%;width:5px;height:5px;
  border-radius:50%;background:rgba(255,255,255,.55);transform:translateX(-50%);
  pointer-events:none;
}
.tag.sm{font-size:15px;height:34px}
.tag.lg{font-size:27px;height:58px}
.tag.lg::before{width:7px;height:7px;top:5px}

/* ---------- lists ---------- */
.pad{padding:12px 14px}
.search{
  position:sticky;top:0;z-index:5;background:var(--paper);
  padding:10px 14px;border-bottom:1px solid var(--rule);
}
.search input{
  width:100%;height:var(--tap);border:1px solid var(--rule);border-radius:10px;
  padding:0 14px;background:var(--card);font-size:17px; /* 17px stops iOS zoom */
}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:flex;gap:0;margin-bottom:9px;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:9px 6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.maplayout{display:block}
.mapbox{background:#EBEAE3;border-bottom:1px solid var(--rule);
  height:clamp(170px,34dvh,380px);position:relative}
@media (min-width:820px){
  .maplayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  .mappane{order:2;position:sticky;top:0}
  .listpane{order:1;border-right:1px solid var(--rule);min-height:calc(100dvh - 118px)}
  .mapbox{height:calc(100dvh - 118px);border-bottom:0;border-left:0}
}
.mapbox svg{width:100%;height:100%;display:block}
.maphint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;
  color:var(--ink2);pointer-events:none}
.pkcard{background:var(--card);border-bottom:1px solid var(--rule);padding:12px 14px}
.pkcard .top{display:flex;align-items:center;gap:10px}
.pkcard .nm{font-size:17px;font-weight:700;flex:1;min-width:0}
.pkcard .close{border:0;background:none;font-size:21px;line-height:1;color:var(--ink2);
  cursor:pointer;padding:2px 6px}
.pkstats{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.pkstats b{color:var(--ink);font-family:var(--mono);font-weight:600}
.pkacts{display:flex;gap:8px;margin-top:11px}
.pkacts button{flex:1;min-height:42px;border:1px solid var(--rule);border-radius:9px;
  background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.pkacts button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.treewrap{overflow-x:auto;overflow-y:hidden;background:var(--card);border-bottom:1px solid var(--rule);
  -webkit-overflow-scrolling:touch}
.treewrap svg{display:block}
.tnode{cursor:pointer}
.menu{max-width:760px}
.menu .row{padding:14px}
.menu .row .nm{font-size:16px}
.menu .row .sub{margin-top:4px;white-space:normal}
.menu .row .rt{font-size:19px;color:var(--rule)}
h3.sec{margin-top:4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow-x:visible;row-gap:6px}
.chip{
  flex:none;border:1px solid var(--rule);background:var(--card);border-radius:99px;
  padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{border-bottom:1px solid var(--rule)}
.row{
  width:100%;display:flex;align-items:center;gap:12px;background:var(--card);
  border:0;padding:13px 14px;text-align:left;cursor:pointer;min-height:var(--tap);
}
.row:active{background:var(--accent-soft)}
.row .meta{min-width:0;flex:1;display:block}
.row .nm{display:block;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
/* Days on feed. Its own pill rather than another item in the sub line:
   the sub line already ellipses on a phone, and this is the number a
   buyer asks for, so it must not be the thing that gets cut. */
.dof{display:inline-block;font-family:var(--mono);font-size:11.5px;line-height:1;
     padding:3px 6px;border-radius:999px;background:var(--accent-soft);
     color:var(--accent);white-space:nowrap;margin-left:6px;vertical-align:1px}
.dof.low{background:#F6EADA;color:var(--warn)}
/* The on-feed block on a herd row. Deliberately allowed to wrap where
   .sub does not: this is the number a buyer asks for, so it should not
   be the thing that ellipses away on a phone. */
.row .feed{display:block;font-size:12.5px;line-height:1.4;margin-top:4px;
  color:var(--ink2);white-space:normal}
.row .feed b{color:var(--accent);font-weight:700}
.row .feed.low b{color:var(--warn)}
.row .feed.off b{color:var(--ink2)}
.row .feed .ttl{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;
  color:var(--ink2);opacity:.8;display:block}
.row .rt{font-family:var(--mono);font-size:13px;color:var(--ink2);text-align:right;flex:none}

/* ---------- detail ---------- */
.hero{background:var(--card);padding:16px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px}
.hero h2{margin:0 0 3px;font-size:21px;line-height:1.15}
.hero .sub{font-size:13px;color:var(--ink2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border-bottom:1px solid var(--rule)}
.fact{background:var(--card);padding:10px 14px;min-width:0}
.fact dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.fact dd{margin:2px 0 0;font-weight:600;word-break:break-word}
.fact dd.mono{font-family:var(--mono);font-size:14px;font-weight:500}
h3.sec{
  margin:0;padding:16px 14px 7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink2);font-weight:700;
}
.tl{list-style:none;margin:0;padding:0 14px 4px}
.tl li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule)}
.tl time{font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none;width:74px;padding-top:2px}
.tl .what{min-width:0}
.tl .what b{display:block;font-weight:600}
.tl .what span{font-size:13px;color:var(--ink2)}

/* ---------- forms ---------- */
form{padding:4px 14px 20px}
label{display:block;margin:13px 0 0}
label span{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=email],
input[type=password],select,textarea{
  width:100%;min-height:var(--tap);border:1px solid var(--rule);border-radius:10px;
  padding:11px 13px;background:var(--card);font-size:17px;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{
  width:100%;min-height:52px;margin-top:20px;border:0;border-radius:11px;
  background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer;
}
.btn:disabled{opacity:.5}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--rule);margin-top:11px}
.picker{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.pick{border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:0;cursor:pointer}
.pick[aria-pressed="true"]{outline:2.5px solid var(--accent);outline-offset:1px}
.hint{font-size:12.5px;color:var(--ink2);margin:6px 0 0}
.note{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:13.5px;margin:14px 0 0}
label.chk{display:flex;align-items:center;gap:10px;min-height:var(--tap)}
label.chk input{width:22px;height:22px;flex:none}
label.chk span{font-size:15px}

.msg{margin:12px 14px;padding:12px 13px;border-radius:10px;font-size:14px}
.msg.err{background:#F7E4E2;color:var(--danger)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 24px;text-align:center;color:var(--ink2)}

/* The six canisters, laid out as six canisters. A tank is a physical
   thing and the summary should look like the thing. */
.cans{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  gap:9px;padding:10px 14px 2px}
.can{border:1px solid var(--rule);border-radius:10px;background:var(--card);overflow:hidden}
.can > h4{margin:0;padding:6px 9px;background:var(--paper);border-bottom:1px solid var(--rule);
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  display:flex;justify-content:space-between;gap:6px}
.can ul{list-style:none;margin:0;padding:0}
.can li{display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid var(--rule)}
.can li:first-child{border-top:0}
.can .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.can .ct{font-family:var(--mono);flex:none;color:var(--ink2)}
.can .none{padding:9px;color:var(--ink2);font-style:italic;font-size:12px}
/* The marker is a colour, so it is shown as one. */
.sw{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.28)}
.sw.nomk{background:repeating-linear-gradient(45deg,#fff,#fff 3px,var(--rule) 3px,var(--rule) 6px)}
/* Mini and maxi are literally different sizes of straw. */
.sz-mid{font-size:12.5px}
.sz-mini{font-size:10.5px}
.sz-maxi{font-size:14px;font-weight:700}
/* The lists are the reading surface, so the same three sizes run
   larger there — the difference still shows without shrinking a name
   to something you have to squint at in the shed. */
.row .sw{align-self:center}
.row .nm.sz-mini{font-size:14px}
.row .nm.sz-mid {font-size:15.5px}
.row .nm.sz-maxi{font-size:18px;font-weight:700}

/* The contents page, condensed. Dense on purpose — it is a lookup,
   not something to read. */
details.sum{margin:8px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
details.sum summary{padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;list-style:none}
details.sum summary::-webkit-details-marker{display:none}
details.sum summary::before{content:"▸ ";color:var(--ink2)}
details.sum[open] summary::before{content:"▾ "}
details.sum table{width:100%;border-collapse:collapse;font-size:12.5px}
details.sum td{padding:5px 8px;border-top:1px solid var(--rule);vertical-align:top}
details.sum td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
details.sum td.l{width:26px;color:var(--ink2);font-family:var(--mono)}
details.sum tr.maxi td.n{font-weight:700}
.filt{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px 0}
.filt select{flex:1;min-width:96px;border:1px solid var(--rule);border-radius:8px;
  padding:7px 8px;font:inherit;font-size:13px;background:var(--card)}
/* Confirming a mob: one row per female, tick and gestation in reach of a thumb. */
.mob{border:1px solid var(--rule);border-radius:10px;background:var(--card);margin-top:6px}
.mob label{display:flex;align-items:center;gap:9px;padding:7px 11px;
  border-top:1px solid var(--rule);min-height:var(--tap)}
.mob label:first-child{border-top:0}
.mob input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.mob .sub{flex:1;color:var(--ink2);font-size:12.5px}
.mob .gd{width:60px;flex:none;text-align:center;padding:6px 4px;
  border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
.boot{padding:22vh 24px;text-align:center;color:var(--ink2);font-size:14px}
.boot img{width:38px;height:38px;border-radius:8px;display:block;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:17px}

/* ---------- login ---------- */
.login{max-width:380px;margin:0 auto;padding:14vh 22px}
.login .mark{font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  text-align:center;margin-bottom:4px}
.login .tagline{text-align:center;color:var(--ink2);font-size:13.5px;margin-bottom:26px}

@media (prefers-reduced-motion:no-preference){
  main>*{animation:in .16s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}}
}
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<div id="app"><div class="boot" id="bootmsg"><img src="/mark.png" alt="">Loading the herd…</div></div>

<script>
// Classic script, deliberately: it still runs when the module below never
// does. A module that fails to load has no way to report that it failed,
// and the result is a white screen with nothing on it. If the app hasn't
// painted — #bootmsg is replaced the moment it does — say so and offer a
// way out, rather than leaving the phone sitting blank.
setTimeout(function(){
  var b = document.getElementById("bootmsg");
  if(!b) return;
  b.innerHTML = "<b style='color:var(--ink);display:block;margin-bottom:6px'>"
    + "Couldn't start</b>No answer from the network. This usually clears on its own."
    + "<br><button class='btn ghost' onclick='location.reload()'>Try again</button>";
}, 12000);
</script>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  CONFIG — paste your two values from Supabase:
//  Project Settings → Data API → Project URL and anon public key.
//  The anon key is safe to publish; RLS is what protects the data.
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = "https://hgnzignikbpdbbyubahu.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbnppZ25pa2JwZGJieXViYWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTgzNTcsImV4cCI6MjEwMTEzNDM1N30.U5vvmmZfSP0SOXsvLaxpjJ6LjWjOvaOYwTZ9VKyfFs0";

// The library comes from our own origin first — same connection, same
// Cloudflare edge that just served this page, no second DNS lookup or TLS
// handshake to a third party. esm.sh stays only as a fallback for the case
// where /vendor hasn't been deployed.
let createClient;
try      { ({ createClient } = await import("/vendor/supabase.js")); }
catch(e) { console.warn("vendor/supabase.js failed — falling back to esm.sh", e);
           ({ createClient } = await import("https://esm.sh/@supabase/supabase-js@2")); }

// Nothing in this app needs ten seconds. Without a cap, a request made
// while the phone is still bringing its radio up doesn't fail — it hangs,
// and the screen stays blank for as long as iOS is willing to wait, which
// is minutes. A fast failure we can show; a slow one we can't.
const REQUEST_MS = 10000;
const timedFetch = (url, opts = {}) => {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), REQUEST_MS);
  return fetch(url, { ...opts, signal: c.signal })
    .catch(err => { throw err.name === "AbortError"
      ? new Error("The network didn't answer. Check your signal and try again.") : err; })
    .finally(() => clearTimeout(t));
};

const db = createClient(SUPABASE_URL, SUPABASE_ANON, { global: { fetch: timedFetch } });

// ─── year-letter colours ────────────────────────────────────────
// The letter is the birth year. Same letter, same colour, everywhere —
// so a mob reads at a glance once you've learnt three of them.
const LETTER = {L:"#6B4E9E",M:"#7A4B2A",N:"#1F6FB2",O:"#4A6B8A",P:"#8A4E6B",
  Q:"#0E7C6B",R:"#4F7A1F",S:"#A8760D",T:"#B4552A",U:"#96324B",V:"#5A4A9C",
  W:"#14708A",X:"#3C6E2F",Y:"#7A5C12",Z:"#54595E"};
const hue = l => LETTER[(l||"").toUpperCase()] || "#54595E";

// Sheep run a different alphabet. The code starts with the tag colour,
// on the NLIS eight-year cycle — BK black 2024, W white 2025, O orange
// 2026, G light green 2027, P purple 2028, Y yellow 2029, R red 2030,
// BU sky blue 2031 — and that colour is what is in the ear, so it is
// what the tag block shows. Two letters where one would be ambiguous.
// year_letter() in the database hands the same letters out.
const SHEEP_COLOUR = {BK:["Black","#1B1B1B"], W:["White","#F4F4F1"], O:["Orange","#F28C1E"],
  G:["Light green","#8FD46E"], P:["Purple","#7B3FA0"], Y:["Yellow","#F5D327"],
  R:["Red","#D42B2B"], BU:["Sky blue","#63B8EA"]};
const sheepColour = l => SHEEP_COLOUR[(l||"").toUpperCase()] || null;
const tagColour   = (l, sp) => sp === "sheep" ? (sheepColour(l)?.[1] || "#54595E") : hue(l);
// White, yellow and the light greens and blues need dark ink on them.
const lightHex = c => { const n = parseInt(c.slice(1), 16);
  return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255 > 0.62; };

// Returns the node, or a fragment when the string holds more than one.
// It used to return firstChild only, which meant any template with
// sibling elements silently lost everything after the first — the bulk
// edit's status selects and the animal editor's exit date were both
// being thrown away with no error anywhere. Fixed here rather than at
// each call site so it can't happen again.
const el   = (h) => {
  const t = document.createElement("template"); t.innerHTML = h.trim();
  return t.content.childNodes.length > 1 ? t.content : t.content.firstChild;
};
const esc  = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Local date, never toISOString(): that returns the UTC day, so anything
// recorded before 10am AEST (11am AEDT) was dated YESTERDAY on the LPA
// record. Built from the local parts so it does not depend on locale.
const today= () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`
       + `-${String(d.getDate()).padStart(2,"0")}`; };
const fmt  = (d) => d ? new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"2-digit"}) : "—";
const age  = (y) => y==null ? "—" : (y<1 ? Math.round(y*12)+" mo" : (Math.round(y*10)/10)+" yr");

function tagHTML(code, size="sm", sp="cattle"){
  const [l,n] = (code||"? ?").split(" ");
  const bg = tagColour(l, sp), light = lightHex(bg);
  return `<span class="tag ${size}"><i style="background:${bg}${
    light ? ";color:#16150F;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)" : ""}">${esc(l)}</i><b>${esc(n||"")}</b></span>`;
}

// ─── animal fields ──────────────────────────────────────────────
// One registry drives the detail screen, the edit form, the bulk
// editor and the settings toggles. Add a field here and it appears
// in all four.
const AF = [
  // key, label, type, group, on by default, bulk-editable
  ["stock_code","Tag","text","Identity",1,0],
  ["name","Name","text","Identity",1,0],
  ["nlis_tag","NLIS tag","text","Identity",1,0],
  ["sex","Sex","pick:female|male|steer|unknown","Identity",1,1],
  ["dob","Born","date","Identity",1,0],
  ["breed","Breed","text","Breeding",1,1],
  ["grade","Grade","text","Breeding",0,1],
  ["dam_id","Dam","ref:dam","Breeding",1,0],
  ["sire_id","Sire","ref:sire","Breeding",1,0],
  ["birth_weight_kg","Birth weight (kg)","number","Breeding",0,0],
  ["weaned_on","Weaned","date","Breeding",0,1],
  ["coat_colour","Coat colour","text","Markings",0,1],
  ["polled","Polled","bool","Markings",0,1],
  ["marking_code","Marking code","text","Markings",0,1],
  ["heritage_id","Heritage line","ref:heritage","Provenance",0,1],
  ["property_id","PIC","ref:property","Provenance",0,1],
  ["origin_property_id","Original PIC","ref:property","Provenance",0,1],
  ["purchased_on","Purchased","date","Provenance",0,0],
  ["purchase_note","Purchase note","text","Provenance",0,0],
  ["notes","Notes","area","Notes",1,0],
];
const DERIVED = [
  ["age_years","Age",1],["life_state","Status",1],["class","Class",1],
  ["paddock_name","Paddock",1],["last_weight_kg","Last weight",1],
  ["adg_kg_per_day","Growth",0],["clear_domestic","Slaughter clear",0],
  ["heritage_name","Heritage",0],["pic","PIC",0],["origin_pic","Original PIC",0],
];
const defaultPrefs = () => ({
  fields: Object.fromEntries([...AF.map(f=>[f[0],!!f[4]]), ...DERIVED.map(d=>[d[0],!!d[2]])])
});
// An animal with no status row has never been through a transition,
// so it's still here. Sold and died are gone; they stay in the
// pedigree but never in a head count.
const isActive = a => !a.life_state || a.life_state === "alive";
// A calf on the ground carries this year's letter and no number yet —
// stock_code stays null until a tag is chosen in the yard. Wherever a
// tag is shown, show the letter with a placeholder rather than "? ?".
const codeOf = a => a.stock_code || (a.year_letter ? `${a.year_letter} ?` : "? ?");
// paddock.head counts every animal grazing there. With two mobs on the
// same ground that is the wrong number the moment a species scope is
// set, so anywhere a head count is shown it is counted from the herd.
const headIn = id => S.animals.filter(a => isActive(a) && inSpecies(a) && a.paddock_id === id).length;

// ─── species ────────────────────────────────────────────────────
// The class vocabulary differs between the two — a ewe is not a
// breeder cow and a lamb is not a calf — so the scope has to be
// settled before the words on the buttons can be.
const SPECIES = ["cattle","sheep"];
const sLabel = sp => ({cattle:"Cattle", sheep:"Sheep"})[sp] || sp;
const inSpecies = a => S.species === "all" || a.species === S.species;
const speciesOf = a => a?.species || "cattle";
const hasBoth = () => new Set(S.animals.map(speciesOf)).size > 1;
const hasSpecies = sp => S.animals.some(a => speciesOf(a) === sp);

// A bull out has to be a bull that is here. Not every male ever
// recorded, and not a reference sire that has never set foot on the
// place — those exist to hang a pedigree on, not to join a mob.
const sireWord = sp => (sp === "sheep" ? "ram" : "bull");
const workingSires = () => S.animals.filter(a =>
  isActive(a) && inSpecies(a) && a.class === sireWord(speciesOf(a)));

const CLASS_ORDER = {
  cattle: ["breeder","harvest","yearling","weaner","calf","protector","bull"],
  sheep:  ["breeder","harvest","yearling","lamb","ram"]
};
const CLASS_LABEL = {
  cattle: {breeder:"Breeders", harvest:"Harvest", yearling:"Yearlings", weaner:"Weaners",
           calf:"Calves", protector:"Protector", bull:"Bulls"},
  sheep:  {breeder:"Ewes", harvest:"Harvest", yearling:"Yearlings", lamb:"Lambs", ram:"Rams"}
};
// The same event has a different name in each mob. A bull goes out to
// cows; a ram goes out to ewes. Using one word for both reads as a
// system that was built for cattle and had sheep bolted on.
const WORD = {
  cattle: {sire:"Bull",        dam:"Cow",    young:"Calf",         birth:"Calving",
           birthed:"Calved",   incalf:"In calf"},
  sheep:  {sire:"Ram",         dam:"Ewe",     young:"Lamb",         birth:"Lambing",
           birthed:"Lambed",   incalf:"In lamb"},
  all:    {sire:"Bull or ram", dam:"Female",  young:"Calf or lamb", birth:"Calving / lambing",
           birthed:"Birthed",  incalf:"In calf or lamb"}
};
const w  = (k, sp = S.species) => (WORD[sp] || WORD.cattle)[k];
const wl = (k, sp = S.species) => w(k, sp).toLowerCase();

// The scope control, wherever it is needed. One piece of state, so
// setting it on the herd screen carries into the record forms.
function speciesBar(){
  if(!hasBoth()) return null;
  const bar = el(`<div class="search" style="padding-top:0"><div class="seg">
    <button aria-pressed="${S.species==="all"}">All stock</button>
    <button aria-pressed="${S.species==="cattle"}">Cattle</button>
    <button aria-pressed="${S.species==="sheep"}">Sheep</button>
  </div></div>`);
  bar.querySelectorAll(".seg button").forEach((b,i) => b.onclick = () => {
    S.species = ["all","cattle","sheep"][i]; S.filter = "all"; render();
  });
  return bar;
}

// Sheep run 145 days, cattle 285. Her own figure still wins.
const GEST_BY_SPECIES = { cattle: 285, sheep: 145 };
const classesFor = sp => sp === "all"
  ? [...new Set([...CLASS_ORDER.cattle, ...CLASS_ORDER.sheep])]
  : CLASS_ORDER[sp];
const classLabel = (k, sp) => (CLASS_LABEL[sp] || CLASS_LABEL.cattle)[k]
  || (CLASS_LABEL.cattle[k] || CLASS_LABEL.sheep[k] || k);
const shown = k => S.prefs?.fields?.[k] !== false;

// Days on feed comes down on the animal row already — v_animal_current
// carries it — so showing it costs no extra query. Null means not on a
// run: either never started or the load was marked run out, which closes
// the run and stops the clock rather than letting it count forever.
// The estimate is advisory only — it tints the pill and nothing more.
// A run ends when someone has looked in the feeder, never on a date
// arithmetic picked.
const feedLow = a => a.est_days_left != null && a.est_days_left <= 7;
// The same block the detail screen shows, sized for a list row. Kept in
// one place so the herd and the animal card can never drift apart.
// Recently-off is shown for 90 days: after that it is history, not
// something you need while walking the mob.
const recentlyOff = a => a.off_feed_on != null &&
  (Date.now() - new Date(a.off_feed_on).getTime()) / 864e5 <= 90;
function feedBlockHTML(a){
  if(a.days_on_feed != null){
    const l2 = [`since ${fmt(a.on_feed_since)}`,
      a.est_empty_on ? `est. empty ${fmt(a.est_empty_on)}` : null,
      a.est_days_left != null
        ? (a.est_days_left >= 0 ? `about ${a.est_days_left} d left` : "past the estimate")
        : null].filter(Boolean).join(" · ");
    return `<span class="feed${feedLow(a)?" low":""}"><span class="ttl">On feed</span>`
      + `<b>${a.days_on_feed} days</b> · ${esc(a.on_feed_feedstuff||"ration not named")}`
      + `<br>${l2}</span>`;
  }
  if(recentlyOff(a))
    return `<span class="feed off"><span class="ttl">Came off feed</span>`
      + `<b>${a.days_fed_last} days</b> · ${esc(a.last_feedstuff||"ration not named")}`
      + `<br>finished ${fmt(a.off_feed_on)}</span>`;
  return "";
}
const dofHTML = a => a.days_on_feed == null ? ""
  : `<span class="dof${feedLow(a)?" low":""}" title="On ${esc(a.on_feed_feedstuff||"feed")} since ${
      fmt(a.on_feed_since)}${a.est_empty_on?" — est. empty "+fmt(a.est_empty_on):""}">${
      a.days_on_feed} d fed</span>`;

// ─── state ──────────────────────────────────────────────────────
const S = { me:null, animals:[], herdMode:"list", species:"all", treeLink:null, cryoLot:null, joinMode:"natural", pending:[], treeFam:undefined, treePend:false, paddocks:[], feeds:[], feedsDone:[], refs:{}, prefs:null, selFeed:null, closeDue:null, view:"herd", filter:"all", q:"", sel:null, selPk:null, busy:false };

// ═══ data ═══════════════════════════════════════════════════════
async function loadHerd(){
  const { data, error } = await db.from("v_animal_current").select("*").order("dob",{ascending:false});
  if(error) throw error;
  S.animals = data || [];
}
async function loadPending(){
  const { data } = await db.from("expected_calving")
    .select("id,dam_id,due_on,season,sire:sire_id(name)")
    .is("resolved_calving_id", null).order("due_on");
  S.pending = data || [];
}
async function loadPaddocks(){
  const [p,f,d] = await Promise.all([
    db.from("v_paddock_current").select("*").order("name"),
    db.from("v_feed_store").select("*")
      .is("exhausted_on", null).order("feedstuff"),
    // Finished loads stay reachable. Marking a load used up used to
    // drop it out of the store list entirely, which also took away
    // the only way to say the feeder later ran dry — so the animals
    // could be stuck on feed with no screen left to take them off.
    db.from("v_feed_store").select("*")
      .not("exhausted_on", "is", null)
      .order("exhausted_on", {ascending:false}).limit(20)
  ]);
  S.paddocks  = p.data || [];
  S.feeds     = f.data || [];
  S.feedsDone = d.data || [];
}
async function loadRefs(){
  const [h,p,b,s,em] = await Promise.all([
    db.from("heritage").select("id,name").order("name"),
    db.from("property").select("id,pic").order("pic"),
    db.from("v_breeding_stock").select("id,label,sex,origin,species").order("label"),
    db.from("v_ai_semen").select("*").is("retired_on", null).order("sire_name"),
    db.from("v_embryo").select("*").is("retired_on", null).order("pairing")
  ]);
  S.refs = {
    heritage: h.data||[], property: (p.data||[]).map(x=>({id:x.id,label:x.pic})),
    sire: (b.data||[]).filter(x=>x.origin==="reference"||x.sex==="male"),
    dam:  (b.data||[]).filter(x=>x.origin==="reference"||x.sex==="female"),
    _all: b.data||[],
    semen: s.data||[], embryo: em.data||[]
  };
}
async function loadPrefs(){
  const { data } = await db.from("user_pref").select("prefs").eq("user_id", S.me.id).maybeSingle();
  S.prefs = data?.prefs?.fields ? data.prefs : defaultPrefs();
}
async function savePrefs(){
  await db.from("user_pref").upsert({user_id:S.me.id, prefs:S.prefs, updated_at:new Date().toISOString()});
}
async function loadMe(){
  const { data:{ user } } = await db.auth.getUser();
  if(!user) return null;
  const { data } = await db.from("farm_user").select("*").eq("id", user.id).maybeSingle();
  S.me = data ? {...data, email:user.email} : {id:user.id, email:user.email, role:null, active:false};
  return S.me;
}
const canWrite = () => S.me && S.me.active && (S.me.role==="owner" || S.me.role==="manager");

// ═══ views ══════════════════════════════════════════════════════
function viewHerd(){
  const wrap = el(`<div></div>`);
  const bar = el(`<div class="search">
    <div class="seg">
      <button aria-pressed="${S.herdMode==="list"}">List</button>
      <button aria-pressed="${S.herdMode==="paddock"}">Paddocks</button>
      <button aria-pressed="${S.herdMode==="tree"}">Family tree</button>
    </div>
    <input type="search" placeholder="Tag, name or breed" value="${esc(S.q)}" autocomplete="off"></div>`);
  const [bL,bP,bT] = bar.querySelectorAll(".seg button");
  bL.onclick = () => { S.herdMode="list"; S.filter="all"; render(); };
  bP.onclick = () => { S.herdMode="paddock"; S.filter="all"; render(); };
  bT.onclick = () => { S.herdMode="tree"; render(); };
  wrap.appendChild(bar);

  // The species row only appears when there is more than one on the
  // books. A cattle-only farm should never see it.
  const spBar = speciesBar();
  if(spBar) wrap.appendChild(spBar);

  const live = S.animals.filter(a => isActive(a) && inSpecies(a));
  const past = S.animals.filter(a => !isActive(a) && inSpecies(a));
  const counts = { all: live.length, past: past.length };
  for(const a of live) counts[a.class] = (counts[a.class]||0)+1;
  const cats = [["all","On hand"],
    ...classesFor(S.species).map(k => [k, classLabel(k, S.species)])]
    .filter(([k]) => k==="all" || counts[k]);
  if(counts.past) cats.push(["past","Sold & died"]);

  // In Paddocks mode the filters are paddocks — and only the ones with
  // something in them. An empty paddock is not a useful filter.
  if(S.herdMode==="paddock"){
    cats.length = 0;
    cats.push(["all","Everywhere"]);
    for(const p of S.paddocks){
      const n = live.filter(a => a.paddock_id===p.id).length;
      if(n){ counts["pk:"+p.id] = n; cats.push(["pk:"+p.id, p.name]); }
    }
    const noPk = live.filter(a => !a.paddock_id).length;
    if(noPk){ counts["pk:none"] = noPk; cats.push(["pk:none","No paddock"]); }
  }
  const chips = el(`<div class="chips"></div>`);
  for(const [k,label] of cats){
    const pk = k.startsWith("pk:") ? S.paddocks.find(p=>p.id===k.slice(3)) : null;
    const b = el(`<button class="chip" aria-pressed="${S.filter===k}">${
      pk ? `<span class="dot" style="background:${esc(pk.colour)}"></span>` : ""}${label} ${counts[k]||0}</button>`);
    b.onclick = () => { S.filter=k; render(); };
    chips.appendChild(b);
  }
  wrap.appendChild(chips);

  const q = S.q.trim().toLowerCase();
  const inScope = a => inSpecies(a) && (
      S.herdMode==="paddock" && S.filter==="all" ? isActive(a)
    : S.filter==="past"      ? !isActive(a)
    : S.filter==="pk:none"   ? isActive(a) && !a.paddock_id
    : S.filter.startsWith("pk:") ? isActive(a) && a.paddock_id===S.filter.slice(3)
    : isActive(a) && (S.filter==="all" || a.class===S.filter));
  const match = a => inScope(a) &&
    (!q || [codeOf(a),a.name,a.breed,a.nlis_tag].some(v => (v||"").toLowerCase().includes(q)));

  if(S.herdMode==="paddock"){
    const groups = [];
    for(const p of S.paddocks){
      const inIt = S.animals.filter(a => isActive(a) && a.paddock_id===p.id && match(a));
      if(inIt.length) groups.push([p, inIt]);
    }
    const loose = S.animals.filter(a => isActive(a) && !a.paddock_id && match(a));
    if(loose.length) groups.push([null, loose]);

    if(!groups.length){
      wrap.appendChild(el(`<div class="empty"><b>Nothing to show</b>
        ${S.paddocks.length ? "No stock matches here." : "Draw your paddocks first, then assign stock."}</div>`));
    }
    for(const [p, list] of groups){
      wrap.appendChild(el(`<h3 class="sec" style="display:flex;align-items:center;gap:8px">
        ${p ? `<span class="dot" style="background:${esc(p.colour)}"></span>` : ""}
        <span style="flex:1">${p ? esc(p.name) : "Not in a paddock"}</span>
        <span style="font-family:var(--mono)">${list.length} hd${
          p?.area_ha ? ` · ${p.area_ha} ha` : ""}</span></h3>`));
      const ul = el(`<ul class="rows"></ul>`);
      for(const a of list){
        const li = el(`<li><button class="row">${tagHTML(codeOf(a), "sm", speciesOf(a))}
          <span class="meta"><span class="nm">${esc(a.name||"Unnamed")}</span>
          <span class="sub">${esc(a.class||"")}${
            a.in_paddock_since?" · in since "+fmt(a.in_paddock_since):""}</span>
          ${feedBlockHTML(a)}</span>
          <span class="rt">${age(a.age_years)}${
            a.last_weight_kg?"<br>"+Math.round(a.last_weight_kg)+" kg":""}</span></button></li>`);
        li.querySelector("button").onclick = () => { S.sel=a.id; S.view="detail"; render(); };
        ul.appendChild(li);
      }
      wrap.appendChild(ul);
    }
    const inp1 = wrap.querySelector("input");
    inp1.oninput = e => {
      S.q = e.target.value; const at = e.target.selectionStart;
      render();
      const n = document.querySelector(".search input"); n.focus(); n.setSelectionRange(at,at);
    };
    return wrap;
  }

  if(S.herdMode==="tree"){
    wrap.appendChild(treeControls());
    wrap.appendChild(treeSVG(match));
    const inp0 = wrap.querySelector("input");
    inp0.oninput = e => {
      S.q = e.target.value; const at = e.target.selectionStart;
      render();
      const n = document.querySelector(".search input"); n.focus(); n.setSelectionRange(at,at);
    };
    return wrap;
  }

  const list = S.animals.filter(match);

  if(!list.length){
    wrap.appendChild(el(`<div class="empty"><b>Nothing matches</b>Try a tag like N 84, or clear the search.</div>`));
  } else {
    const ul = el(`<ul class="rows"></ul>`);
    for(const a of list){
      const li = el(`<li><button class="row"${isActive(a)?"":' style="opacity:.62"'}>
        ${tagHTML(codeOf(a), "sm", speciesOf(a))}
        <span class="meta">
          <span class="nm">${esc(a.name||"Unnamed")}</span>
          <span class="sub">${!isActive(a)
              ? `<span style="opacity:.75">${esc(a.life_state)}${
                  a.exit_on ? " " + fmt(a.exit_on) : ""}</span> · ${esc(a.breed||"")}`
              : (a.paddock_name
                  ? `<span class="dot" style="background:${esc(a.paddock_colour||"#999")}"></span>`+esc(a.paddock_name)
                  : "<span style='opacity:.6'>no paddock</span>") + ` · ${esc(a.breed||"")}`}</span>
          ${feedBlockHTML(a)}
        </span>
        <span class="rt">${age(a.age_years)}${a.last_weight_kg?"<br>"+Math.round(a.last_weight_kg)+" kg":""}</span>
      </button></li>`);
      li.querySelector("button").onclick = () => { S.sel=a.id; S.view="detail"; render(); };
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
  }

  const input = wrap.querySelector("input");
  input.oninput = e => {
    S.q = e.target.value;
    const at = e.target.selectionStart;
    render();
    const n = document.querySelector(".search input");
    n.focus(); n.setSelectionRange(at,at);
  };
  return wrap;
}

async function viewDue(){
  const wrap = el(`<div></div>`);
  const spBar = speciesBar();
  if(spBar) wrap.appendChild(spBar);

  const { data, error } = await db.from("expected_calving")
    .select("id,dam_id,joining_id,due_on,season,cycle,dam:dam_id(stock_code,name,species),sire:sire_id(name,stock_code),joining:joining_id(paddock_id,paddock:paddock_id(name))")
    .is("resolved_calving_id", null).order("due_on");
  if(error){ wrap.appendChild(el(`<div class="msg err">${esc(error.message)}</div>`)); return wrap; }

  // Filtered here rather than in the query: the species is on the dam,
  // and PostgREST can't filter a parent by an embedded child's column.
  const rows0 = (data || []).filter(r =>
    S.species === "all" || (r.dam?.species || "cattle") === S.species);

  if(!rows0.length){
    wrap.appendChild(el(`<div class="empty"><b>Nothing due</b>Expected ${
      wl("birth")}s appear here once joinings are recorded.</div>`));
    return wrap;
  }
  // Cattle are due one cow at a time. Sheep are due as a mob — the
  // ewes joined in one paddock in one season — and the mob comes off
  // Due together once lambing is over, since the lambs were recorded
  // by paddock and no ewe's row will ever resolve on its own.
  const groups = {};
  for(const r of rows0){
    const sp  = r.dam?.species || "cattle";
    const mob = sp === "sheep" ? (r.joining?.paddock?.name || "paddock not recorded") : null;
    const key = `${r.season} ${r.cycle||""}`.trim() + (mob ? ` · ${mob}` : "");
    (groups[key] ||= {rows:[], sp, mob, pkId:r.joining?.paddock_id || null}).rows.push(r);
  }
  for(const [head, g] of Object.entries(groups)){
    const h = el(`<h3 class="sec" style="display:flex;align-items:center;gap:8px">
      <span style="flex:1">${esc(head)} — ${g.rows.length} head</span></h3>`);
    if(g.mob && canWrite() && g.rows.every(r => r.joining_id)){
      const b = el(`<button type="button" class="chip">${w("birth", g.sp)} over</button>`);
      b.onclick = () => {
        S.closeDue = { ids:g.rows.map(r => r.id), label:head, sp:g.sp, pkId:g.pkId,
                       from:g.rows[0].due_on };
        S.view = "rec:closedue"; render();
      };
      h.appendChild(b);
    }
    wrap.appendChild(h);
    const ul = el(`<ul class="rows"></ul>`);
    for(const r of g.rows){
      const days = Math.round((new Date(r.due_on) - new Date())/864e5);
      // Tapping the row opens her card, the same as from the herd, so
      // the calving can be recorded from here without a search.
      const li = el(`<li><button class="row">
        ${tagHTML(r.dam?.stock_code, "sm", r.dam?.species)}
        <span class="meta">
          <span class="nm">${esc(r.dam?.name||"")}</span>
          <span class="sub">${(r.sire?.name || r.sire?.stock_code)
            ? "to " + esc(r.sire.name || r.sire.stock_code) : "sire not recorded"}</span>
        </span>
        <span class="rt">${fmt(r.due_on)}<br>${days>0?"in "+days+"d":"overdue"}</span>
      </button></li>`);
      li.querySelector("button").onclick = () => { S.sel = r.dam_id; S.view = "detail"; render(); };
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
  }
  return wrap;
}

// ─── the season is over for a mob ───────────────────────────────
// Reached from a mob's heading on Due. Every joining behind the mob
// is marked closed — season over, result not recorded per ewe — and
// the expectations go with them. Nothing is claimed about which ewes
// lambed: the lambs are on file by paddock, and that is the record.
function closeDue(){
  const c = S.closeDue;
  if(!c) return el(`<div class="empty"><b>Nothing chosen</b>Pick a mob on the Due screen.</div>`);
  const sp = c.sp, young = wl("young", sp), dam = wl("dam", sp);
  // What went on file by paddock, for the note. Approximate on purpose:
  // it counts this species' young born in that paddock since a month
  // before the first due date, and it is there to be edited.
  const since = c.from ? addDays(c.from, -30) : null;
  const born = S.animals.filter(a => speciesOf(a) === sp && a.origin === "bred" && a.dob
    && (!since || a.dob >= since) && (!c.pkId || a.paddock_id === c.pkId));
  const inner = el(`<div>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Note</span><textarea name="note">${esc(`${born.length} ${young}${born.length===1?"":"s"} recorded by paddock`)}</textarea></label>
    <div class="note">${c.ids.length} ${dam}${c.ids.length===1?"":"s"} in <b>${esc(c.label)}</b> come off Due.
      Each joining is marked <b>closed</b> — ${wl("birth", sp)} over, result not recorded per ${dam} —
      with this note, and the change is logged. Which ${dam}s actually ${wl("birthed", sp)} isn't
      claimed, because the record doesn't know. A ${dam} you do know about: record her
      ${wl("birth", sp)}, or mark her joining empty on the reports page, before closing.</div>
  </div>`);
  return formShell(`${w("birth", sp)} over — ${esc(c.label)}`, inner, async (f) => {
    const { data:n, error } = await db.rpc("close_expectations", {
      p_ids: c.ids, p_on: f.get("on"), p_note: f.get("note")||null });
    if(error) throw error;
    S.closeDue = null;
    return `${n} joining${n===1?"":"s"} closed. ${c.label} is off Due.`;
  });
}

// ─── family tree ────────────────────────────────────────────────
// Descent runs through the dam. Sires are mostly external AI bulls
// that change every season, so they annotate a node rather than
// forming their own branch — which is how a cow family actually
// persists on the ground.
// Which parent the spine follows. Cattle records carry dams, so descent
// down the dam line is the natural read. The sheep have no dams recorded
// at all — 90 nulls — so a dam spine gives 90 roots and no tree. Sire is
// the only link there is, and pretending otherwise draws nothing.
const linkDefault = sp => sp === "sheep" ? "sire" : "dam";
const treeLink = () => S.treeLink || linkDefault(treeSpecies());
// A tree spanning both mobs is two unrelated forests in one picture.
const treeSpecies = () => S.species === "all"
  ? (hasBoth() ? "cattle" : speciesOf(S.animals[0])) : S.species;

function buildForest(){
  const link = treeLink(), sp = treeSpecies();
  const pool = S.animals.filter(a => speciesOf(a) === sp);
  const byId = new Map(pool.map(a => [a.id, a]));
  const kids = new Map();                 // parent key -> [node]
  const nodes = new Map();                // key -> node
  const push = (p,c) => { if(!kids.has(p)) kids.set(p,[]); kids.get(p).push(c); };

  for(const a of pool){
    const n = {key:a.id, animal:a, kind:"animal"};
    nodes.set(a.id, n);
  }
  const parentId   = a => link === "sire" ? a.sire_id : a.dam_id;
  const parentName = a => link === "sire"
    ? (a.sire_name || "Unknown sire")
    : (a.dam_name || a.dam_code || "Unknown dam");
  const roots = [];
  for(const a of pool){
    const pid = parentId(a);
    if(pid && byId.has(pid))      push(pid, nodes.get(a.id));
    else if(pid){                  // parent known but not in this mob
      const gk = "g:"+pid;
      if(!nodes.has(gk)){
        const g = {key:gk, kind:"ghost", label:parentName(a)};
        nodes.set(gk,g); roots.push(g);
      }
      push(gk, nodes.get(a.id));
    } else roots.push(nodes.get(a.id));
  }
  // Expected calvings hang off their dam as pending.
  for(const e of (S.treePend ? S.pending : [])){
    if(link !== "dam" || !byId.has(e.dam_id)) continue;
    const k = "e:"+e.id;
    const n = {key:k, kind:"pending", label:e.due_on, sire:e.sire?.name, season:e.season};
    nodes.set(k,n); push(e.dam_id, n);
  }
  return {roots, kids, nodes};
}

// A whole-herd tree runs to thousands of pixels wide, which is
// unusable on a phone and illegible if you scale it to fit. One cow
// family at a time is both narrower and closer to how you'd ask the
// question: "show me what's come out of L 74."
function treeControls(){
  const {roots, kids} = buildForest();
  const size = (n) => { const ch = kids.get(n.key)||[];
    return ch.length ? ch.reduce((t,c)=>t+size(c),0) : 1; };
  if(S.treeFam === undefined)
    S.treeFam = (roots.length > 3 && window.innerWidth < 760) ? roots[0].key : null;

  const box = el(`<div class="chips wrap" style="padding-top:10px"></div>`);
  const chip = (label, active, fn) => {
    const b = el(`<button class="chip" aria-pressed="${active}">${esc(label)}</button>`);
    b.onclick = fn; box.appendChild(b);
  };
  chip(`All families`, S.treeFam===null, () => { S.treeFam=null; render(); });
  for(const r of roots)
    chip(`${r.kind==="ghost" ? (r.label || "Unknown")
           : (r.animal.stock_code || r.animal.name || "Untagged")} · ${size(r)}`,
         S.treeFam===r.key, () => { S.treeFam=r.key; render(); });

  const wrap = el(`<div></div>`);

  // A tree across both mobs is two unrelated forests in one picture, so
  // here species is a choice rather than a scope — "All stock" has no
  // meaning on this screen and isn't offered.
  if(hasBoth()){
    const sp = treeSpecies();
    const row = el(`<div class="chips" style="padding-top:10px"></div>`);
    for(const k of SPECIES){
      const b = el(`<button class="chip" aria-pressed="${sp===k}">${esc(sLabel(k))}</button>`);
      b.onclick = () => { S.species = k; S.treeFam = undefined; S.treeLink = null; render(); };
      row.appendChild(b);
    }
    wrap.appendChild(row);
  }

  // Which parent the line follows. Both are shown on every animal; this
  // decides which one the branches are drawn from.
  const link = treeLink();
  const lrow = el(`<div class="chips" style="padding-top:6px"></div>`);
  for(const [k,label] of [["dam","Down the dam line"],["sire","Down the sire line"]]){
    const b = el(`<button class="chip" aria-pressed="${link===k}">${label}</button>`);
    b.onclick = () => { S.treeLink = k; S.treeFam = undefined; render(); };
    lrow.appendChild(b);
  }
  wrap.appendChild(lrow);

  wrap.appendChild(box);
  const t = el(`<div class="chips" style="padding-top:4px;padding-bottom:2px"></div>`);
  // Expected births hang off the dam, so they have nowhere to sit on a
  // sire line. Disabled rather than hidden — a control that vanishes
  // reads as a bug.
  const p = el(`<button class="chip" aria-pressed="${S.treePend && link==="dam"}"
    ${link==="dam" ? "" : "disabled"}>Upcoming ${wl("birth")}s</button>`);
  if(link !== "dam") p.style.opacity = ".45";
  p.onclick = () => { S.treePend = !S.treePend; render(); };
  t.appendChild(p);
  wrap.appendChild(t);
  return wrap;
}

const sexMark = a => a.sex === "female" ? "♀" : a.sex === "wether" ? "⚲" : "♂";

function treeSVG(match){
  const all = buildForest();
  const kids = all.kids;
  const roots = S.treeFam ? all.roots.filter(r => r.key===S.treeFam) : all.roots;
  if(!roots.length)
    return el(`<div class="empty"><b>No pedigree yet</b>${
      treeLink()==="dam" ? "Dams" : "Sires"} need recording before a tree can be drawn.</div>`);

  // Age, sire and dam stacked rather than run together on one line —
  // three facts separated by middots read as one long string, and the
  // sire and dam are the two you scan a pedigree for.
  const NW=176, NH=86, GAPX=14, GAPY=44;
  let leaf = 0, maxD = 0;
  const seen = new Set();
  const place = (n, d) => {
    if(seen.has(n.key)) return n;         // guard against a bad loop
    seen.add(n.key);
    n.d = d; maxD = Math.max(maxD, d);
    const ch = kids.get(n.key) || [];
    if(!ch.length){ n.x = leaf++; return n; }
    ch.forEach(c => place(c, d+1));
    const placed = ch.filter(c => c.x !== undefined);
    n.x = placed.length ? (placed[0].x + placed[placed.length-1].x)/2 : leaf++;
    return n;
  };
  roots.forEach(r => { place(r, 0); leaf += 0.6; });

  const W = Math.max(340, Math.ceil(leaf * (NW+GAPX)) + 20);
  const H = (maxD+1) * (NH+GAPY) + 20;
  const px = n => 10 + n.x * (NW+GAPX);
  const py = n => 10 + n.d * (NH+GAPY);

  let edges = "", boxes = "";
  const walk = (n) => {
    const ch = kids.get(n.key) || [];
    for(const c of ch){
      const x1 = px(n)+NW/2, y1 = py(n)+NH, x2 = px(c)+NW/2, y2 = py(c);
      const mid = y1 + GAPY/2;
      edges += `<path d="M${x1} ${y1} V${mid} H${x2} V${y2}" fill="none"
        stroke="var(--rule)" stroke-width="1.6"/>`;
      walk(c);
    }
    boxes += box(n);
  };

  function box(n){
    const x = px(n), y = py(n);
    if(n.kind==="ghost")
      return `<g><rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="9"
        fill="#F2F2EE" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="${x+12}" y="${y+30}" font-size="13" font-weight="700" fill="#5A574E">${
          esc((n.label||"Unknown").slice(0,22))}</text>
        <text x="${x+12}" y="${y+50}" font-size="11" fill="#5A574E">not in the herd</text></g>`;
    if(n.kind==="pending")
      return `<g><rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="9"
        fill="#FFF" stroke="#8F5A0C" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="${x+12}" y="${y+30}" font-size="13" font-weight="700" fill="#8F5A0C">Due ${fmt(n.label)}</text>
        <text x="${x+12}" y="${y+50}" font-size="11" fill="#5A574E">${esc(n.sire||n.season||"")}</text></g>`;

    const a = n.animal, on = match(a), col = tagColour(a.year_letter, speciesOf(a));
    const gone = !isActive(a);
    const dim = on ? (gone ? .72 : 1) : .28;
    return `<g class="tnode" data-id="${a.id}" opacity="${dim}">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="9" fill="#FFF"
        stroke="${on?col:"var(--rule)"}" stroke-width="${on?2.2:1.4}"
        stroke-dasharray="${gone?"5 3":"none"}"/>
      <rect x="${x}" y="${y}" width="7" height="${NH}" rx="3.5" fill="${col}"/>
      <text x="${x+16}" y="${y+21}" font-size="14" font-weight="700"
        font-family="ui-monospace,Menlo,monospace" fill="#16150F">${esc((a.stock_code||a.year_letter) ? codeOf(a) : "untagged")}</text>
      <text x="${x+16}" y="${y+38}" font-size="12" fill="#16150F">${esc((a.name||"").slice(0,20))}</text>
      <text x="${x+16}" y="${y+55}" font-size="10.5" fill="#5A574E">${
        sexMark(a)} ${esc(age(a.age_years))}</text>
      <text x="${x+16}" y="${y+69}" font-size="10.5" fill="${a.sire_name?"#5A574E":"#A8A49A"}">♂ ${
        esc((a.sire_name||"not recorded").slice(0,22))}</text>
      <text x="${x+16}" y="${y+82}" font-size="10.5" fill="${(a.dam_code||a.dam_name)?"#5A574E":"#A8A49A"}">♀ ${
        esc((a.dam_code||a.dam_name||"not recorded").slice(0,22))}</text>
    </g>`;
  }
  roots.forEach(walk);

  const wrap = el(`<div></div>`);
  const box2 = el(`<div class="treewrap">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Herd family tree">${edges}${boxes}</svg></div>`);
  box2.querySelectorAll(".tnode").forEach(g => {
    g.onclick = () => { S.sel = g.dataset.id; S.view="detail"; render(); };
  });
  wrap.appendChild(box2);

  const inTree = [];
  const collect = n => { if(n.kind==="animal") inTree.push(n.animal);
                         (kids.get(n.key)||[]).forEach(collect); };
  roots.forEach(collect);
  const hits = inTree.filter(match).length;
  wrap.appendChild(el(`<p class="hint" style="padding:11px 14px 14px">
    Descent follows the ${treeLink()}; both parents are named on each animal.
    Dashed grey is a ${wl(treeLink()==="sire" ? "sire" : "dam", treeSpecies())} that was never
    on the place${S.treePend && treeLink()==="dam" ? `, amber is a ${wl("birth", treeSpecies())} still to come` : ""}.
    Filters dim rather than hide, so the line stays whole — ${hits} of ${inTree.length} shown here match.${
    W > 400 ? " Scroll sideways for the rest." : ""}</p>`));
  return wrap;
}

// ─── map ────────────────────────────────────────────────────────
// Renders the saved boundaries as flat SVG. No tile server, no map
// library — the expensive part was done once in the editor.
function viewMap(){
  const wrap = el(`<div></div>`);
  const spBar = speciesBar();
  if(spBar) wrap.appendChild(spBar);

  const drawn = S.paddocks.filter(p => p.geometry?.coordinates?.[0]?.length > 2);

  if(!drawn.length){
    wrap.appendChild(el(`<div class="empty"><b>No boundaries yet</b>
      Trace your fence lines in the paddock editor on a laptop, then they'll show up here.</div>`));
    return wrap;
  }

  // Equirectangular with a cos(lat) correction — at paddock scale the
  // distortion is far below what you could see on a phone.
  let minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9;
  const mid = drawn[0].geometry.coordinates[0][0][1] * Math.PI/180;
  const k = Math.cos(mid);
  const proj = ([lng,lat]) => [lng*k, -lat];
  for(const p of drawn) for(const c of p.geometry.coordinates[0]){
    const [x,y] = proj(c);
    minX=Math.min(minX,x); maxX=Math.max(maxX,x);
    minY=Math.min(minY,y); maxY=Math.max(maxY,y);
  }
  const pad = Math.max(maxX-minX, maxY-minY) * 0.05 || 0.0001;
  minX-=pad; maxX+=pad; minY-=pad; maxY+=pad;
  const W = 1000, H = Math.round(W * (maxY-minY)/(maxX-minX)) || 600;
  const sx = v => (v-minX)/(maxX-minX)*W;
  const sy = v => (v-minY)/(maxY-minY)*H;
  // Labels scale with the viewBox so they stay legible however the
  // box is squeezed.
  const fs = Math.max(18, Math.round(Math.max(W,H)/34));

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
    role="img" aria-label="Paddock map">`;
  for(const p of drawn){
    const pts = p.geometry.coordinates[0]
      .map(c => { const [x,y]=proj(c); return `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`; }).join(" ");
    const on = S.selPk===p.id, any = !!S.selPk;
    svg += `<polygon data-id="${p.id}" points="${pts}" fill="${esc(p.colour)}"
      fill-opacity="${on ? .66 : any ? .12 : (headIn(p.id) ? .42 : .16)}"
      stroke="${esc(p.colour)}" stroke-width="${on?6:2.5}"
      stroke-opacity="${any && !on ? .4 : 1}"
      stroke-linejoin="round" style="cursor:pointer"></polygon>`;
  }
  // ── labels ────────────────────────────────────────────────────
  // Three problems with dropping a label at the middle of a paddock:
  // the vertex mean is not the middle of a concave shape, a big label
  // on a small paddock reads as belonging to its neighbour, and
  // adjacent paddocks collide. Handled in that order.

  // Area centroid, not the mean of the corners — a fence line traced
  // with forty points down one side drags the mean towards it.
  const centroid = ring => {
    let a = 0, cx = 0, cy = 0;
    for(let i = 0; i < ring.length - 1; i++){
      const [x0,y0] = ring[i], [x1,y1] = ring[i+1];
      const f = x0*y1 - x1*y0;
      a += f; cx += (x0+x1)*f; cy += (y0+y1)*f;
    }
    if(Math.abs(a) < 1e-12){
      const n = ring.length;
      return [ring.reduce((s,r)=>s+r[0],0)/n, ring.reduce((s,r)=>s+r[1],0)/n];
    }
    return [cx/(3*a), cy/(3*a)];
  };

  const labels = drawn.map(p => {
    const ring = p.geometry.coordinates[0].map(proj);
    const [gx, gy] = centroid(ring);
    const xs = ring.map(r => sx(r[0])), ys = ring.map(r => sy(r[1]));
    const box = Math.min(Math.max(...xs) - Math.min(...xs),
                         Math.max(...ys) - Math.min(...ys));
    // A label should not be wider than the paddock it names.
    const size = Math.max(fs * 0.5, Math.min(fs, box * 0.42));
    // Every paddock on a paddock map is a paddock. Dropping the word
    // takes a third off the longest names, which is worth more than
    // the word ever was. The list and the card still say it in full.
    const text = p.code || p.name.replace(/\s*paddock\s*$/i, "") || p.name;
    const hd   = headIn(p.id);
    return { p, text, hd, size,
             x: sx(gx), y: sy(gy), y0: sy(gy),
             w: text.length * size * 0.54,
             h: size * (hd ? 2.1 : 1.15) };
  });

  // Push overlapping labels apart vertically. A dozen passes settles
  // this map; it stops early once nothing moves.
  for(let pass = 0; pass < 24; pass++){
    let moved = false;
    for(let i = 0; i < labels.length; i++){
      for(let j = i + 1; j < labels.length; j++){
        const A = labels[i], B = labels[j];
        const ox = (A.w + B.w)/2 - Math.abs(A.x - B.x);
        const oy = (A.h + B.h)/2 - Math.abs(A.y - B.y);
        if(ox <= 0 || oy <= 0) continue;
        const step = Math.min(oy, fs * 0.6) / 2 + 0.5;
        if(A.y <= B.y){ A.y -= step; B.y += step; } else { A.y += step; B.y -= step; }
        moved = true;
      }
    }
    if(!moved) break;
  }

  for(const L of labels){
    const fade = S.selPk && S.selPk !== L.p.id ? .45 : 1;
    // If a label had to move far enough that it no longer sits over
    // its own paddock, draw the thread back to where it belongs.
    if(Math.abs(L.y - L.y0) > L.size * 0.9)
      svg += `<line x1="${L.x.toFixed(1)}" y1="${(L.y + L.size*0.3).toFixed(1)}"
        x2="${L.x.toFixed(1)}" y2="${L.y0.toFixed(1)}" stroke="#16150F"
        stroke-width="${(fs/12).toFixed(1)}" stroke-opacity="${fade * .45}"
        style="pointer-events:none"></line>`;
    svg += `<text x="${L.x.toFixed(1)}" y="${L.y.toFixed(1)}" text-anchor="middle" opacity="${fade}"
      font-size="${L.size.toFixed(1)}" font-weight="700" fill="#16150F" paint-order="stroke"
      stroke="#fff" stroke-width="${(L.size/5).toFixed(1)}"
      style="pointer-events:none">${esc(L.text)}</text>`;
    if(L.hd) svg += `<text x="${L.x.toFixed(1)}" y="${(L.y + L.size*1.05).toFixed(1)}"
      text-anchor="middle" opacity="${fade}" font-size="${(L.size*0.8).toFixed(1)}"
      font-weight="600" fill="#16150F" paint-order="stroke" stroke="#fff"
      stroke-width="${(L.size/6).toFixed(1)}" style="pointer-events:none">${L.hd} hd</text>`;
  }
  svg += `</svg>`;

  const layout = el(`<div class="maplayout"></div>`);
  const mapPane  = el(`<div class="mappane"></div>`);
  const listPane = el(`<div class="listpane"></div>`);
  layout.append(mapPane, listPane);
  wrap.appendChild(layout);

  const box = el(`<div class="mapbox">${svg}${
    S.selPk ? "" : `<div class="maphint">Tap a paddock</div>`}</div>`);
  box.querySelectorAll("polygon").forEach(poly => {
    poly.onclick = () => { S.selPk = S.selPk===poly.dataset.id ? null : poly.dataset.id; render(); };
  });
  mapPane.appendChild(box);

  const sel = S.paddocks.find(p => p.id===S.selPk);

  // Selected paddock: everything about it, and the two things you'd
  // want to do next, right under the map rather than a scroll away.
  if(sel){
    const inIt = S.animals.filter(a => isActive(a) && inSpecies(a) && a.paddock_id===sel.id);
    // Recomputed rather than read off the view, for the same reason.
    const perHa = sel.area_ha > 0 ? (inIt.length / sel.area_ha).toFixed(2) : null;
    const card = el(`<div class="pkcard">
      <div class="top">
        <span class="dot" style="background:${esc(sel.colour)};width:15px;height:15px"></span>
        <span class="nm">${esc(sel.name)}</span>
        <button class="close" aria-label="Clear selection">×</button>
      </div>
      <div class="pkstats">
        <span><b>${inIt.length}</b> head</span>
        <span><b>${sel.area_ha??"—"}</b> ha</span>
        ${perHa?`<span><b>${perHa}</b> /ha</span>`:""}
        ${sel.grazing_since?`<span>grazing since <b>${fmt(sel.grazing_since)}</b></span>`:""}
      </div>
      ${canWrite() ? `<div class="pkacts">
        <button class="pri" data-a="move">Move stock here</button>
        <button data-a="feed">Feed out here</button></div>` : ""}
    </div>`);
    card.querySelector(".close").onclick = () => { S.selPk=null; render(); };
    card.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      S.view = b.dataset.a==="move" ? "rec:move" : "rec:feed"; render();
    });
    listPane.appendChild(card);

    if(!inIt.length){
      listPane.appendChild(el(`<div class="empty" style="padding:26px 24px">
        <b>${S.species==="all" ? "Empty" : "None here"}</b>${
          S.species==="all" ? `Nothing in ${esc(sel.name)} at the moment.`
                            : `No ${esc(S.species)} in ${esc(sel.name)} at the moment.`}</div>`));
    } else {
      const ul = el(`<ul class="rows"></ul>`);
      for(const a of inIt){
        const li = el(`<li><button class="row">${tagHTML(codeOf(a), "sm", speciesOf(a))}
          <span class="meta"><span class="nm">${esc(a.name||"Unnamed")}</span>
          <span class="sub">${esc(a.class||"")} · in since ${fmt(a.in_paddock_since)}</span></span>
          <span class="rt">${age(a.age_years)}</span></button></li>`);
        li.querySelector("button").onclick = () => { S.sel=a.id; S.view="detail"; render(); };
        ul.appendChild(li);
      }
      listPane.appendChild(ul);
    }
    return wrap;
  }

  // Nothing selected: the paddocks as a list, so you can pick either way.
  const ul = el(`<ul class="rows"></ul>`);
  for(const p of S.paddocks){
    const li = el(`<li><button class="row">
      <span class="dot" style="background:${esc(p.colour)};width:14px;height:14px"></span>
      <span class="meta"><span class="nm">${esc(p.name)}</span>
      <span class="sub">${p.area_ha??"—"} ha${
        p.grazing_since?` · grazing since ${fmt(p.grazing_since)}`:" · empty"}</span></span>
      <span class="rt">${headIn(p.id)} hd</span></button></li>`);
    li.querySelector("button").onclick = () => { S.selPk=p.id; render(); };
    ul.appendChild(li);
  }
  listPane.appendChild(ul);

  const unplaced = S.animals.filter(a => !a.paddock_id && isActive(a));
  if(unplaced.length){
    const n = el(`<div class="pad"><button class="btn ghost">${unplaced.length} head not in a paddock</button></div>`);
    n.querySelector("button").onclick = () => { S.herdMode="paddock"; S.filter="pk:none"; S.view="herd"; render(); };
    listPane.appendChild(n);
  }
  return wrap;
}

// ─── recording ──────────────────────────────────────────────────
function viewRecord(){
  const wrap = el(`<div></div>`);
  const spBar = speciesBar();
  if(spBar) wrap.appendChild(spBar);
  if(!canWrite()){
    wrap.appendChild(el(`<div class="empty"><b>Read-only access</b>
      You can look at everything, but recording needs manager access. Ask an owner to change your role.</div>`));
    return wrap;
  }
  const group = (title, kinds) => {
    wrap.appendChild(el(`<h3 class="sec">${title}</h3>`));
    const ul = el(`<ul class="rows menu"></ul>`);
    for(const [k,t,sub] of kinds){
      const li = el(`<li><button class="row"><span class="meta">
        <span class="nm">${t}</span><span class="sub">${sub}</span></span>
        <span class="rt">›</span></button></li>`);
      li.querySelector("button").onclick = () => { S.view="rec:"+k; render(); };
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
  };
  // Shearing is sheep work. On a cattle-only place the entry would be
  // dead weight in a menu that is meant to be short.
  const jobs = [
    ["feed","Feed out","Hay or grain to a paddock"],
    ["move","Move mob","Shift stock to another paddock"],
    ["weight","Weights","Scale or tape, one or many head"],
    ["treatment","Treatment","Vaccination, drench — full LPA detail"],
    ["spray","Spraying","Chemical onto a paddock — LPA 3B"],
    ["joining","Joining","Mating, pregnancy test, empty result"],
    ["calving", w("birth"), `A ${wl("young")} on the ground${
      hasSpecies("sheep") ? ` — by ${wl("dam")}, or by paddock` : ""}`],
    ["sell","Sell / consign","NVD, waybill, off the property"]];
  if(hasSpecies("sheep"))
    jobs.splice(jobs.findIndex(j => j[0] === "calving"), 0,
                ["shearing","Shed work","Shearing, crutching, marking"]);
  group("What are you recording?", jobs);
  const low = S.feeds.filter(f => f.pct_left != null && f.pct_left <= 20).length;
  // Only offered once there is something in the flasks.
  const lots = (S.refs.semen||[]).length + (S.refs.embryo||[]).length;
  if(lots) group("The flasks", [
    ["cryo","Tank store", `${lots} lots · ${
      Math.round((S.refs.semen||[]).reduce((n,x)=>n+Number(x.straws_left||0),0) +
                 (S.refs.embryo||[]).reduce((n,x)=>n+Number(x.units_left||0),0))} units on hand`],
    ["cryomove","Straw or embryo movement","In, out, thawed, discarded"]]);

  const untagged = untaggedHere().length;
  group("Manage", [
    ...(untagged ? [["tagdrop","Tag the drop", `${untagged} without a number yet`]] : []),
    ["store","Feed store", low ? `${low} low on stock` : `${S.feeds.length} in the shed`],
    ["bulk","Bulk update","Change a field across many animals"],
    ["settings","Which fields to show","Turn animal details on or off"]]);

  wrap.appendChild(el(`<h3 class="sec">On a laptop</h3>`));
  const ul2 = el(`<ul class="rows menu"></ul>`);
  for(const [href,t,sub] of [
      ["/reports","Records & reports","LPA treatments, feed, movements — printable"],
      ["/map","Paddock editor","Trace fence lines on satellite imagery"]]){
    const li = el(`<li><a class="row" href="${href}" target="_blank" rel="noopener"
      style="text-decoration:none;color:inherit">
      <span class="meta"><span class="nm">${t}</span><span class="sub">${sub}</span></span>
      <span class="rt">↗</span></a></li>`);
    ul2.appendChild(li);
  }
  wrap.appendChild(ul2);
  wrap.appendChild(el(`<p class="hint" style="padding:8px 14px 14px">These open in a new tab.
    They work on a phone but want a big screen.</p>`));
  return wrap;
}

function animalPicker(multi=true, preset=[]){
  const chosen = new Set(preset);
  const box = el(`<div class="picker"></div>`);
  // Recording against the wrong species is a whole class of mistake
  // that simply can't be made if it isn't on the screen.
  const list = S.animals.filter(a => isActive(a) && inSpecies(a));
  box.list = list;
  for(const a of list){
    const b = el(`<button type="button" class="pick" aria-pressed="${chosen.has(a.id)}"
      title="${esc(a.name||"")}">${tagHTML(codeOf(a), "sm", speciesOf(a))}</button>`);
    b.onclick = () => {
      if(!multi){ chosen.clear(); box.querySelectorAll(".pick").forEach(x => x.setAttribute("aria-pressed","false")); }
      chosen.has(a.id) ? chosen.delete(a.id) : chosen.add(a.id);
      b.setAttribute("aria-pressed", chosen.has(a.id));
      box.dispatchEvent(new CustomEvent("pick",{detail:chosen.size}));
    };
    box.appendChild(b);
  }
  box.chosen = chosen;
  return box;
}

function say(node, kind, text){
  node.querySelectorAll(".msg").forEach(m => m.remove());
  node.prepend(el(`<div class="msg ${kind}">${esc(text)}</div>`));
  node.scrollIntoView({block:"start",behavior:"smooth"});
}

function formShell(title, inner, onSave){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h3 class="sec">${title}</h3>`));
  // Put it above the form rather than in each one: every form that
  // picks animals needs it, and changing scope mid-form should be
  // possible without backing out to the herd screen.
  const spBar = speciesBar();
  if(spBar) wrap.appendChild(spBar);
  const form = el(`<form></form>`);
  form.appendChild(inner);
  const save = el(`<button type="submit" class="btn">Save</button>`);
  form.appendChild(save);
  const cancel = el(`<button type="button" class="btn ghost">Cancel</button>`);
  // Closing a season is reached from Due, so it goes back there.
  const home = () => S.view === "rec:closedue" ? "due" : (S.sel ? "detail" : "record");
  cancel.onclick = () => { S.view = home(); render(); };
  form.appendChild(cancel);
  form.onsubmit = async (e) => {
    e.preventDefault();
    if(S.busy) return;
    S.busy = true; save.disabled = true; save.textContent = "Saving…";
    try{
      const n = await onSave(new FormData(form));
      say(wrap,"ok", n);
      form.reset();
      await Promise.all([loadHerd(), loadPaddocks()]);
      setTimeout(() => {
        if(!["detail","record","rec:store"].includes(S.view))
          S.view = S.view.startsWith("rec:stock") || S.view==="rec:newfeed"
            ? "rec:store" : home();
        render();
      }, 900);
    }catch(err){
      say(wrap,"err", err.message || "Could not save. Check your connection and try again.");
      S.busy=false; save.disabled=false; save.textContent="Save";
    }
  };
  wrap.appendChild(form);
  return wrap;
}

function recWeight(){
  const inner = el(`<div>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Weight (kg)</span><input type="number" name="kg" step="0.5" min="1" inputmode="decimal" required></label>
    <label><span>Method</span><select name="method">
      <option value="scale">Scale</option><option value="tape">Tape</option><option value="estimate">Estimate</option>
    </select></label>
    <label><span>Animal</span></label></div>`);
  const pick = animalPicker(false, S.sel?[S.sel]:[]);
  inner.appendChild(pick);
  inner.appendChild(el(`<p class="hint">Tap a tag to choose the animal.</p>`));

  // Weighing is the one time you have her in the crush and are actually
  // looking at her. Whatever you notice then wants writing down before
  // she's let out, not remembered until later.
  const extra = el(`<div></div>`);
  inner.appendChild(extra);
  const fillExtra = () => {
    const a = S.animals.find(x => x.id === [...pick.chosen][0]);
    extra.replaceChildren();
    if(!a) return;
    const box = el(`<div>
      <h3 class="sec" style="padding-left:0">${esc(codeOf(a))}</h3>
      <label><span>Notes</span><textarea name="notes" rows="2"
        placeholder="Anything you noticed">${esc(a.notes||"")}</textarea></label>
      <p class="hint">Her notes as they stand — edit or add to them. Saved with the
        weight, and the change is logged like any other correction.</p>
      <button type="button" class="btn ghost" id="edit-a">Edit ${esc(codeOf(a))}'s details</button>
    </div>`);
    box.querySelector("#edit-a").onclick = () => {
      // Leaving here loses a typed weight, so say so rather than
      // discovering it on the way back.
      if(inner.querySelector('[name=kg]').value &&
         !confirm(`The weight for ${codeOf(a)} hasn't been saved yet.\n\n`
                + `Go to her details anyway? The weight will be lost.`)) return;
      S.sel = a.id; S.view = "editAnimal"; render();
    };
    extra.appendChild(box);
  };
  pick.addEventListener("pick", fillExtra);
  fillExtra();

  return formShell("Record a weight", inner, async (f) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose an animal first.");
    const { error } = await db.from("weight_event").insert({
      animal_id: ids[0], weighed_on: f.get("on"),
      weight_kg: Number(f.get("kg")), method: f.get("method")
    });
    if(error) throw new Error(error.code==="23505" ? "That animal already has a weight on that date." : error.message);

    const a = S.animals.find(x => x.id===ids[0]);
    const now = (f.get("notes") ?? "").trim(), was = (a?.notes || "").trim();
    if(now === was) return "Weight saved.";
    const { error:e2 } = await db.from("animal").update({notes: now || null}).eq("id", ids[0]);
    if(e2) throw new Error(`Weight saved, but the note didn't: ${e2.message}`);
    return `Weight and note saved for ${a ? codeOf(a) : "the animal"}.`;
  });
}

function recTreatment(){
  const inner = el(`<div>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Product</span><input type="text" name="product" placeholder="e.g. Dectomax pour-on" required></label>
    <div class="two">
      <label><span>Batch no.</span><input type="text" name="batch" inputmode="text"></label>
      <label><span>Product expiry</span><input type="date" name="expiry"></label>
    </div>
    <label><span>Dose rate</span><input type="text" name="dose" placeholder="1 mL / 10 kg"></label>
    <div class="two">
      <label><span>Withholding (days)</span><input type="number" name="whp" min="0" inputmode="numeric"></label>
      <label><span>ESI (days)</span><input type="number" name="esi" min="0" inputmode="numeric"></label>
    </div>
    <label><span>Where / which mob</span><input type="text" name="desc" placeholder="Back gully, breeders"></label>
    <label><span>Adverse reactions</span><input type="text" name="adverse" placeholder="Nil noted"></label>
    <label style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <input type="checkbox" name="needle" style="width:22px;height:22px;min-height:0;flex:none">
      <span style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--ink)">Broken needle left in an animal</span>
    </label>
    <div class="note"><b>LPA Section 2.</b> Batch number, expiry, dose rate and withholding period are
      required on your records. Your name and phone are filled in from your login.</div>
    <label><span>Animals treated</span></label></div>`);
  const pick = animalPicker(true, S.sel?[S.sel]:[]);
  inner.appendChild(pick);
  const count = el(`<p class="hint">No animals selected.</p>`);
  pick.addEventListener("pick", e => count.textContent = e.detail===1 ? "1 head selected." : `${e.detail} head selected.`);
  if(S.sel) count.textContent = "1 head selected.";
  inner.appendChild(count);

  return formShell("Record a treatment", inner, async (f) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose at least one animal.");
    const { data, error } = await db.from("treatment").insert({
      treated_on:f.get("on"), product_name:f.get("product"),
      batch_number:f.get("batch")||null, product_expiry:f.get("expiry")||null,
      dose_rate:f.get("dose")||null,
      withholding_days:f.get("whp")?Number(f.get("whp")):null,
      esi_days:f.get("esi")?Number(f.get("esi")):null,
      description:f.get("desc")||null, adverse_reaction:f.get("adverse")||null,
      broken_needle: f.get("needle")==="on"
    }).select("id").single();
    if(error) throw error;
    const { error:e2 } = await db.from("treatment_animal")
      .insert(ids.map(id => ({treatment_id:data.id, animal_id:id})));
    if(e2) throw e2;
    return `Treatment saved for ${ids.length} head.`;
  });
}

// ─── joining ────────────────────────────────────────────────────
// Two different events wearing one word. AI is one cow, one straw,
// one day. A bull out is one bull and whoever is standing in the
// paddock, over weeks. Recording them through the same form made
// the bull-out case a typing exercise and the AI case vague about
// which straw was used.
const GEST_DEFAULT = 285;
const gestFor = a => Number(a?.gestation_days)
  || GEST_BY_SPECIES[speciesOf(a)] || GEST_DEFAULT;
const addDays = (iso, n) => {
  // Anchored at UTC midnight and stepped in UTC, so it is plain date
  // arithmetic with no zone in it. Mixing a UTC parse with local
  // getDate() happened to work here only because we are ahead of UTC.
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
};
const seasonNow = () => { const y = new Date().getFullYear(); return `${y}-${y+1}`; };

// Shared tail: season, cycle, attempt. Nothing about the result —
// at the moment of joining there isn't one, and pretending otherwise
// puts a default on file that reads like a finding.
const joinCommon = () => `
  <div class="two">
    <label><span>Season</span><input type="text" name="season" value="${seasonNow()}" required></label>
    <label><span>Cycle</span><select name="cycle">
      <option value="spring">Spring</option><option value="autumn">Autumn</option></select></label>
  </div>
  <label><span>Attempt</span><select name="attempt">
    <option value="1">First join</option><option value="2">Second join</option>
    <option value="3">Third join</option></select></label>`;
