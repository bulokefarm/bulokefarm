    </select></label>

    <div id="newfeed" hidden style="border:1px solid var(--rule);border-radius:11px;padding:2px 12px 12px;margin-top:6px">
      <label><span>What is it</span><input type="text" name="nf_name" placeholder="Lucerne hay, round"></label>
      <label><span>Type</span><select name="nf_type">
        <option value="fodder">Fodder — hay, silage, straw</option>
        <option value="grain">Grain</option><option value="pellet">Pellets</option>
        <option value="supplement">Supplement</option><option value="mineral">Mineral</option>
      </select></label>
      <div class="two">
        <label><span>How much</span><input type="number" name="nf_qty" step="0.1" min="0" inputmode="decimal" placeholder="40"></label>
        <label><span>Unit</span><select name="nf_unit">
          <option>rolls</option><option>bales</option><option>tonnes</option>
          <option>kg</option><option>litres</option></select></label>
      </div>
      <label><span>Batch, silo or cut</span><input type="text" name="nf_batch" placeholder="Home cut, river paddock"></label>
      <label style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <input type="checkbox" name="nf_home" style="width:22px;height:22px;min-height:0;flex:none" checked>
        <span style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--ink)">Home grown</span>
      </label>
      <label><span>Bought from / origin</span><input type="text" name="nf_origin" placeholder="Only if bought in"></label>
      <p class="hint">Straight fodder is recorded as free of restricted animal material.
        Change it on the report if that isn't right for this load.</p>
    </div>

    <label id="l-other" hidden><span>What did you feed</span>
      <input type="text" name="ration" placeholder="Lucerne hay"></label>
    <label><span>How much did you put out</span>
      <input type="number" name="qty" step="0.1" min="0" inputmode="decimal" placeholder="2"></label>
    <label><span>Method</span><select name="method">
      <option>Rolled out</option><option>Ring feeder</option>
      <option>Self feeder</option><option>Trough</option><option>Bale in paddock</option>
    </select></label>
    <label class="chk"><input type="checkbox" name="is_run">
      <span>They stay on this — count their days on feed</span></label>
    <p class="hint">Tick for a self feeder or any ration they stay on. Leave it for a
      one-off drop like rolling out a bale: that still counts against the store and
      still shows in Section 3C, it just doesn't start a days-on-feed clock.</p>
    <label><span>Notes</span><input type="text" name="notes" placeholder="Optional"></label>
    <div class="note">Who ate it is worked out from what's in the paddock that day —
      no need to pick animals.</div>
  </div>`);

  const sel   = inner.querySelector('[name=source]'),
        other = inner.querySelector('#l-other'),
        nf    = inner.querySelector('#newfeed');
  const sync = () => {
    nf.hidden    = sel.value !== "__new";
    other.hidden = sel.value !== "";
  };
  sel.onchange = sync;
  // A self feeder is the ordinary case for a run, so the box follows the
  // method rather than making it a second thing to remember. Still a
  // checkbox, because "ad lib in a trough" is a run too and the method
  // list can't know that.
  const mSel = inner.querySelector('[name="method"]'),
        runBox = inner.querySelector('[name="is_run"]');
  mSel.onchange = () => { runBox.checked = /self feeder/i.test(mSel.value); };
  if(!S.feeds.length) sel.value = "__new";
  sync();

  return formShell("Feed out", inner, async (f) => {
    if(!f.get("paddock")) throw new Error("Choose a paddock.");
    let src = f.get("source") || null;
    const ration = (f.get("ration")||"").trim();

    if(src === "__new"){
      const name = (f.get("nf_name")||"").trim();
      if(!name) throw new Error("Give the new feed a name.");
      const type = f.get("nf_type");
      const { data, error } = await db.from("feed_source").insert({
        feedstuff: name, feed_type: type,
        quantity: f.get("nf_qty") ? Number(f.get("nf_qty")) : null,
        unit: f.get("nf_unit") || null,
        batch_ref: (f.get("nf_batch")||"").trim() || null,
        home_grown: f.get("nf_home") === "on",
        origin: (f.get("nf_origin")||"").trim() || null,
        ram_free: type === "fodder" ? true : null,
        received_on: f.get("on")
      }).select("id").single();
      if(error) throw error;
      src = data.id;
    }
    if(!src && !ration) throw new Error("Say what you fed.");

    const { error } = await db.from("feed_event").insert({
      fed_on: f.get("on"), paddock_id: f.get("paddock"),
      feed_source_id: src, ration: src ? null : ration,
      qty: f.get("qty") ? Number(f.get("qty")) : null,
      method: f.get("method")||null, notes: f.get("notes")||null,
      is_run: f.get("is_run") === "on"
    });
    if(error) throw error;
    const p = S.paddocks.find(x => x.id===f.get("paddock"));
    const n = p ? headIn(p.id) : 0;
    return `Feed recorded for ${p?.name||"the paddock"}${n?` — ${n} head`:""}.`;
  });
}

function recMove(){
  if(!S.paddocks.length){
    const empty = el(`<div class="empty"><b>No paddocks yet</b>
      Draw your fence lines in the paddock editor first.</div>`);
    return empty;
  }
  const inner = el(`<div>
    <label><span>Moving to</span><select name="to" required>
      <option value="">Choose a paddock…</option>
      ${S.paddocks.map(p => `<option value="${p.id}"${S.selPk===p.id?" selected":""}>${
        esc(p.name)} — ${p.area_ha??"?"} ha, ${headIn(p.id)} head</option>`).join("")}
    </select></label>
    <label><span>Date</span><input type="date" name="on" value="${today()}" required></label>
    <label><span>Reason</span><input type="text" name="reason" placeholder="Rotation, feed, calving"></label>
    <label><span>Which animals</span></label></div>`);

  const pick = animalPicker(true, S.sel?[S.sel]:[]);
  const setAll = (ids, on) => {
    pick.querySelectorAll(".pick").forEach((b,i) => {
      const a = pick.list[i];
      if(b.hidden || !ids.includes(a.id)) return;
      on ? pick.chosen.add(a.id) : pick.chosen.delete(a.id);
      b.setAttribute("aria-pressed", on);
    });
    pick.dispatchEvent(new CustomEvent("pick",{detail:pick.chosen.size}));
  };

  // Mobs move together, so bulk selection is the common case, not the exception.
  const quick = el(`<div class="chips" style="padding:8px 0 2px"></div>`);
  const groups = [["Everything", () => S.animals.filter(isActive).map(a=>a.id)],
                  ["Unassigned", () => S.animals.filter(a=>isActive(a)&&!a.paddock_id).map(a=>a.id)],
                  ["None", () => []]];
  for(const p of S.paddocks.filter(p=>headIn(p.id)))
    groups.splice(2, 0, [`All in ${p.name}`, () => S.animals.filter(a=>a.paddock_id===p.id).map(a=>a.id), p.id]);
  for(const [label, fn, pid] of groups){
    const b = el(`<button type="button" class="chip"${pid?` data-pid="${pid}"`:""}>${esc(label)}</button>`);
    b.onclick = () => {
      if(label==="None"){ setAll(S.animals.map(a=>a.id), false); return; }
      setAll(S.animals.map(a=>a.id), false); setAll(fn(), true);
    };
    quick.appendChild(b);
  }
  inner.appendChild(quick);
  inner.appendChild(pick);
  const already = el(`<p class="hint"></p>`);
  inner.appendChild(already);
  const count = el(`<p class="hint">${S.sel?"1 head selected.":"No animals selected."}</p>`);
  pick.addEventListener("pick", e => count.textContent =
    !e.detail ? "No animals selected." : e.detail===1 ? "1 head selected." : `${e.detail} head selected.`);
  inner.appendChild(count);

  // An animal already standing in the destination has nowhere to go, so it
  // isn't offered — and its chip would select nothing. Follows the select,
  // not just the paddock the map handed us, since the destination can change.
  const to = inner.querySelector('select[name="to"]');
  const applyDest = () => {
    const pid = to.value; let n = 0;
    pick.querySelectorAll(".pick").forEach((b,i) => {
      const here = !!pid && pick.list[i].paddock_id===pid;
      b.hidden = here;
      if(here && pick.chosen.delete(pick.list[i].id)) b.setAttribute("aria-pressed","false");
      if(here) n++;
    });
    quick.querySelectorAll("[data-pid]").forEach(b => b.hidden = b.dataset.pid===pid);
    already.textContent = n ? `${n} already in ${S.paddocks.find(p=>p.id===pid)?.name||"this paddock"}.` : "";
    pick.dispatchEvent(new CustomEvent("pick",{detail:pick.chosen.size}));
  };
  to.onchange = applyDest;
  applyDest();

  return formShell("Move stock", inner, async (f) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose at least one animal.");
    if(!f.get("to"))  throw new Error("Choose a paddock to move them to.");
    const args = {
      p_animal_ids: ids, p_paddock_id: f.get("to"),
      p_on: f.get("on"), p_reason: f.get("reason") || null,
      p_ignore_withhold: false
    };
    let { error } = await db.rpc("move_animals", args);

    // BF001 is the spray grazing withhold. It is a question, not a
    // wall — there are good reasons to put stock on treated ground and
    // the database should not pretend otherwise. Saying yes is recorded
    // on the stay, so the decision stays visible afterwards.
    if(error && error.code === "BF001"){
      if(!confirm(`${error.message}\n\nMove them anyway? This is noted on the record.`))
        throw new Error("Move cancelled — they stay where they are.");
      ({ error } = await db.rpc("move_animals", { ...args, p_ignore_withhold: true }));
    }
    if(error) throw error;
    const name = S.paddocks.find(p => p.id===f.get("to"))?.name || "the paddock";
    return `${ids.length} head moved to ${name}.`;
  });
}

// ─── shared field input ─────────────────────────────────────────
function fieldInput(f, value, prefix=""){
  const [k,label,type] = f, n = prefix+k, v = value;
  if(type==="bool")
    return `<label><span>${label}</span><select name="${n}">
      <option value="">—</option>
      <option value="1"${v===true?" selected":""}>Yes</option>
      <option value="0"${v===false?" selected":""}>No</option></select></label>`;
  if(type.startsWith("pick:"))
    return `<label><span>${label}</span><select name="${n}"><option value="">—</option>
      ${type.slice(5).split("|").map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}
    </select></label>`;
  if(type.startsWith("ref:")){
    const list = S.refs[type.slice(4)]||[];
    return `<label><span>${label}</span><select name="${n}"><option value="">—</option>
      ${list.map(o=>`<option value="${o.id}"${v===o.id?" selected":""}>${esc(o.label||o.name)}</option>`).join("")}
    </select></label>`;
  }
  if(type==="area")
    return `<label><span>${label}</span><textarea name="${n}" rows="3">${esc(v||"")}</textarea></label>`;
  const t = type==="number" ? "number" : type==="date" ? "date" : "text";
  return `<label><span>${label}</span><input type="${t}" name="${n}"
    ${type==="number"?'step="0.1" inputmode="decimal"':""} value="${esc(v??"")}"></label>`;
}
function readField(fd, f, prefix=""){
  const [k,,type] = f, raw = fd.get(prefix+k);
  if(raw===null || raw==="") return null;
  if(type==="bool")   return raw==="1";
  if(type==="number") return Number(raw);
  return String(raw).trim() || null;
}

// ─── edit one animal ────────────────────────────────────────────
function editAnimal(){
  const a = S.animals.find(x => x.id===S.sel);
  if(!a) return el(`<div class="empty">Animal not found.</div>`);

  const inner = el(`<div></div>`);
  inner.appendChild(el(`<div class="hero" style="padding:10px 0;border:0">${tagHTML(codeOf(a), "lg", speciesOf(a))}
    <div><h2 style="font-size:18px">${esc(a.name||"Unnamed")}</h2>
    <div class="sub">Only the fields you've switched on are shown.</div></div></div>`));

  const groups = [...new Set(AF.map(f=>f[3]))];
  for(const g of groups){
    const fs = AF.filter(f => f[3]===g && shown(f[0]));
    if(!fs.length) continue;
    inner.appendChild(el(`<h3 class="sec" style="padding-left:0">${g}</h3>`));
    for(const f of fs) inner.appendChild(el(fieldInput(f, a[f[0]])));
  }

  inner.appendChild(el(`<h3 class="sec" style="padding-left:0">Status</h3>`));
  inner.appendChild(el(`<div class="two">
    <label><span>State</span><select name="_life">
      ${["alive","sold","died","slaughtered"].map(o=>`<option ${a.life_state===o?"selected":""}>${o}</option>`).join("")}
    </select></label>
    <label><span>Class</span><select name="_class"><option value="">—</option>
      ${classesFor(speciesOf(a))
        .map(o=>`<option ${a.class===o?"selected":""}>${o}</option>`).join("")}
    </select></label></div>
    <label><span>Date sold, died or left</span><input type="date" name="_on"
      value="${a.exit_on||""}"></label>
    <p class="hint">Changing the state adds a dated transition on this date — the old
      status stays in the animal's history. If the state is already right and only the
      date is wrong, the existing transition is corrected instead of a new one added.</p>`));

  return formShell(`Edit ${codeOf(a)}`, inner, async (fd) => {
    const patch = {};
    for(const f of AF) if(shown(f[0])) patch[f[0]] = readField(fd, f);
    const { error } = await db.from("animal").update(patch).eq("id", a.id);
    if(error) throw new Error(error.code==="23505" ? "Another animal already has that tag." : error.message);

    const life = fd.get("_life"), cls = fd.get("_class")||null;
    const on   = fd.get("_on") || null;
    const left = life !== "alive";

    if(life !== a.life_state || cls !== (a.class||null)){
      // Date the transition the day it happened, not the day it was
      // typed. A sale entered three weeks late belongs in the week it
      // happened or the trading account puts it in the wrong year.
      const { error:e2 } = await db.rpc("set_animal_status", {
        p_animal_ids:[a.id], p_life_state:life, p_class:cls,
        p_on: (left && on) || today(), p_reason:"Edited" });
      if(e2) throw e2;
      S.view = "detail";
      return left && on && on !== today() ? `Saved, dated ${fmt(on)}.` : "Saved.";
    }

    // State unchanged and only the date moved: correct the transition
    // that already exists rather than stacking a second one on top of
    // it. exit_status_id names the exact row, so there's no guessing.
    if(left && on && on !== a.exit_on && a.exit_status_id){
      const { error:e3 } = await db.from("animal_status")
        .update({ effective_on: on }).eq("id", a.exit_status_id);
      if(e3) throw new Error(e3.code === "23505"
        ? `${codeOf(a)} already has a status change recorded on that date.`
        : e3.message);
      S.view = "detail";
      return `Date corrected to ${fmt(on)}.`;
    }

    S.view = "detail";
    return "Saved.";
  });
}

// ─── tag the drop ───────────────────────────────────────────────
// Marking day. Every lamb recorded through the season is on the list
// as "X ?"; this is where the numbers off the tags go on, one row per
// animal by paddock, without opening each one in turn.
const untaggedHere = () => S.animals.filter(a => isActive(a) && !a.stock_code && a.year_letter && inSpecies(a));
function tagDrop(){
  const list = untaggedHere().sort((a,b) =>
    (a.paddock_name||"~").localeCompare(b.paddock_name||"~") || (a.dob||"").localeCompare(b.dob||""));
  if(!list.length) return el(`<div class="empty"><b>Nothing to tag</b>Every animal on the place has a number.</div>`);
  const inner = el(`<div><p class="hint" style="margin-top:0">Untagged stock, by paddock. Type the
    number off the tag as it goes in, and set the sex if it's been checked. Rows left blank are
    untouched.</p></div>`);
  const rows = [];
  let lastPk;
  for(const a of list){
    const pk = a.paddock_name || "Not in a paddock";
    if(pk !== lastPk){
      const n = list.filter(x => (x.paddock_name||"Not in a paddock") === pk).length;
      inner.appendChild(el(`<h3 class="sec" style="padding-left:0">${esc(pk)} — ${n}</h3>`));
      lastPk = pk;
    }
    const sexes = speciesOf(a) === "sheep" ? ["female","male","wether"] : ["female","male","steer"];
    const row = el(`<div style="display:flex;gap:8px;align-items:center;margin:6px 0">
      ${tagHTML(codeOf(a), "sm", speciesOf(a))}
      <span class="sub" style="flex:1;font-size:12px;line-height:1.3">${fmt(a.dob)}${
        a.sire_name ? "<br>by " + esc(a.sire_name) : ""}${a.dam_code ? "<br>out of " + esc(a.dam_code) : ""}</span>
      <input type="number" min="1" max="9999" inputmode="numeric" placeholder="No."
        aria-label="Tag number" style="width:78px;min-height:0;padding:8px">
      <select aria-label="Sex" style="width:100px;min-height:0;padding:8px"><option value="">Sex…</option>${
        sexes.map(x => `<option value="${x}"${a.sex===x?" selected":""}>${x}</option>`).join("")}</select>
    </div>`);
    rows.push({a, num: row.querySelector("input"), sex: row.querySelector("select")});
    inner.appendChild(row);
  }
  const code = r => `${r.a.year_letter} ${r.num.value.trim().padStart(2,"0")}`;
  return formShell("Tag the drop", inner, async () => {
    const todo = rows.filter(r => r.num.value.trim() || (r.sex.value && r.sex.value !== r.a.sex));
    if(!todo.length) throw new Error("No numbers typed in.");
    // A number used twice on the page, or already on an animal, is
    // cheaper to catch here than one row at a time in the database.
    const seen = new Set();
    for(const r of todo){
      if(!r.num.value.trim()) continue;
      const c = code(r);
      if(seen.has(c) || S.animals.some(x => x.stock_code === c && speciesOf(x) === speciesOf(r.a) && x.origin !== "reference"))
        throw new Error(`${c} is typed twice, or is already on an animal.`);
      seen.add(c);
    }
    let done = 0; const failed = [];
    for(const r of todo){
      const patch = {};
      if(r.num.value.trim()) patch.stock_code = code(r);
      if(r.sex.value && r.sex.value !== r.a.sex) patch.sex = r.sex.value;
      const { error } = await db.from("animal").update(patch).eq("id", r.a.id);
      if(error) failed.push(`${patch.stock_code || codeOf(r.a)} — ${
        error.code === "23505" ? "that tag is already on another animal" : error.message}`);
      else done++;
    }
    S.view = "record";
    if(failed.length){
      await loadHerd();
      throw new Error(`${done} tagged. Not saved: ${failed.join("; ")}`);
    }
    return `${done} head tagged.`;
  });
}

  const setAll = (ids,on) => {
    pick.querySelectorAll(".pick").forEach((b,i) => {
      const a = pick.list[i]; if(!ids.includes(a.id)) return;
      on ? pick.chosen.add(a.id) : pick.chosen.delete(a.id);
      b.setAttribute("aria-pressed", on);
    });
    pick.dispatchEvent(new CustomEvent("pick",{detail:pick.chosen.size}));
  };
  const quick = el(`<div class="chips" style="padding:8px 0 2px"></div>`);
  const groups = [["Everything", () => S.animals.filter(isActive).map(a=>a.id)],["None", () => []]];
  for(const c of [...new Set(S.animals.filter(isActive).map(a=>a.class).filter(Boolean))])
    groups.splice(1,0,[c, () => S.animals.filter(a=>isActive(a)&&a.class===c).map(a=>a.id)]);
  for(const l of [...new Set(S.animals.filter(isActive).map(a=>a.year_letter).filter(Boolean))].sort())
    groups.splice(groups.length-1,0,[`${l} drop`, () => S.animals.filter(a=>isActive(a)&&a.year_letter===l).map(a=>a.id)]);
  for(const [label,fn] of groups){
    const b = el(`<button type="button" class="chip">${esc(label)}</button>`);
    b.onclick = () => { setAll(S.animals.map(a=>a.id), false); if(label!=="None") setAll(fn(), true); };
    quick.appendChild(b);
  }
  inner.appendChild(quick);
  inner.appendChild(pick);
  const count = el(`<p class="hint">No animals selected.</p>`);
  pick.addEventListener("pick", e => count.textContent =
    e.detail===1 ? "1 head selected." : `${e.detail} head selected.`);
  inner.appendChild(count);

  return formShell("Bulk update", inner, async (fd) => {
    const ids = [...pick.chosen];
    if(!ids.length) throw new Error("Choose some animals.");

    const patch = {};
    for(const f of bulkable){
      const v = readField(fd, f, "b_");
      if(v !== null) patch[f[0]] = v;
    }
    const life = fd.get("b_life")||null, cls = fd.get("b_class")||null;
    if(!Object.keys(patch).length && !life && !cls)
      throw new Error("Nothing filled in to change.");

    const changed = [];
    if(Object.keys(patch).length){
      const { error } = await db.from("animal").update(patch).in("id", ids);
      if(error) throw error;
      changed.push(Object.keys(patch).length + " field" + (Object.keys(patch).length===1?"":"s"));
    }
    if(life || cls){
      const { error } = await db.rpc("set_animal_status", {
        p_animal_ids:ids, p_life_state:life, p_class:cls,
        p_on: fd.get("b_on")||today(), p_reason:"Bulk update" });
      if(error) throw error;
      changed.push("status");
    }
    S.view = "record";
    return `${changed.join(" and ")} updated on ${ids.length} head.`;
  });
}

// ─── settings ───────────────────────────────────────────────────
function viewSettings(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<p class="hint" style="padding:14px 14px 0">Switch fields on to see them on an
    animal's page and in the edit form. Off just hides them — nothing is deleted.</p>`));

  const rows = [
    ["Recorded fields", AF.map(f=>[f[0],f[1]])],
    ["Worked out from records", DERIVED.map(d=>[d[0],d[1]])]
  ];
  for(const [title, items] of rows){
    wrap.appendChild(el(`<h3 class="sec">${title}</h3>`));
    const ul = el(`<ul class="rows"></ul>`);
    for(const [k,label] of items){
      const li = el(`<li><button class="row">
        <span class="meta"><span class="nm">${esc(label)}</span></span>
        <span class="rt" style="font-size:22px;color:${shown(k)?"var(--accent)":"var(--rule)"}">${
          shown(k)?"●":"○"}</span></button></li>`);
      li.querySelector("button").onclick = async () => {
        S.prefs.fields[k] = !shown(k);
        await savePrefs(); render();
      };
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
  }

  const reset = el(`<div class="pad"><button class="btn ghost">Back to the standard set</button></div>`);
  reset.querySelector("button").onclick = async () => {
    S.prefs = defaultPrefs(); await savePrefs(); render();
  };
  wrap.appendChild(reset);
  const back = el(`<div class="pad" style="padding-top:0"><button class="btn ghost">Back</button></div>`);
  back.querySelector("button").onclick = () => { S.view="record"; render(); };
  wrap.appendChild(back);
  return wrap;
}

// ═══ login ══════════════════════════════════════════════════════
function viewLogin(msg){
  const wrap = el(`<div class="login">
    <img src="/icon-192.png" alt="" width="76" height="76"
      style="display:block;margin:0 auto 16px;border-radius:17px">
    <div class="mark">Buloke Farm</div>
    <p class="tagline">Cattle records</p>
    <form>
      <label><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label><span>Password</span><input type="password" name="pw" autocomplete="current-password" required></label>
      <button type="submit" class="btn">Sign in</button>
    </form></div>`);
  if(msg) wrap.querySelector("form").before(el(`<div class="msg err">${esc(msg)}</div>`));
  wrap.querySelector("form").onsubmit = async (e) => {
    e.preventDefault();
    const b = e.target.querySelector("button"); b.disabled=true; b.textContent="Signing in…";
    const f = new FormData(e.target);
    const { error } = await db.auth.signInWithPassword({ email:f.get("email"), password:f.get("pw") });
    if(error){ boot(error.message); return; }
    boot();
  };
  return wrap;
}

// ═══ shell ══════════════════════════════════════════════════════
async function render(){
  S.busy = false;
  const app = document.getElementById("app");
  const main = el(`<main></main>`);

  let body;
  if(S.view==="herd")            body = viewHerd();
  else if(S.view==="map")        body = viewMap();
  else if(S.view==="due")        body = await viewDue();
  else if(S.view==="detail")     body = await viewDetail();
  else if(S.view==="record")     body = viewRecord();
  else if(S.view==="rec:weight") body = recWeight();
  else if(S.view==="rec:treatment") body = recTreatment();
  else if(S.view==="rec:calving")   body = recCalving();
  else if(S.view==="rec:joining")   body = recJoining();
  else if(S.view==="rec:shearing")  body = recShearing();
  else if(S.view==="rec:cryo")      body = viewCryo();
  else if(S.view==="rec:cryolot")   body = await viewCryoLot();
  else if(S.view==="rec:cryomove")  body = recCryoMove();
  else if(S.view==="rec:move")      body = recMove();
  else if(S.view==="rec:feed")      body = recFeed();
  else if(S.view==="rec:spray")     body = recSpray();
  else if(S.view==="rec:sell")      body = recSell();
  else if(S.view==="rec:bulk")      body = bulkEdit();
  else if(S.view==="rec:tagdrop")   body = tagDrop();
  else if(S.view==="rec:closedue")  body = closeDue();
  else if(S.view==="rec:settings")  body = viewSettings();
  else if(S.view==="editAnimal")    body = editAnimal();
  else if(S.view==="rec:store")     body = recStore();
  else if(S.view==="rec:newfeed")   body = recNewFeed();
  else if(S.view==="rec:stockadj")  body = recStockAdj();
  main.appendChild(body);

  const onHand = S.animals.filter(isActive).length;
  const header = el(`<header><img class="mark" src="/mark.png" alt=""><h1>Buloke Farm</h1>
    <span class="who">${onHand} head${
      S.me?.display_name ? " · "+esc(S.me.display_name.split(" ")[0]) : ""}</span>
    <button id="navbtn" aria-label="Menu">&#8801;</button></header>`);

  const nav = el(`<nav>
    <button aria-current="${S.view==="herd"||S.view==="detail"}"><b>◉</b>Herd</button>
    <button aria-current="${S.view==="map"}"><b>▦</b>Map</button>
    <button aria-current="${S.view==="due"}"><b>◐</b>Due</button>
    <button aria-current="${S.view.startsWith("rec")}"><b>✎</b>Record</button></nav>`);
  const [bH,bM,bD,bR] = nav.querySelectorAll("button");
  bH.onclick = () => { S.view="herd"; S.sel=null; render(); };
  bM.onclick = () => { S.view="map"; S.selPk=null; render(); };
  bD.onclick = () => { S.view="due"; render(); };
  bR.onclick = () => { S.view="record"; render(); };

  app.replaceChildren(header, main, nav);
}

async function boot(loginErr){
  const app = document.getElementById("app");
  try{
    const { data:{ session } } = await db.auth.getSession();
    if(!session){ app.replaceChildren(viewLogin(loginErr)); return; }
    await loadMe();
    if(!S.me?.active){
      app.replaceChildren(el(`<div class="login"><div class="mark">Buloke Farm</div>
        <div class="msg err" style="margin:20px 0">Your account isn't switched on yet.
        An owner needs to activate it before you can see the herd.</div>
        <button class="btn ghost" onclick="location.reload()">Try again</button></div>`));
      return;
    }
    await loadPrefs();
    await Promise.all([loadHerd(), loadPaddocks(), loadRefs(), loadPending()]);
    render();
  }catch(e){
    // Every path above touches the network, and a cold launch on a weak
    // signal is where it goes wrong. Show the reason and a way to retry;
    // an uncaught throw here leaves the screen white with no explanation.
    app.replaceChildren(el(`<div class="empty"><b>Couldn't load the herd</b>${
      esc(e.message || "Something went wrong.")}
      <br><button class="btn ghost" onclick="location.reload()">Try again</button></div>`));
  }
}

window.__signOut = () => db.auth.signOut();
db.auth.onAuthStateChange((evt) => { if(evt==="SIGNED_OUT") location.reload(); });
boot();
</script>
